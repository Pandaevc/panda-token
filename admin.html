<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - PandaToken</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FF6B35;--accent:#FFD700;--success:#00E676;--dark:#0D0D0D;--darker:#050505;--surface:#1A1A1A;--text:#FFF;--text-muted:#888;--g:linear-gradient(135deg,#FF6B35,#FF9800);--g2:linear-gradient(135deg,#FFD700,#FF9800);--b:1px solid rgba(255,255,255,0.08)}
body{background:var(--darker);color:var(--text);font-family:-apple-system,system-ui;sans-serif;min-height:100vh}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--surface);border-radius:16px;padding:28px;max-width:360px;width:90%;text-align:center;position:relative}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;background:none;border:none;color:#666;font-size:24px;cursor:pointer}
.modal-icon{font-size:48px;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:700;margin-bottom:12px}
.modal-msg{font-size:14px;color:#AAA;margin-bottom:20px;line-height:1.6}
.modal-btn{padding:12px 32px;background:var(--g);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;background:var(--darker)}
header{position:fixed;top:0;inset-x:0;z-index:100;padding:12px 0;background:rgba(5,5,5,0.95);backdrop-filter:blur(20px);border-bottom:var(--b)}
.c{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.logo-icon{width:38px;height:38px;background:var(--g);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo-text{background:var(--g2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-right{display:flex;align-items:center;gap:12px}
.btn{padding:8px 18px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;border:none}
.btn-primary{background:var(--g);color:#fff}
.btn-outline{background:0;border:1px solid var(--primary);color:var(--primary)}
.hero{padding:120px 24px 40px}
h1{font-size:32px;font-weight:700;margin-bottom:30px;text-align:center}
.admin-sec{background:var(--surface);border:var(--b);border-radius:16px;padding:24px;margin:20px auto;max-width:800px}
.admin-sec h2{font-size:18px;margin-bottom:16px;padding-bottom:12px;border-bottom:var(--b)}
.addr-list{display:flex;flex-direction:column;gap:10px;margin:15px 0}
.addr-item{display:flex;align-items:center;justify-content:space-between;background:var(--dark);padding:12px;border-radius:8px}
.addr-item .addr{font-family:monospace;font-size:13px;color:var(--success)}
.addr-item .role{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,107,53,0.2);color:var(--primary)}
.addr-item .role.admin{background:rgba(255,215,0,0.2);color:var(--accent)}
.addr-item .remove{background:none;border:none;color:#ff4757;cursor:pointer;font-size:18px}
.form{display:flex;gap:10px;margin-top:15px}
.form input{flex:1;padding:12px;background:var(--dark);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.stat{background:var(--dark);padding:20px;border-radius:12px;text-align:center}
.stat .v{font-size:24px;font-weight:700;color:var(--accent)}
.stat .l{font-size:12px;color:var(--text-muted);margin-top:8px}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="modal" id="modal">
<div class="modal-box">
<button class="modal-close" onclick="closeModal()">×</button>
<div class="modal-icon" id="modalIcon">✅</div>
<div class="modal-title" id="modalTitle">提示</div>
<div class="modal-msg" id="modalMsg"></div>
<button class="modal-btn" onclick="closeModal()">确定</button>
</div>
</div>

<div class="bg"></div>
<header>
<div class="c">
<div class="logo"><div class="logo-icon">🐼</div><div class="logo-text">PandaToken 管理</div></div>
<div class="header-right">
<a href="index.html" class="btn btn-outline">返回DApp</a>
</div>
</div>
</header>

<section class="hero">
<h1>🏦 基金管理后台</h1>

<div class="stats">
<div class="stat"><div class="v" id="foundationBal">10亿</div><div class="l">基金会</div></div>
<div class="stat"><div class="v" id="liquidityBal">10亿</div><div class="l">底池</div></div>
<div class="stat"><div class="v" id="multiSigCount">0</div><div class="l">多签成员</div></div>
</div>

<div class="admin-sec">
<h2>👥 多签成员管理</h2>
<p style="font-size:13px;color:var(--text-muted);margin-bottom:15px">添加合伙人钱包地址，共同管理基金会和底池资金</p>

<div class="addr-list" id="addrList">
<!-- 地址列表 -->
</div>

<div class="form">
<input type="text" id="newAddr" placeholder="输入TRON钱包地址 (T开头)">
<select id="newRole" style="padding:12px;background:var(--dark);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#fff">
<option value="member">成员</option>
<option value="admin">管理员</option>
</select>
<button class="btn btn-primary" onclick="addMember()">添加</button>
</div>
</div>

<div class="admin-sec">
<h2>📊 资金分布</h2>
<div class="addr-list">
<div class="addr-item">
<span class="addr" id="foundationAddr">待设置</span>
<span class="role">基金会</span>
</div>
<div class="addr-item">
<span class="addr" id="liquidityAddr">待设置</span>
<span class="role">底池</span>
</div>
</div>
</div>

<div class="admin-sec">
<h2>⚙️ 设置</h2>
<div class="form">
<input type="text" id="setFoundation" placeholder="基金会地址">
<button class="btn btn-primary" onclick="setFoundation()">设置</button>
</div>
<div class="form" style="margin-top:10px">
<input type="text" id="setLiquidity" placeholder="底池地址">
<button class="btn btn-primary" onclick="setLiquidity()">设置</button>
</div>
</div>
</section>

<script>
// 多签成员列表
var multiSigMembers = JSON.parse(localStorage.getItem('multiSigMembers') || '[]');

function $(id) {return document.getElementById(id);}

function showModal(title, msg, icon) {
  $('modalTitle').innerText = title;
  $('modalMsg').innerText = msg;
  $('modalIcon').innerText = icon || '✅';
  $('modal').classList.add('show');
}

function closeModal() {
  $('modal').classList.remove('show');
}

function renderList() {
  var list = $('addrList');
  if (multiSigMembers.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px">暂无成员，请添加</p>';
    return;
  }
  
  list.innerHTML = multiSigMembers.map(function(m, i) {
    return '<div class="addr-item">' +
      '<span class="addr">' + m.addr.substring(0, 8) + '...' + m.addr.substring(-4) + '</span>' +
      '<span class="role ' + (m.role === 'admin' ? 'admin' : '') + '">' + (m.role === 'admin' ? '管理员' : '成员') + '</span>' +
      '<button class="remove" onclick="removeMember(' + i + ')">×</button>' +
    '</div>';
  }).join('');
  
  $('multiSigCount').innerText = multiSigMembers.length;
}

function addMember() {
  var addr = $('newAddr').value.trim();
  var role = $('newRole').value;
  
  if (!addr) {
    showModal('⚠️ 请输入地址', '', '⚠️');
    return;
  }
  
  if (!addr.startsWith('T')) {
    showModal('⚠️ 地址格式错误', 'TRON地址以T开头', '⚠️');
    return;
  }
  
  // 检查是否已存在
  if (multiSigMembers.some(function(m) { return m.addr === addr; })) {
    showModal('⚠️ 地址已存在', '', '⚠️');
    return;
  }
  
  multiSigMembers.push({addr: addr, role: role});
  localStorage.setItem('multiSigMembers', JSON.stringify(multiSigMembers));
  
  $('newAddr').value = '';
  renderList();
  showModal('✅ 添加成功', role === 'admin' ? '管理员' : '成员', '✅');
}

function removeMember(index) {
  if (confirm('确定删除该成员?')) {
    multiSigMembers.splice(index, 1);
    localStorage.setItem('multiSigMembers', JSON.stringify(multiSigMembers));
    renderList();
  }
}

function setFoundation() {
  var addr = $('setFoundation').value.trim();
  if (addr) {
    localStorage.setItem('foundationAddr', addr);
    $('foundationAddr').innerText = addr.substring(0, 8) + '...' + addr.substring(-4);
    showModal('✅ 设置成功', '', '✅');
  }
}

function setLiquidity() {
  var addr = $('setLiquidity').value.trim();
  if (addr) {
    localStorage.setItem('liquidityAddr', addr);
    $('liquidityAddr').innerText = addr.substring(0, 8) + '...' + addr.substring(-4);
    showModal('✅ 设置成功', '', '✅');
  }
}

// 初始化
var savedFoundation = localStorage.getItem('foundationAddr');
var savedLiquidity = localStorage.getItem('liquidityAddr');
if (savedFoundation) $('foundationAddr').innerText = savedFoundation.substring(0, 8) + '...' + savedFoundation.substring(-4);
if (savedLiquidity) $('liquidityAddr').innerText = savedLiquidity.substring(0, 8) + '...' + savedLiquidity.substring(-4);

renderList();
</script>
</body>
</html>
