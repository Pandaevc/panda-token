<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:16px}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #333}
th{color:#666;font-size:12px}
.stock-code{color:#FF6B35;font-weight:600}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer;font-size:14px}
.btn-sm{padding:6px 12px;font-size:12px;margin-left:8px}
.btn-green{background:#2ED573}
.btn-red{background:#FF4757}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.search-box input{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-box{background:#1A1A1A;padding:24px;border-radius:16px;width:600px;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-close{background:none;border:none;color:#666;font-size:24px;cursor:pointer}
.drop-zone{border:2px dashed #333;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all 0.3s}
.drop-zone:hover{border-color:#FF6B35;background:rgba(255,107,53,0.1)}
.drop-zone .icon{font-size:48px;margin-bottom:12px}
.analysis-item{padding:14px;background:#0D0D0D;border-radius:8px;margin-bottom:10px}
.analysis-item .label{color:#666;font-size:12px;margin-bottom:6px}
.analysis-item .value{font-size:15px}
.match{color:#2ED573}
.not-match{color:#FF4757}
.warning{background:rgba(255,71,87,0.2);border-left:3px solid #FF4757}
.safe{background:rgba(46,213,115,0.2);border-left:3px solid #2ED573}
.price-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.price-item{background:#0D0D0D;padding:12px;border-radius:8px}
.price-item .label{color:#666;font-size:12px}
.price-item .value{font-size:18px;font-weight:600}
.price-item .value.up{color:#FF4757}
.price-item .value.down{color:#2ED573}
.alert-badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;margin-right:4px}
.alert-red{background:rgba(255,71,87,0.2);color:#FF4757}
.alert-green{background:rgba(46,213,115,0.2);color:#2ED573}
@media(max-width:1000px){.nav{display:none}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screen')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('import')">📷 导入</a>
<a href="#" onclick="showPage('analyzer')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 今日概览</h2>
<div class="stats">
<div class="stat"><div class="v" id="todayScreen">0</div><div class="l">今日选出</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总收益率</div></div>
<div class="stat"><div class="v" id="alertCount">0</div><div class="l">待处理提醒</div></div>
</div>
<div class="card">
<h3>📋 今日选股结果 <button class="btn btn-sm" onclick="showPage('screen')">更多</button></h3>
<div id="screenList"></div>
</div>
<div class="card">
<h3>⚠️ 持仓提醒</h3>
<div id="alertList"></div>
</div>
</div>

<!-- Screener -->
<div id="page-screen" style="display:none">
<h2 style="margin-bottom:20px">🔍 条件选股</h2>
<div class="card">
<h3>选择选股条件</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0">
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond1" checked> 90%筹码集中度 11-15%</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond2" checked> 70%筹码集中度 4-10%</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond3" checked> 10日内涨停过</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond4"> 今日涨停</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond5" checked> 市值>50亿</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond6"> CCI上移</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond7"> KDJ金叉</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond8"> 量比>1</label>
</div>
<button class="btn" onclick="runScreen()">🔍 开始选股</button>
</div>
<div class="card" id="screenResult" style="display:none">
<h3>选股结果</h3>
<div id="resultList"></div>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" id="addStock" placeholder="输入股票代码 (如: 600519)">
<button class="btn" onclick="addPortfolio()">➕ 添加</button>
</div>
<div class="card">
<h3>当前持仓 <span id="portfolioStats" style="color:#666;font-size:14px;font-weight:normal"></span></h3>
<div id="portfolioList"></div>
</div>
</div>

<!-- Import -->
<div id="page-import" style="display:none">
<h2 style="margin-bottom:20px">📷 图片导入持仓</h2>
<div class="card">
<h3>上传持仓截图</h3>
<div class="drop-zone" onclick="document.getElementById('fileInput').click()">
<div class="icon">📷</div>
<div>点击上传图片 或 拖拽到此处</div>
<div style="color:#666;font-size:12px;margin-top:8px">支持 JPG, PNG 格式</div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
</div>
<div class="card" id="importResult" style="display:none">
<h3>识别结果</h3>
<div id="importList"></div>
<button class="btn" style="margin-top:16px" onclick="confirmImport()">✅ 确认导入</button>
</div>
</div>

<!-- Analyzer -->
<div id="page-analyzer" style="display:none">
<h2 style="margin-bottom:20px">📈 个股深度分析</h2>
<div class="search-box">
<input type="text" id="analyzeStock" placeholder="输入股票代码 (如: 600519)">
<button class="btn" onclick="analyzeStock()">🔍 分析</button>
</div>
<div id="analysisResult" style="display:none"></div>
</div>
</div>

<script>
// 模拟股票数据
var mockStocks = [
  {code:'600519',name:'贵州茅台',price:1850,change:2.5,chip90:12.5,chip70:6.8,limitUpDays:3,sector:'白酒',market:23000,volume:2.1,amount:38000000000},
  {code:'000858',name:'五粮液',price:168,change:1.8,chip90:14.2,chip70:8.1,limitUpDays:2,sector:'白酒',market:650,volume:1.8,amount:12000000000},
  {code:'601318',name:'中国平安',price:48,change:-0.5,chip90:11.8,chip70:5.2,limitUpDays:0,sector:'保险',market:8800,volume:0.9,amount:4200000000},
  {code:'300750',name:'宁德时代',price:520,change:3.2,chip90:15.8,chip70:9.5,limitUpDays:5,sector:'新能源',market:12000,volume:2.5,amount:30000000000},
  {code:'002594',name:'比亚迪',price:268,change:2.1,chip90:13.2,chip70:7.8,limitUpDays:4,sector:'汽车',market:7800,volume:2.0,amount:16000000000},
  {code:'600036',name:'招商银行',price:42,change:0.8,chip90:10.5,chip70:4.5,limitUpDays:1,sector:'银行',market:11000,volume:1.2,amount:5000000000},
  {code:'000333',name:'美的集团',price:65,change:1.2,chip90:11.2,chip70:5.8,limitUpDays:2,sector:'家电',market:4500,volume:1.5,amount:7000000000},
];

var db = {portfolio: [], alerts: []};

// 计算止损止盈
function calcStopLoss(buyPrice) {
  // 根据Boss的策略：止损通常是-5%到-8%
  return {
    stopLoss: (buyPrice * 0.92).toFixed(2),  // 8%止损
    stopLoss8: (buyPrice * 0.92).toFixed(2),
    stopLoss5: (buyPrice * 0.95).toFixed(2),
    takeProfit1: (buyPrice * 1.05).toFixed(2),  // 5%止盈
    takeProfit2: (buyPrice * 1.10).toFixed(2), // 10%止盈
    takeProfit3: (buyPrice * 1.15).toFixed(2), // 15%止盈
  };
}

// 加载数据
function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  render();
}
function saveData() {localStorage.setItem('stock_db', JSON.stringify(db)); render();}

// 渲染
function render() {
  document.getElementById('todayScreen').innerText = mockStocks.length;
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  // 计算收益率
  var totalProfit = 0;
  db.portfolio.forEach(function(p) {
    var stock = mockStocks.find(function(s) {return s.code === p.code});
    if (stock) {
      totalProfit += (stock.price - p.buyPrice) / p.buyPrice * 100;
    }
  });
  document.getElementById('profit').innerText = (db.portfolio.length ? (totalProfit / db.portfolio.length).toFixed(2) : 0) + '%';
  
  // 渲染选股结果
  document.getElementById('screenList').innerHTML = mockStocks.slice(0,3).map(function(s) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px"><div><span class="stock-code">'+s.code+'</span> <span style="color:#888">'+s.name+'</span></div><div><span class="up">'+s.change+'%</span> <span style="color:#666;font-size:12px">'+s.chip90+'%筹码</span></div></div>';
  }).join('');
  
  // 渲染持仓
  if (db.portfolio.length === 0) {
    document.getElementById('portfolioList').innerHTML = '<div style="text-align:center;color:#666;padding:40px">暂无持仓</div>';
  } else {
    document.getElementById('portfolioList').innerHTML = db.portfolio.map(function(p) {
      var stock = mockStocks.find(function(s) {return s.code === p.code});
      var current = stock ? stock.price : 0;
      var profit = ((current - p.buyPrice) / p.buyPrice * 100).toFixed(2);
      var stop = calcStopLoss(p.buyPrice);
      var isLoss = profit < 0;
      
      return '<div class="'+(isLoss?'warning':'safe')+'" style="padding:16px;border-radius:8px;margin-bottom:12px">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:12px">'+
          '<div><span class="stock-code" style="font-size:16px">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div>'+
          '<div class="'+(profit>=0?'up':'down')+'" style="font-size:18px;font-weight:600">'+profit+'%</div>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px;color:#888">'+
          '<div>买入<div style="color:#FFF">'+p.buyPrice+'</div></div>'+
          '<div>现价<div style="color:#FFF">'+current+'</div></div>'+
          '<div>止损<div style="color:#FF4757">'+stop.stopLoss+'</div></div>'+
          '<div>止盈<div style="color:#2ED573">'+stop.takeProfit2+'</div></div>'+
        '</div>'+
        '<div style="margin-top:12px;display:flex;gap:8px">'+
          '<button class="btn btn-sm btn-red" onclick="removePortfolio(\''+p.code+'\')">卖出</button>'+
          '<button class="btn btn-sm" onclick="analyzeStock2(\''+p.code+'\')">分析</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  
  // 渲染提醒
  var alerts = db.portfolio.filter(function(p) {
    var stock = mockStocks.find(function(s) {return s.code === p.code});
    if (!stock) return false;
    var profit = (stock.price - p.buyPrice) / p.buyPrice * 100;
    return profit <= -5 || profit >= 10;
  });
  document.getElementById('alertCount').innerText = alerts.length;
  document.getElementById('alertList').innerHTML = alerts.length ? alerts.map(function(p) {
    var stock = mockStocks.find(function(s) {return s.code === p.code});
    var profit = ((stock.price - p.buyPrice) / p.buyPrice * 100).toFixed(2);
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'+
      '<div><span class="stock-code">'+p.code+'</span> <span class="alert-badge '+(profit<0?'alert-red':'alert-green')+'">'+(profit<0?'止损提醒':'止盈提醒')+'</span></div>'+
      '<div class="'+(profit<0?'down':'up')+'">'+profit+'%</div></div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:20px">暂无提醒</div>';
}

function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screen,#page-portfolio,#page-import,#page-analyzer').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
}

// 选股
function runScreen() {
  var results = mockStocks.filter(function(s) {
    var pass = true;
    if (document.getElementById('cond1').checked) pass = pass && s.chip90 >= 11 && s.chip90 <= 15;
    if (document.getElementById('cond2').checked) pass = pass && s.chip70 >= 4 && s.chip70 <= 10;
    if (document.getElementById('cond3').checked) pass = pass && s.limitUpDays > 0;
    if (document.getElementById('cond4').checked) pass = pass && s.change > 9;
    if (document.getElementById('cond5').checked) pass = pass && s.market > 50;
    return pass;
  });
  
  document.getElementById('screenResult').style.display = 'block';
  document.getElementById('resultList').innerHTML = results.length ? results.map(function(s) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0D0D0D;border-radius:8px;margin-bottom:8px">'+
      '<div><span class="stock-code">'+s.code+'</span> <span style="color:#888">'+s.name+'</span> <span style="color:#666;font-size:12px">'+s.sector+'</span></div>'+
      '<div style="display:flex;gap:20px;align-items:center"><span class="'+(s.change>=0?'up':'down')+'" style="font-size:16px">'+s.change+'%</span><button class="btn btn-sm" onclick="addToPortfolio(\''+s.code+'\')">➕持仓</button></div></div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:40px">没有符合条件的股票</div>';
}

// 持仓管理
function addPortfolio() {
  var code = document.getElementById('addStock').value.trim();
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (!stock) {
    alert('未找到股票，请检查代码');
    return;
  }
  var buyPrice = prompt('买入价格:', stock.price);
  if (buyPrice) {
    db.portfolio.push({code:stock.code,name:stock.name,buyPrice:parseFloat(buyPrice)});
    saveData();
    document.getElementById('addStock').value = '';
  }
}

function addToPortfolio(code) {
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (stock) {
    var buyPrice = prompt('买入价格:', stock.price);
    if (buyPrice) {
      db.portfolio.push({code:stock.code,name:stock.name,buyPrice:parseFloat(buyPrice)});
      saveData();
    }
  }
}

function removePortfolio(code) {
  if (confirm('确认卖出?')) {
    db.portfolio = db.portfolio.filter(function(p) {return p.code !== code});
    saveData();
  }
}

// 图片导入
function handleImageUpload(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  // 模拟识别结果
  var result = mockStocks.slice(0, 3).map(function(s) {
    return {code: s.code, name: s.name, price: s.price, selected: true};
  });
  
  window.importData = result;
  
  document.getElementById('importResult').style.display = 'block';
  document.getElementById('importList').innerHTML = result.map(function(r) {
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px">'+
      '<input type="checkbox" checked data-code="'+r.code+'">'+
      '<div style="flex:1"><span class="stock-code">'+r.code+'</span> <span style="color:#888">'+r.name+'</span></div>'+
      '<input type="number" value="'+r.price+'" data-code="'+r.code+'" style="width:80px;padding:6px;background:#1A1A1A;border:1px solid #333;border-radius:4px;color:#FFF" placeholder="买入价">'+
    '</div>';
  }).join('');
}

function confirmImport() {
  var checkboxes = document.querySelectorAll('#importList input[type="checkbox"]:checked');
  var prices = {};
  document.querySelectorAll('#importList input[type="number"]').forEach(function(input) {
    prices[input.dataset.code] = parseFloat(input.value);
  });
  
  checkboxes.forEach(function(cb) {
    var code = cb.dataset.code;
    var stock = mockStocks.find(function(s) {return s.code === code});
    if (stock && prices[code]) {
      db.portfolio.push({code:stock.code,name:stock.name,buyPrice:prices[code]});
    }
  });
  
  saveData();
  alert('导入成功!');
  document.getElementById('importResult').style.display = 'none';
}

// 分析
function analyzeStock() {
  var code = document.getElementById('analyzeStock').value.trim();
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (!stock) {alert('未找到'); return;}
  showAnalysis(stock);
}

function analyzeStock2(code) {
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (stock) showAnalysis(stock);
}

function showAnalysis(stock) {
  var stop = calcStopLoss(stock.price);
  
  var html = '<div class="card">'+
    '<h3>'+stock.code+' '+stock.name+'</h3>'+
    '<div style="font-size:32px;font-weight:700;margin:16px 0" class="'+(stock.change>=0?'up':'down')+'">'+stock.price+' <span style="font-size:16px">'+(stock.change>=0?'+':'')+stock.change+'%</span></div>'+
    
    '<h4 style="margin:20px 0 12px">📊 筹码分析</h4>'+
    '<div class="analysis-item"><div class="label">90%筹码集中度</div><div class="value '+(stock.chip90>=11&&stock.chip90<=15?'match':'not-match')+'">'+stock.chip90+'% '+(stock.chip90>=11&&stock.chip90<=15?'✅ 符合':'❌ 不符合')+'</div></div>'+
    '<div class="analysis-item"><div class="label">70%筹码集中度</div><div class="value '+(stock.chip70>=4&&stock.chip70<=10?'match':'not-match')+'">'+stock.chip70+'% '+(stock.chip70>=4&&stock.chip70<=10?'✅ 符合':'❌ 不符合')+'</div></div>'+
    
    '<h4 style="margin:20px 0 12px">💰 止损止盈计算</h4>'+
    '<div class="price-info">'+
      '<div class="price-item"><div class="label">止损-8%</div><div class="value down">'+stop.stopLoss8+'</div></div>'+
      '<div class="price-item"><div class="label">止损-5%</div><div class="value down">'+stop.stopLoss5+'</div></div>'+
      '<div class="price-item"><div class="label">止盈+5%</div><div class="value up">'+stop.takeProfit1+'</div></div>'+
      '<div class="price-item"><div class="label">止盈+10%</div><div class="value up">'+stop.takeProfit2+'</div></div>'+
    '</div>'+
    
    '<button class="btn" style="margin-top:20px;width:100%" onclick="addToPortfolio(\''+stock.code+'\')">➕ 添加到持仓</button>'+
  '</div>';
  
  document.getElementById('analysisResult').innerHTML = html;
  document.getElementById('analysisResult').style.display = 'block';
}

loadData();
</script>
</body>
</html>
