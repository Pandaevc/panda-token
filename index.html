<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:16px;flex-wrap:wrap}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px}
.stock-code{color:#FF6B35;font-weight:600;cursor:pointer}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer}
.btn-sm{padding:6px 12px;font-size:12px}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.kline-box{height:350px;background:#0D0D0D;border-radius:8px;margin:12px 0}
.loading{text-align:center;padding:30px;color:#666}
.strategy-card{background:linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,215,0,0.1));border:1px solid rgba(255,107,53,0.3);border-radius:12px;padding:20px;margin-bottom:24px}
.strategy-card h3{color:#FF6B35;margin-bottom:12px}
.strategy-card p{color:#888;font-size:14px;line-height:1.6;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:4px}
.tag-green{background:rgba(46,213,115,0.2);color:#2ED573}
.tag-red{background:rgba(255,71,87,0.2);color:#FF4757}
.tag-blue{background:rgba(0,150,255,0.2);color:#0096FF}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#1A1A1A;padding:24px;border-radius:16px;max-width:90%;max-height:90%;overflow:auto}
@media(max-width:1000px){.nav{display:none}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screener')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('watchlist')">⭐ 自选股</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 仪表盘</h2>
<div class="stats">
<div class="stat"><div class="v" id="pickCount">0</div><div class="l">今日精选</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总盈亏</div></div>
<div class="stat"><div class="v" id="needAction">0</div><div class="l">待操作</div></div>
</div>

<!-- 策略一 -->
<div class="strategy-card">
<h3>📊 策略一：AI综合精选（每日1只）</h3>
<p>基于2025年回测数据，结合量价关系、资金流向、技术形态的综合分析</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<span class="tag tag-green">量价齐升</span>
<span class="tag tag-green">资金净流入</span>
<span class="tag tag-green">非ST</span>
</div>
<button class="btn" onclick="runStrategy1()">🎯 生成今日推荐</button>
<div id="strategy1Result" style="margin-top:16px"></div>
</div>

<!-- 策略二 -->
<div class="strategy-card">
<h3>🎯 策略二：强势回调策略（每日3只）</h3>
<p>条件：10日内有涨停→涨停次日放量上涨无长上影→第三日缩量一半内仍在上涨→热点板块</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<span class="tag tag-blue">10日涨停</span>
<span class="tag tag-blue">放量上涨</span>
<span class="tag tag-blue">无长上影</span>
<span class="tag tag-blue">缩量回调</span>
</div>
<button class="btn" onclick="runStrategy2()">🔍 筛选股票</button>
<div id="strategy2Result" style="margin-top:16px"></div>
</div>

<div class="card"><h3>⚠️ 持仓提醒</h3><div id="alertList"></div></div>
</div>

<!-- Screener -->
<div id="page-screener" style="display:none">
<h2 style="margin-bottom:20px">🔍 快速筛选</h2>
<div class="card">
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="filterNoST" checked> 去掉ST</label>
<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="filterRise"> 涨幅>3%</label>
</div>
<button class="btn" onclick="quickFilter()">🔍 筛选</button>
<div id="quickResult" style="margin-top:16px"></div>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" id="addStock" placeholder="输入股票代码">
<button class="btn" onclick="addPortfolio()">➕ 添加</button>
</div>
<div id="portfolioList"></div>
</div>

<!-- Watchlist -->
<div id="page-watchlist" style="display:none">
<h2 style="margin-bottom:20px">⭐ 自选股</h2>
<div class="search-box">
<input type="text" id="watchCode" placeholder="输入股票代码">
<button class="btn" onclick="addWatch()">➕ 添加</button>
</div>
<div id="watchlistList"></div>
</div>
</div>

<!-- K线Modal -->
<div id="klineModal" class="modal">
<div class="modal-content" style="width:800px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h3 id="modalStockName">股票分析</h3>
<button class="btn" onclick="document.getElementById('klineModal').style.display='none'">✕ 关闭</button>
</div>
<div id="modalKline" style="height:350px"></div>
<div id="modalAnalysis"></div>
</div>
</div>

<script>
var allStocks = [];
var stockCache = {};

async function getStockData(code) {
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2.eastmoney.com/api/qt/stock/get?fltt=2&fields=f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13,f14,f15,f16,f17,f18,f20,f21,f22,f23,f24,f25,f37,f38,f39,f40,f41,f42,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f62,f84,f85,f86,f87,f88,f89,f90,f91,f92,f93,f94,f95,f96,f97,f98,f99,f100,f101,f102,f103,f104,f105,f106,f107,f108,f109,f110,f111,f112,f113,f114,f115,f116,f117,f118,f119,f120,f121,f122,f123,f124,f125,f126,f127,f128,f129,f130,f131,f132,f133,f134,f135,f136,f137,f138,f139,f140,f141,f142,f143,f144,f145,f146,f147,f148,f149,f150,f151,f152,f153,f154,f155,f156,f157,f158,f159,f160,f161,f162,f163,f164,f165,f166,f167,f168,f169,f170,f171,f173,f174,f175,f176,f177,f178,f179,f180,f181,f182,f183,f184,f185,f186,f187,f188,f189,f190,f191,f192,f193,f194,f195,f196,f197,f198,f199,f200,f201,f202,f203,f204,f205,f206,f207,f208,f209,f210,f211,f212,f213,f214,f215,f216,f217,f218,f219,f220,f221,f222,f223,f224,f225&secid=' + secid;
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data) {
      var d = data.data;
      var name = d.f58 || '';
      return {code: code, name: name, price: d.f43, change: d.f170, volume: d.f47/10000, amount: d.f48/100000000, turnover: d.f50, market: d.f116/100000000, high: d.f44, low: d.f45, open: d.f46, isST: name.includes('ST') || name.includes('*ST'), up: d.f44 === d.f60, mainMoney: d.f184||0, superMoney: d.f185||0, largeMoney: d.f186||0};
    }
  } catch(e) {}
  return null;
}

async function getStockWithHistory(code) {
  var stock = await getStockData(code);
  if (!stock) return null;
  
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20260101&end=20260221&lmt=15';
  
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      stock.history = data.data.klines.map(k => k.split(','));
    }
  } catch(e) {}
  
  return stock;
}

async function loadAllStocks() {
  var codes = [];
  for (var i = 600000; i < 604000; i++) codes.push(i.toString());
  for (var i = 300000; i < 303000; i++) codes.push(i.toString());
  for (var i = 688000; i < 692000; i++) codes.push(i.toString());
  for (var i = 0; i < 3000; i++) codes.push(i.toString().padStart(6,'0'));
  
  allStocks = [];
  
  for (var i = 0; i < Math.min(codes.length, 150); i += 15) {
    var promises = codes.slice(i, i+15).map(c => getStockWithHistory(c));
    var results = await Promise.all(promises);
    results.forEach(function(s) {
      if (s && s.price > 0) {
        allStocks.push(s);
        stockCache[s.code] = s;
      }
    });
  }
}

// 策略一：AI综合精选
async function runStrategy1() {
  if (allStocks.length === 0) await loadAllStocks();
  
  document.getElementById('strategy1Result').innerHTML = '<div class="loading">AI分析中...</div>';
  
  var results = allStocks.filter(s => !s.isST && s.change > 0).map(function(s) {
    var score = 0;
    score += Math.min(s.change, 10);
    var money = (s.mainMoney + s.superMoney + s.largeMoney) / 10000;
    if (money > 0) score += Math.min(money / 100, 5);
    score += Math.min(s.turnover / 2, 5);
    
    if (s.history && s.history.length >= 3) {
      var today = s.history[s.history.length - 1];
      var yesterday = s.history[s.history.length - 2];
      var todayVol = parseFloat(today[5]);
      var yesVol = parseFloat(yesterday[5]);
      var todayClose = parseFloat(today[2]);
      var yesterdayClose = parseFloat(yesterday[2]);
      
      if (todayVol > yesVol * 1.2 && todayClose > yesterdayClose) score += 5;
    }
    
    return {stock: s, score: score};
  });
  
  results.sort(function(a, b) { return b.score - a.score; });
  
  var top = results[0];
  if (top) {
    var s = top.stock;
    var money = (s.mainMoney + s.superMoney + s.largeMoney) / 10000;
    document.getElementById('strategy1Result').innerHTML = '<div style="background:#0D0D0D;padding:20px;border-radius:12px"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="stock-code" style="font-size:24px" onclick="showKLine(\''+s.code+'\')">'+s.code+'</span> <span style="font-size:18px;color:#888">'+s.name+'</span></div><div class="up" style="font-size:28px;font-weight:700">'+(s.change||0).toFixed(2)+'%</div></div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div style="background:#1A1A1A;padding:12px;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">换手率</div><div style="font-weight:600">'+(s.turnover||0).toFixed(1)+'%</div></div><div style="background:#1A1A1A;padding:12px;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">主力净流入</div><div style="font-weight:600'+(money>=0?'color:#2ED573':'color:#FF4757')+'">'+(money>=0?'+':'')+money.toFixed(0)+'万</div></div><div style="background:#1A1A1A;padding:12px;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">市值</div><div style="font-weight:600">'+(s.market||0).toFixed(0)+'亿</div></div></div></div>';
  }
}

// 策略二：强势回调
async function runStrategy2() {
  if (allStocks.length === 0) await loadAllStocks();
  
  document.getElementById('strategy2Result').innerHTML = '<div class="loading">AI分析中...</div>';
  
  var results = [];
  
  for (var s of allStocks) {
    if (s.isST || !s.history || s.history.length < 3) continue;
    
    var h = s.history;
    var d3 = h[h.length - 1], d2 = h[h.length - 2], d1 = h[h.length - 3];
    
    var hasLimitUp = false;
    for (var i = 0; i < Math.min(h.length, 10); i++) {
      var open = parseFloat(h[i][1]), close = parseFloat(h[i][2]);
      if (open > 0 && (close - open) / open * 100 >= 9.9) { hasLimitUp = true; break; }
    }
    if (!hasLimitUp) continue;
    
    var d2Pct = (parseFloat(d2[2]) - parseFloat(d2[1])) / parseFloat(d2[1]) * 100;
    var d2Shadow = (parseFloat(d2[3]) - parseFloat(d2[2])) / parseFloat(d2[2]) * 100;
    var d2Vol = parseFloat(d2[5]), d1Vol = parseFloat(d1[5]);
    if (d2Pct < 9.9 || d2Vol <= d1Vol * 1.2 || d2Shadow > 2) continue;
    
    var d3Vol = parseFloat(d3[5]), d3Close = parseFloat(d3[2]), d2Close = parseFloat(d2[2]);
    if (d3Vol > d2Vol * 0.5 || d3Close < d2Close) continue;
    
    results.push(s);
    if (results.length >= 3) break;
  }
  
  if (results.length === 0) {
    document.getElementById('strategy2Result').innerHTML = '<div style="color:#666;padding:20px;text-align:center">没有符合条件的股票</div>';
    return;
  }
  
  document.getElementById('strategy2Result').innerHTML = results.map(function(s, i) {
    return '<div style="background:#0D0D0D;padding:16px;border-radius:12px;margin-bottom:12px"><div style="display:flex;justify-content:space-between"><div><span style="color:#FF6B35;font-weight:700;margin-right:8px">'+(i+1)+'</span><span class="stock-code" onclick="showKLine(\''+s.code+'\')">'+s.code+'</span> <span style="color:#888">'+s.name+'</span></div><span class="up" style="font-weight:600">'+(s.change||0).toFixed(2)+'%</span></div></div>';
  }).join('');
}

function quickFilter() {
  if (allStocks.length === 0) { loadAllStocks(); return; }
  
  var rise3 = document.getElementById('filterRise').checked;
  var noST = document.getElementById('filterNoST').checked;
  
  var results = allStocks.filter(function(s) {
    if (noST && s.isST) return false;
    if (rise3 && s.change < 3) return false;
    return true;
  }).sort(function(a, b) { return b.change - a.change; }).slice(0, 20);
  
  document.getElementById('quickResult').innerHTML = results.map(function(s) {
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between"><div><span class="stock-code" onclick="showKLine(\''+s.code+'\')">'+s.code+'</span> <span style="color:#888">'+s.name+'</span></div><span class="'+(s.change>=0?'up':'down')+'" style="font-weight:600">'+(s.change||0).toFixed(2)+'%</span></div>';
  }).join('') || '<div style="color:#666">无</div>';
}

var db = {portfolio: [], picks: [], watchlist: ['600519', '000858', '300750']};

function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  loadAll();
}

async function loadAll() {
  var codes = [...new Set([...db.portfolio.map(p=>p.code),...db.watchlist])];
  for (var code of codes) {
    if (!stockCache[code]) {
      var data = await getStockWithHistory(code);
      if (data) stockCache[code] = data;
    }
  }
  render();
}

function saveData() {
  localStorage.setItem('stock_db', JSON.stringify(db));
  render();
}

function render() {
  document.getElementById('pickCount').innerText = db.picks.length;
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  var totalProfit = 0;
  db.portfolio.forEach(function(p) {
    var s = stockCache[p.code];
    if (s) totalProfit += (s.price - p.buyPrice) / p.buyPrice * 100;
  });
  document.getElementById('profit').innerText = (db.portfolio.length ? (totalProfit / db.portfolio.length).toFixed(1) : 0) + '%';
  
  var alerts = db.portfolio.filter(function(p) {
    var s = stockCache[p.code];
    if (!s) return false;
    return ((s.price - p.buyPrice) / p.buyPrice * 100) <= -3 || ((s.price - p.buyPrice) / p.buyPrice * 100) >= 10;
  });
  document.getElementById('needAction').innerText = alerts.length;
  document.getElementById('alertList').innerHTML = alerts.length ? alerts.map(function(p) {
    var s = stockCache[p.code];
    var profit = ((s.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between"><span>'+p.code+'</span><span class="'+(profit<0?'down':'up')+'">'+profit+'%</span></div>';
  }).join('') : '<div style="color:#666;text-align:center">暂无提醒</div>';
  
  document.getElementById('portfolioList').innerHTML = db.portfolio.length ? db.portfolio.map(function(p) {
    var s = stockCache[p.code];
    if (!s) return '';
    var profit = ((s.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
    return '<div class="card" style="cursor:pointer" onclick="showKLine(\''+p.code+'\')"><div style="display:flex;justify-content:space-between"><div><span class="stock-code">'+p.code+'</span> <span style="color:#888">'+s.name+'</span></div><span class="'+(profit>=0?'up':'down')+'">'+profit+'%</span></div></div>';
  }).join('') : '<div class="card"><div style="color:#666;text-align:center">暂无持仓</div></div>';
  
  document.getElementById('watchlistList').innerHTML = db.watchlist.map(function(code) {
    var s = stockCache[code];
    return '<div class="card" style="cursor:pointer" onclick="showKLine(\''+code+'\')"><div style="display:flex;justify-content:space-between"><div><span class="stock-code">'+code+'</span> '+(s?s.name:'加载中...')+'</div>'+(s?'<span class="'+(s.change>=0?'up':'down')+'">'+(s.change||0).toFixed(2)+'%</span>':'')+'</div></div>';
  }).join('');
}

function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screener,#page-portfolio,#page-watchlist').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
}

function addPortfolio() {
  var code = document.getElementById('addStock').value.trim();
  if (!code) return;
  getStockWithHistory(code).then(function(s) {
    if (s) {
      var price = prompt('买入价格:', s.price);
      if (price) {
        db.portfolio.push({code: code, name: s.name, buyPrice: parseFloat(price)});
        stockCache[code] = s;
        saveData();
      }
    }
  });
}

function addWatch() {
  var code = document.getElementById('watchCode').value.trim();
  if (code && !db.watchlist.includes(code)) {
    db.watchlist.push(code);
    getStockWithHistory(code).then(function(s) { if (s) stockCache[code] = s; render(); });
    saveData();
  }
}

async function showKLine(code) {
  var s = stockCache[code];
  if (!s) { s = await getStockWithHistory(code); if (s) stockCache[code] = s; }
  
  document.getElementById('modalStockName').innerText = s.code + ' ' + s.name;
  document.getElementById('klineModal').style.display = 'flex';
  
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260221&lmt=60';
  
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      var klines = data.data.klines;
      var dates = [], closes = [], volumes = [];
      klines.forEach(function(kl) {
        var arr = kl.split(',');
        dates.push(arr[0]);
        closes.push(parseFloat(arr[2]));
        volumes.push(parseFloat(arr[5]));
      });
      
      Plotly.newPlot('modalKline', [
        {x: dates, y: closes, type: 'scatter', mode: 'lines', line: {color: '#FF6B35'}, name: '收盘价'},
        {x: dates, y: volumes, type: 'bar', yaxis: 'y2', marker: {color: 'rgba(255,107,53,0.5)'}, name: '成交量'}
      ], {paper_bgcolor: '#0D0D0D', plot_bgcolor: '#0D0D0D', xaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'}, yaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'}, yaxis2: {tickcolor: '#333', tickfont: {color: '#888'}, overlaying: 'y', side: 'right'}}, {responsive: true});
    }
  } catch(e) {}
  
  var money = ((s.mainMoney||0)+(s.superMoney||0)+(s.largeMoney||0))/10000;
  document.getElementById('modalAnalysis').innerHTML = '<div style="margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">现价</div><div style="font-weight:600">'+(s.price||'-')+'</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">涨跌幅</div><div style="font-weight:600'+(s.change>=0?'color:#FF4757':'color:#2ED573')+'">'+(s.change||0).toFixed(2)+'%</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">换手率</div><div style="font-weight:600">'+(s.turnover||0).toFixed(1)+'%</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">主力净流入</div><div style="font-weight:600'+(money>=0?'color:#2ED573':'color:#FF4757')+'">'+(money>=0?'+':'')+money.toFixed(0)+'万</div></div></div>';
}

loadData();
</script>
</body>
</html>
