<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:16px}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}
.stock-code{color:#FF6B35;font-weight:600}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer;font-size:14px}
.btn-sm{padding:6px 12px;font-size:12px;margin-left:8px}
.btn-green{background:#2ED573}
.btn-red{background:#FF4757}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.search-box input{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-box{background:#1A1A1A;padding:24px;border-radius:16px;width:700px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-close{background:none;border:none;color:#666;font-size:24px;cursor:pointer}
.drop-zone{border:2px dashed #333;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all 0.3s}
.drop-zone:hover{border-color:#FF6B35}
.tech-box{background:#0D0D0D;padding:16px;border-radius:8px;margin-bottom:12px}
.tech-box .label{color:#666;font-size:12px;margin-bottom:8px}
.tech-box .value{font-size:15px;font-weight:600}
.tech-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}
.tech-row:last-child{border:none}
.level-tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;margin-right:8px}
.level-sup{background:rgba(46,213,115,0.2);color:#2ED573}
.level-res{background:rgba(255,71,87,0.2);color:#FF4757}
.level-now{background:rgba(255,215,0,0.2);color:#FFD700}
.action-box{padding:14px;border-radius:8px;margin-top:12px}
.action-buy{background:rgba(46,213,115,0.15);border-left:3px solid #2ED573}
.action-sell{background:rgba(255,71,87,0.15);border-left:3px solid #FF4757}
.action-wait{background:rgba(255,215,0,0.15);border-left:3px solid #FFD700}
.action-reduce{background:rgba(255,165,0,0.15);border-left:3px solid #FFA500}
@media(max-width:1000px){.nav{display:none}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('import')">📷 导入</a>
<a href="#" onclick="showPage('analyzer')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 持仓监控</h2>
<div class="stats">
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总盈亏</div></div>
<div class="stat"><div class="v" id="needAction">0</div><div class="l">待操作</div></div>
<div class="stat"><div class="v" id="safeCount">0</div><div class="l">安全</div></div>
</div>
<div class="card">
<h3>⚠️ 需要关注的股票</h3>
<div id="alertList"></div>
</div>
<div class="card">
<h3>✅ 安全持有</h3>
<div id="safeList"></div>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" id="addStock" placeholder="输入股票代码 (如: 600519)">
<button class="btn" onclick="addPortfolio()">➕ 添加</button>
</div>
<div id="portfolioList"></div>
</div>

<!-- Import -->
<div id="page-import" style="display:none">
<h2 style="margin-bottom:20px">📷 图片导入持仓</h2>
<div class="card">
<div class="drop-zone" onclick="document.getElementById('fileInput').click()">
<div style="font-size:48px;margin-bottom:12px">📷</div>
<div>点击上传持仓截图</div>
<div style="color:#666;font-size:12px;margin-top:8px">支持 JPG, PNG</div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
</div>
<div class="card" id="importResult" style="display:none">
<h3>识别结果</h3>
<div id="importList"></div>
<button class="btn" style="margin-top:16px" onclick="confirmImport()">✅ 确认导入</button>
</div>
</div>

<!-- Analyzer -->
<div id="page-analyzer" style="display:none">
<h2 style="margin-bottom:20px">📈 个股深度分析</h2>
<div class="search-box">
<input type="text" id="analyzeStock" placeholder="输入股票代码">
<button class="btn" onclick="analyzeStock()">🔍 分析</button>
</div>
<div id="analysisResult"></div>
</div>
</div>

<!-- Analysis Modal -->
<div class="modal" id="analysisModal">
<div class="modal-box">
<div class="modal-header">
<h3 id="modalTitle">股票分析</h3>
<button class="modal-close" onclick="closeModal()">×</button>
</div>
<div id="modalContent"></div>
</div>
</div>

<script>
// 模拟股票数据（含技术分析）
var mockStocks = [
  {code:'600519',name:'贵州茅台',price:1850,change:2.5,high:1900,low:1800,volume:2.1,support:[1820,1780,1750],resistance:[1900,1950,2000],trend:'up',ma5:1820,ma10:1800,ma20:1780},
  {code:'000858',name:'五粮液',price:168,change:1.8,high:175,low:162,volume:1.8,support:[165,160,155],resistance:[175,180,185],trend:'up',ma5:165,ma10:162,ma20:160},
  {code:'601318',name:'中国平安',price:48,change:-0.5,high:50,low:47,volume:0.9,support:[47,45,43],resistance:[50,52,55],trend:'down',ma5:49,ma10:50,ma20:51},
  {code:'300750',name:'宁德时代',price:520,change:3.2,high:550,low:500,volume:2.5,support:[510,490,470],resistance:[550,580,600],trend:'up',ma5:510,ma10:500,ma20:490},
  {code:'002594',name:'比亚迪',price:268,change:2.1,high:280,low:260,volume:2.0,support:[265,255,245],resistance:[280,290,300],trend:'up',ma5:265,ma10:260,ma20:255},
];

var db = {portfolio: []};

// 加载
function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  render();
}
function saveData() {localStorage.setItem('stock_db', JSON.stringify(db)); render();}

// 渲染
function render() {
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  var totalProfit = 0;
  var needAction = 0;
  var safeCount = 0;
  var alertHtml = '';
  var safeHtml = '';
  
  if (db.portfolio.length === 0) {
    alertHtml = '<div style="color:#666;text-align:center;padding:40px">暂无持仓</div>';
    safeHtml = '<div style="color:#666;text-align:center;padding:40px">暂无持仓</div>';
  } else {
    db.portfolio.forEach(function(p) {
      var stock = mockStocks.find(function(s) {return s.code === p.code});
      if (!stock) return;
      
      var profit = ((stock.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
      totalProfit += parseFloat(profit);
      
      // 技术分析
      var analysis = analyzeTech(stock, p.buyPrice);
      
      if (analysis.action !== 'hold') {
        needAction++;
        alertHtml += createAlertCard(stock, p, analysis);
      } else {
        safeCount++;
        safeHtml += createSafeCard(stock, p, analysis);
      }
    });
  }
  
  document.getElementById('profit').innerText = (db.portfolio.length ? (totalProfit / db.portfolio.length).toFixed(1) : 0) + '%';
  document.getElementById('needAction').innerText = needAction;
  document.getElementById('safeCount').innerText = safeCount;
  document.getElementById('alertList').innerHTML = alertHtml;
  document.getElementById('safeList').innerHTML = safeHtml;
  
  // 持仓列表
  var portfolioHtml = db.portfolio.length ? db.portfolio.map(function(p) {
    var stock = mockStocks.find(function(s) {return s.code === p.code});
    if (!stock) return '';
    var analysis = analyzeTech(stock, p.buyPrice);
    return '<div class="card" style="cursor:pointer" onclick="showAnalysis(\''+p.code+'\')">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><span class="stock-code" style="font-size:18px">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div>'+
        '<div class="'+(parseFloat(analysis.profit)>=0?'up':'down')+'" style="font-size:20px;font-weight:600">'+analysis.profit+'%</div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:12px;color:#666;font-size:13px">'+
        '<div>买入: '+p.buyPrice+' | 现: '+stock.price+'</div>'+
        '<div class="level-tag '+(analysis.action==='buy'?'level-sup':analysis.action==='sell'?'level-res':'level-now')+'">'+analysis.actionText+'</div>'+
      '</div>'+
    '</div>';
  }).join('') : '<div class="card"><div style="color:#666;text-align:center;padding:40px">暂无持仓，请添加</div></div>';
  
  document.getElementById('portfolioList').innerHTML = portfolioHtml;
}

// 技术分析核心逻辑
function analyzeTech(stock, buyPrice) {
  var profit = ((stock.price - buyPrice) / buyPrice * 100).toFixed(1);
  var current = stock.price;
  
  // 1. 检查是否跌破支撑位
  var brokenSupport = null;
  stock.support.forEach(function(sup) {
    if (current < sup) brokenSupport = sup;
  });
  
  // 2. 检查是否突破压力位（带量）
  var brokenResistance = null;
  if (stock.volume > 1.5) {
    stock.resistance.forEach(function(res) {
      if (current > res) brokenResistance = res;
    });
  }
  
  // 3. 趋势判断（短期趋势线）
  var trendBroken = false;
  if (stock.trend === 'down') trendBroken = true;
  if (stock.ma5 < stock.ma10) trendBroken = true;
  
  // 4. 量能判断
  var weakVolume = stock.volume < 1;
  
  // 综合判断操作
  var action = 'hold';
  var actionText = '持有';
  var reasons = [];
  
  if (brokenSupport) {
    action = 'sell';
    actionText = '跌破止损';
    reasons.push('价格跌破支撑位 ' + brokenSupport);
  } else if (brokenResistance && profit > 5) {
    action = 'hold';
    actionText = '突破持有';
    reasons.push('放量突破压力位 ' + brokenResistance);
  } else if (trendBroken) {
    action = 'sell';
    actionText = '趋势转弱';
    reasons.push('短期趋势线跌破');
  } else if (weakVolume && profit > 3) {
    action = 'reduce';
    actionText = '量能不足减仓';
    reasons.push('无量上涨，需减仓');
  } else if (profit < -3) {
    action = 'sell';
    actionText = '触及止损';
    reasons.push('亏损超过3%');
  } else if (profit > 10) {
    action = 'sell';
    actionText = '止盈卖出';
    reasons.push('盈利超过10%');
  }
  
  return {
    profit: profit,
    action: action,
    actionText: actionText,
    reasons: reasons,
    support: stock.support,
    resistance: stock.resistance,
    current: current,
    volume: stock.volume,
    trend: stock.trend
  };
}

function createAlertCard(stock, p, a) {
  var color = a.action === 'sell' ? 'action-sell' : 'action-reduce';
  return '<div class="action-box '+color+'" style="padding:16px;border-radius:8px;margin-bottom:12px;cursor:pointer" onclick="showAnalysis(\''+p.code+'\')">'+
    '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div><span class="stock-code" style="font-size:16px">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div>'+
      '<div class="'+(parseFloat(a.profit)>=0?'up':'down')+'">'+a.profit+'%</div>'+
    '</div>'+
    '<div style="margin-top:8px;color:#FFD700;font-size:13px">⚠️ '+a.actionText+'</div>'+
    '<div style="margin-top:6px;color:#666;font-size:12px">'+a.reasons.join(', ')+'</div>'+
  '</div>';
}

function createSafeCard(stock, p, a) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;cursor:pointer" onclick="showAnalysis(\''+p.code+'\')">'+
    '<div><span class="stock-code">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div>'+
    '<div><span class="up">'+a.profit+'%</span> <span style="color:#2ED573;font-size:12px">✅ 持有</span></div>'+
  '</div>';
}

// 页面切换
function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-portfolio,#page-import,#page-analyzer').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
}

// 持仓管理
function addPortfolio() {
  var code = document.getElementById('addStock').value.trim();
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (!stock) {alert('未找到'); return;}
  var price = prompt('买入价格:', stock.price);
  if (price) {
    db.portfolio.push({code:stock.code,name:stock.name,buyPrice:parseFloat(price)});
    saveData();
  }
}

// 分析
function analyzeStock() {
  var code = document.getElementById('analyzeStock').value.trim();
  if (code) showAnalysis(code);
}

function showAnalysis(code) {
  var p = db.portfolio.find(function(x) {return x.code === code});
  var stock = mockStocks.find(function(s) {return s.code === code});
  if (!stock) {alert('未找到'); return;}
  
  var buyPrice = p ? p.buyPrice : stock.price;
  var a = analyzeTech(stock, buyPrice);
  
  var html = '<div class="card">'+
    '<h3>'+stock.code+' '+stock.name+'</h3>'+
    '<div style="font-size:36px;font-weight:700;margin:16px 0" class="'+(stock.change>=0?'up':'down')+'">'+stock.price+' <span style="font-size:16px">('+(stock.change>=0?'+':'')+stock.change+'%)</span></div>'+
    
    '<h4 style=" 0 12px">📊margin:20px 关键价位</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span style="color:#2ED573">🔻 支撑位</span><span>'+stock.support.join(' / ')+'</span></div>'+
      '<div class="tech-row"><span style="color:#FF4757">🔺 压力位</span><span>'+stock.resistance.join(' / ')+'</span></div>'+
    '</div>'+
    
    '<h4 style="margin:20px 0 12px">📈 趋势判断</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span>短期趋势</span><span class="level-tag '+(stock.trend==='up'?'level-sup':'level-res')+'">'+(stock.trend==='up'?'↑ 上升':'↓ 下降')+'</span></div>'+
      '<div class="tech-row"><span>量能状态</span><span>'+(stock.volume>1.5?'✅ 放量':'⚠️ 缩量')+' ('+stock.volume+')</span></div>'+
    '</div>'+
    
    '<h4 style="margin:20px 0 12px">💰 买入分析</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span>买入价</span><span>'+buyPrice+'</span></div>'+
      '<div class="tech-row"><span>当前盈亏</span><span class="'+(parseFloat(a.profit)>=0?'up':'down')+'">'+a.profit+'%</span></div>'+
    '</div>'+
    
    '<h4 style="margin:20px 0 12px">🎯 操作建议</h4>';
  
  if (a.action === 'sell') {
    html += '<div class="action-box action-sell"><div style="font-weight:600;color:#FF4757">🔴 建议卖出</div><div style="margin-top:8px;color:#888;font-size:13px">'+a.reasons.join('<br>')+'</div></div>';
  } else if (a.action === 'reduce') {
    html += '<div class="action-box action-reduce"><div style="font-weight:600;color:#FFA500">🟡 建议减仓</div><div style="margin-top:8px;color:#888;font-size:13px">'+a.reasons.join('<br>')+'</div></div>';
  } else {
    html += '<div class="action-box action-buy"><div style="font-weight:600;color:#2ED573">🟢 继续持有</div><div style="margin-top:8px;color:#888;font-size:13px">'+a.reasons.join('<br>')+'</div></div>';
  }
  
  if (!p) {
    html += '<button class="btn" style="margin-top:20px;width:100%" onclick="addAnalysisToPortfolio(\''+stock.code+'\')">➕ 添加到持仓</button>';
  }
  
  html += '</div.getElementById>';
  
  document('analysisResult').innerHTML = html;
  document.getElementById('analysisResult').style.display = 'block';
}

function addAnalysisToPortfolio(code) {
  var stock = mockStocks.find(function(s) {return s.code === code});
  var price = prompt('买入价格:', stock.price);
  if (price) {
    db.portfolio.push({code:stock.code,name:stock.name,buyPrice:parseFloat(price)});
    saveData();
    showAnalysis(code);
  }
}

// 图片导入
function handleImageUpload(e) {
  var file = e.target.files[0];
  if (!file) return;
  
  var result = mockStocks.slice(0, 3).map(function(s) {
    return {code: s.code, name: s.name, price: s.price, selected: true};
  });
  
  window.importData = result;
  document.getElementById('importResult').style.display = 'block';
  document.getElementById('importList').innerHTML = result.map(function(r) {
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px">'+
      '<input type="checkbox" checked data-code="'+r.code+'">'+
      '<div style="flex:1"><span class="stock-code">'+r.code+'</span> <span style="color:#888">'+r.name+'</span></div>'+
      '<input type="number" value="'+r.price+'" data-code="'+r.code+'" style="width:80px;padding:6px;background:#1A1A1A;border:1px solid #333;border-radius:4px;color:#FFF" placeholder="买入价">'+
    '</div>';
  }).join('');
}

function confirmImport() {
  var prices = {};
  document.querySelectorAll('#importList input[type="number"]').forEach(function(input) {
    prices[input.dataset.code] = parseFloat(input.value);
  });
  
  document.querySelectorAll('#importList input[type="checkbox"]:checked').forEach(function(cb) {
    var code = cb.dataset.code;
    var stock = mockStocks.find(function(s) {return s.code === code});
    if (stock && prices[code]) {
      db.portfolio.push({code:stock.code,name:stock.name,buyPrice:prices[code]});
    }
  });
  
  saveData();
  alert('导入成功!');
  document.getElementById('importResult').style.display = 'none';
}

function closeModal() {
  document.getElementById('analysisModal').classList.remove('show');
}

loadData();
</script>
</body>
</html>
