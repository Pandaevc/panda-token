<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:16px}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}
.stock-code{color:#FF6B35;font-weight:600}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer;font-size:14px}
.btn-sm{padding:6px 12px;font-size:12px;margin-left:8px}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.kline-box{height:300px;background:#0D0D0D;border-radius:8px;margin:12px 0}
.drop-zone{border:2px dashed #333;border-radius:12px;padding:40px;text-align:center;cursor:pointer}
.drop-zone:hover{border-color:#FF6B35}
.loading{text-align:center;padding:30px;color:#666}
.screener-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px}
.screener-item .code{color:#FF6B35;font-weight:600}
.screener-item .name{color:#888}
.screener-item .price{font-size:18px;font-weight:600}
@media(max-width:1000px){.nav{display:none}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screener')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('watchlist')">⭐ 自选股</a>
<a href="#" onclick="showPage('analyzer')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 仪表盘 <button class="btn btn-sm" onclick="loadAll()">🔄 刷新</button></h2>
<div class="stats">
<div class="stat"><div class="v" id="pickCount">0</div><div class="l">今日精选</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总盈亏</div></div>
<div class="stat"><div class="v" id="needAction">0</div><div class="l">待操作</div></div>
</div>
<div class="card">
<h3>🔥 每日精选 <button class="btn btn-sm" onclick="generatePicks()">🔄 生成</button></h3>
<div id="picksList"></div>
</div>
<div class="card"><h3>⚠️ 持仓提醒</h3><div id="alertList"></div></div>
</div>

<!-- Screener -->
<div id="page-screener" style="display:none">
<h2 style="margin-bottom:20px">🔍 智能选股</h2>
<div class="card">
<h3>选股条件</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0">
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond1" checked> 涨幅>3%</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond2" checked> 量比>1.5</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond3" checked> 成交额>5亿</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond4"> 涨停</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond5" checked> 资金净流入</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cond6" checked> 趋势向上</label>
</div>
<button class="btn" onclick="runScreener()">🔍 开始选股</button>
</div>
<div class="card" id="screenerResult">
<h3>选股结果 <span id="resultCount" style="color:#666;font-size:14px;font-weight:normal"></span></h3>
<div id="screenerList"></div>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" id="addStock" placeholder="输入股票代码">
<button class="btn" onclick="addPortfolio()">➕ 添加</button>
</div>
<div id="portfolioList"></div>
</div>

<!-- Watchlist -->
<div id="page-watchlist" style="display:none">
<h2 style="margin-bottom:20px">⭐ 自选股</h2>
<div class="search-box">
<input type="text" id="watchCode" placeholder="输入股票代码">
<button class="btn" onclick="addWatch()">➕ 添加</button>
</div>
<div id="watchlistList"></div>
</div>

<!-- Analyzer -->
<div id="page-analyzer" style="display:none">
<h2 style="margin-bottom:20px">📈 个股分析</h2>
<div class="search-box">
<input type="text" id="analyzeStock" placeholder="输入股票代码">
<button class="btn" onclick="analyzeStock()">🔍 分析</button>
</div>
<div id="klineChart" class="kline-box"></div>
<div id="analysisResult"></div>
</div>
</div>

<script>
// 东方财富全量股票数据
var allStocks = [];
var stockCache = {};

async function getStockData(code) {
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2.eastmoney.com/api/qt/stock/get?fltt=2&fields=f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13,f14,f15,f16,f17,f18,f20,f21,f22,f23,f24,f25,f37,f38,f39,f40,f41,f42,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f62,f115,f116,f117,f118,f119,f120,f121,f122,f123,f124,f125,f126,f127,f128,f129,f130,f131,f132,f133,f134,f135,f136,f137,f138,f139,f140,f141,f142,f143,f144,f145,f146,f147,f148,f149,f150,f151,f152,f153,f154,f155,f156,f157,f158,f159,f160,f161,f162,f163,f164,f165,f166,f167,f168,f169,f170,f171,f173,f174,f175,f176,f177,f178,f179,f180,f181,f182,f183,f184,f185,f186,f187,f188,f189,f190,f191,f192,f193,f194,f195,f196,f197,f198,f199,f200,f201,f202,f203,f204,f205,f206,f207,f208,f209,f210,f211,f212,f213,f214,f215,f216,f217,f218,f219,f220,f221,f222,f223,f224,f225&secid=' + secid;
  
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data) {
      var d = data.data;
      return {
        code: code,
        name: d.f58,
        price: d.f43,
        change: d.f170,
        changePercent: d.f170,
        volume: d.f47 / 10000,
        amount: d.f48 / 100000000,
        turnover: d.f50,
        pe: d.f162,
        pb: d.f167,
        high: d.f44,
        low: d.f45,
        open: d.f46,
        market: d.f116 / 100000000,
        rise: d.f170 > 3,
        hot: d.f47 > 50000,
        moneyIn: d.f184 > 0,
        up: d.f44 === d.f60
      };
    }
  } catch(e) { console.log(e); }
  return null;
}

// 获取A股全量股票列表
async function loadAllStocks() {
  document.getElementById('screenerList').innerHTML = '<div class="loading">正在获取全部A股数据...</div>';
  
  // 常用股票池（3000+只）
  var codes = [];
  for (var i = 600000; i < 604000; i++) codes.push(i.toString());
  for (var i = 0; i < 5000; i++) codes.push(i.toString().padStart(6,'0'));
  
  // 只获取有数据的
  allStocks = [];
  var count = 0;
  var batch = 50;
  
  for (var i = 0; i < Math.min(codes.length, 200); i += batch) {
    var promises = codes.slice(i, i+batch).map(c => getStockData(c));
    var results = await Promise.all(promises);
    results.forEach(function(s) {
      if (s && s.price > 0) {
        allStocks.push(s);
        stockCache[s.code] = s;
      }
    });
    count += batch;
    document.getElementById('screenerList').innerHTML = '<div class="loading">已获取 ' + allStocks.length + ' 只股票...</div>';
  }
  
  render();
}

function runScreener() {
  if (allStocks.length === 0) {
    loadAllStocks();
    return;
  }
  
  var results = allStocks.filter(function(s) {
    var pass = true;
    if (document.getElementById('cond1').checked) pass = pass && s.change > 3;
    if (document.getElementById('cond2').checked) pass = pass && s.turnover > 1.5;
    if (document.getElementById('cond3').checked) pass = pass && s.amount > 5;
    if (document.getElementById('cond4').checked) pass = pass && s.up;
    if (document.getElementById('cond5').checked) pass = pass && s.moneyIn;
    if (document.getElementById('cond6').checked) pass = pass && s.change > 0;
    return pass;
  });
  
  // 按涨幅排序
  results.sort(function(a, b) { return b.change - a.change; });
  
  document.getElementById('resultCount').innerText = ' (' + results.length + '只)';
  document.getElementById('screenerList').innerHTML = results.slice(0, 20).map(function(s) {
    return '<div class="screener-item">' +
      '<div><span class="code">' + s.code + '</span> <span class="name">' + s.name + '</span></div>' +
      '<div style="text-align:right"><span class="price ' + (s.change >= 0 ? 'up' : 'down') + '">' + s.change.toFixed(2) + '%</span></div>' +
      '<button class="btn btn-sm" onclick="addToPortfolio(\'' + s.code + '\')">➕</button></div>';
  }).join('') || '<div style="color:#666;text-align:center;padding:30px">没有符合条件的股票</div>';
}

var db = {portfolio: [], picks: [], watchlist: ['600519', '000858', '300750']};

function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  loadAll();
}

async function loadAll() {
  var codes = [...new Set([...db.portfolio.map(p => p.code), ...db.picks.map(p => p.code), ...db.watchlist, '600519', '000858', '300750', '002594'])];
  
  for (var code of codes) {
    if (!stockCache[code]) {
      var data = await getStockData(code);
      if (data) stockCache[code] = data;
    }
  }
  render();
}

function saveData() {
  localStorage.setItem('stock_db', JSON.stringify(db));
  render();
}

function render() {
  document.getElementById('pickCount').innerText = db.picks.length;
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  var totalProfit = 0;
  db.portfolio.forEach(function(p) {
    var s = stockCache[p.code];
    if (s) totalProfit += (s.price - p.buyPrice) / p.buyPrice * 100;
  });
  document.getElementById('profit').innerText = (db.portfolio.length ? (totalProfit / db.portfolio.length).toFixed(1) : 0) + '%';
  
  // 精选
  document.getElementById('picksList').innerHTML = db.picks.length ? db.picks.map(function(p,i) {
    var s = stockCache[p.code];
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><span style="color:#FF6B35;font-weight:600">'+(i+1)+'</span> <span>'+p.code+'</span> '+(s?s.name:'')+'</div>'+(s?'<span class="'+(s.change>=0?'up':'down')+'">'+s.change.toFixed(2)+'%</span>':'')+'</div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:30px">暂无精选</div>';
  
  // 持仓
  document.getElementById('portfolioList').innerHTML = db.portfolio.length ? db.portfolio.map(function(p) {
    var s = stockCache[p.code];
    if (!s) return '';
    var profit = ((s.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
    return '<div class="card" style="cursor:pointer" onclick="analyzeStock2(\''+p.code+'\')"><div style="display:flex;justify-content:space-between"><div><span style="color:#FF6B35;font-weight:600;font-size:16px">'+p.code+'</span> <span style="color:#888">'+s.name+'</span></div><span style="font-size:18px;font-weight:600" class="'+(profit>=0?'up':'down')+'">'+profit+'%</span></div><div style="margin-top:8px;color:#666;font-size:13px">买入: '+p.buyPrice+' | 现: '+s.price+'</div></div>';
  }).join('') : '<div class="card"><div style="color:#666;text-align:center;padding:30px">暂无持仓</div></div>';
  
  // 自选
  document.getElementById('watchlistList').innerHTML = db.watchlist.map(function(code) {
    var s = stockCache[code];
    return '<div class="card" style="cursor:pointer" onclick="analyzeStock2(\''+code+'\')"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="color:#FF6B35;font-weight:600">'+code+'</span> '+(s?s.name:'加载中...')+'</div>'+(s?'<span class="'+(s.change>=0?'up':'down')+'">'+s.change.toFixed(2)+'%</span>':'')+'</div></div>';
  }).join('');
  
  // 提醒
  var alerts = db.portfolio.filter(function(p) {
    var s = stockCache[p.code];
    if (!s) return false;
    return ((s.price - p.buyPrice) / p.buyPrice * 100) <= -3 || ((s.price - p.buyPrice) / p.buyPrice * 100) >= 10;
  });
  document.getElementById('needAction').innerText = alerts.length;
  document.getElementById('alertList').innerHTML = alerts.length ? alerts.map(function(p) {
    var s = stockCache[p.code];
    var profit = ((s.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between"><span>'+p.code+'</span><span class="'+(profit<0?'down':'up')+'">'+profit+'%</span></div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:20px">暂无提醒</div>';
}

function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screener,#page-portfolio,#page-watchlist,#page-analyzer').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
  
  if (page === 'screener' && allStocks.length === 0) {
    loadAllStocks();
  }
}

function generatePicks() {
  if (allStocks.length === 0) {
    loadAllStocks();
    return;
  }
  var picks = allStocks.filter(function(s) { return s.change > 2 && s.amount > 3; }).slice(0, 3);
  db.picks = picks.map(function(s) { return {code: s.code, name: s.name}; });
  saveData();
  alert('已生成今日精选!');
}

function addPortfolio() {
  var code = document.getElementById('addStock').value.trim();
  if (!code) return;
  getStockData(code).then(function(s) {
    if (s) {
      var price = prompt('买入价格:', s.price);
      if (price) {
        db.portfolio.push({code: code, name: s.name, buyPrice: parseFloat(price)});
        stockCache[code] = s;
        saveData();
      }
    } else {
      alert('未找到股票');
    }
  });
}

function addToPortfolio(code) {
  var s = stockCache[code];
  if (s) {
    var price = prompt('买入价格:', s.price);
    if (price) {
      db.portfolio.push({code: code, name: s.name, buyPrice: parseFloat(price)});
      saveData();
    }
  }
}

function addWatch() {
  var code = document.getElementById('watchCode').value.trim();
  if (code && !db.watchlist.includes(code)) {
    db.watchlist.push(code);
    getStockData(code).then(function(s) {
      if (s) stockCache[code] = s;
      render();
    });
    saveData();
  }
}

async function analyzeStock() {
  var code = document.getElementById('analyzeStock').value.trim();
  if (!code) return;
  
  var s = await getStockData(code);
  if (!s) {
    document.getElementById('analysisResult').innerHTML = '<div class="card"><div style="color:#666;text-align:center;padding:30px">未找到</div></div>';
    return;
  }
  
  stockCache[code] = s;
  
  // K线
  await showKLine(code);
  
  var html = '<div class="card"><h3>'+s.code+' '+s.name+'</h3><div style="font-size:32px;font-weight:700" class="'+(s.change>=0?'up':'down')+'">'+s.price+' ('+(s.change>=0?'+':'')+s.change.toFixed(2)+'%)</div></div>';
  
  html += '<div class="card"><h3>📊 数据概览</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="padding:12px;background:#0D0D0D;border-radius:8px"><div style="color:#888;font-size:12px">最高</div><div>'+s.high+'</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px"><div style="color:#888;font-size:12px">最低</div><div>'+s.low+'</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px"><div style="color:#888;font-size:12px">成交量</div><div>'+s.volume.toFixed(0)+'万</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px"><div style="color:#888;font-size:12px">成交额</div><div>'+s.amount.toFixed(1)+'亿</div></div></div></div>';
  
  document.getElementById('analysisResult').innerHTML = html;
}

function analyzeStock2(code) {
  showPage('analyzer');
  document.getElementById('analyzeStock').value = code;
  analyzeStock();
}

async function showKLine(code) {
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260221&lmt=60';
  
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      var klines = data.data.klines;
      var dates = [], closes = [], volumes = [];
      klines.forEach(function(kl) {
        var arr = kl.split(',');
        dates.push(arr[0]);
        closes.push(parseFloat(arr[2]));
        volumes.push(parseFloat(arr[5]));
      });
      
      var trace1 = {x: dates, y: closes, type: 'scatter', mode: 'lines', line: {color: '#FF6B35'}, name: '价格'};
      var trace2 = {x: dates, y: volumes, type: 'bar', yaxis: 'y2', marker: {color: 'rgba(255,107,53,0.5)'}, name: '成交量'};
      
      Plotly.newPlot('klineChart', [trace1, trace2], {
        paper_bgcolor: '#0D0D0D',
        plot_bgcolor: '#0D0D0D',
        xaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'},
        yaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'},
        yaxis2: {tickcolor: '#333', tickfont: {color: '#888'}, overlaying: 'y', side: 'right'}
      });
    }
  } catch(e) { console.log(e); }
}

loadData();
</script>
</body>
</html>
