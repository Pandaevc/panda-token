<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:16px}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}
.stock-code{color:#FF6B35;font-weight:600}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer;font-size:14px}
.btn-sm{padding:6px 12px;font-size:12px;margin-left:8px}
.btn-green{background:#2ED573}
.btn-red{background:#FF4757}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.search-box input{flex:1}
.tech-box{background:#0D0D0D;padding:16px;border-radius:8px;margin-bottom:12px}
.tech-box .label{color:#666;font-size:12px;margin-bottom:8px}
.tech-box .value{font-size:15px;font-weight:600}
.tech-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}
.tech-row:last-child{border:none}
.level-tag{display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;margin-right:8px}
.level-sup{background:rgba(46,213,115,0.2);color:#2ED573}
.level-res{background:rgba(255,71,87,0.2);color:#FF4757}
.level-now{background:rgba(255,215,0,0.2);color:#FFD700}
.action-box{padding:14px;border-radius:8px;margin-top:12px}
.action-buy{background:rgba(46,213,115,0.15);border-left:3px solid #2ED573}
.action-sell{background:rgba(255,71,87,0.15);border-left:3px solid #FF4757}
.action-wait{background:rgba(255,215,0,0.15);border-left:3px solid #FFD700}
.action-reduce{background:rgba(255,165,0,0.15);border-left:3px solid #FFA500}
.pick-card{background:linear-gradient(135deg,rgba(255,107,53,0.1),rgba(255,215,0,0.1));border:1px solid rgba(255,107,53,0.3);border-radius:12px;padding:16px;margin-bottom:12px}
.pick-card .rank{font-size:24px;font-weight:700;color:#FF6B35;margin-right:12px}
.pick-card .sector{color:#FFD700;font-size:12px;margin-bottom:4px}
.pick-card .reason{color:#888;font-size:12px;margin-top:8px}
.section-tag{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;margin-right:4px}
.tag-hot{background:rgba(255,71,87,0.2);color:#FF4757}
.tag-tech{background:rgba(0,230,118,0.2);color:#2ED573}
.tag-consume{background:rgba(255,215,0,0.2);color:#FFD700}
@media(max-width:1000px){.nav{display:none}}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screener')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('analyzer')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 仪表盘</h2>
<div class="stats">
<div class="stat"><div class="v" id="pickCount">0</div><div class="l">今日精选</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总盈亏</div></div>
<div class="stat"><div class="v" id="needAction">0</div><div class="l">待操作</div></div>
</div>

<div class="card">
<h3>🔥 每日精选 <button class="btn btn-sm" onclick="generatePicks()">🔄 重新生成</button></h3>
<div id="picksList"></div>
</div>

<div class="card">
<h3>⚠️ 持仓提醒</h3>
<div id="alertList"></div>
</div>
</div>

<!-- Screener -->
<div id="page-screener" style="display:none">
<h2 style="margin-bottom:20px">🔍 选股条件</h2>
<div class="card">
<h3>选股条件（根据你的策略）</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0">
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s1" checked> 90%筹码集中度 11-15%</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s2" checked> 70%筹码集中度 4-10%</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s3" checked> 10日内涨停过</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s4"> 今日涨停</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s5" checked> 市值>50亿</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s6"> CCI上移</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s7"> KDJ金叉</label>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="s8"> 量比>1</label>
</div>
<button class="btn" onclick="runScreener()">🔍 开始筛选</button>
</div>
<div class="card" id="screenerResult" style="display:none">
<h3>筛选结果</h3>
<div id="screenerList"></div>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" id="addStock" placeholder="输入股票代码 (如: 600519)">
<button class="btn" onclick="addPortfolio()">➕ 添加持仓</button>
</div>
<div id="portfolioList"></div>
</div>

<!-- Analyzer -->
<div id="page-analyzer" style="display:none">
<h2 style="margin-bottom:20px">📈 个股深度分析</h2>
<div class="search-box">
<input type="text" id="analyzeStock" placeholder="输入股票代码">
<button class="btn" onclick="analyzeStock()">🔍 分析</button>
</div>
<div id="analysisResult"></div>
</div>
</div>

<script>
// 模拟股票数据
var stocks = [
  {code:'600519',name:'贵州茅台',price:1850,change:2.5,chip90:12.5,chip70:6.8,limitUpDays:3,sector:'白酒',market:23000,volume:2.1,support:[1820,1780,1750],resistance:[1900,1950,2000],trend:'up',ma5:1820,ma10:1800},
  {code:'000858',name:'五粮液',price:168,change:1.8,chip90:14.2,chip70:8.1,limitUpDays:2,sector:'白酒',market:650,volume:1.8,support:[165,160,155],resistance:[175,180,185],trend:'up',ma5:165,ma10:162},
  {code:'601318',name:'中国平安',price:48,change:-0.5,chip90:11.8,chip70:5.2,limitUpDays:0,sector:'保险',market:8800,volume:0.9,support:[47,45,43],resistance:[50,52,55],trend:'down',ma5:49,ma10:50},
  {code:'300750',name:'宁德时代',price:520,change:3.2,chip90:15.8,chip70:9.5,limitUpDays:5,sector:'新能源',market:12000,volume:2.5,support:[510,490,470],resistance:[550,580,600],trend:'up',ma5:510,ma10:500},
  {code:'002594',name:'比亚迪',price:268,change:2.1,chip90:13.2,chip70:7.8,limitUpDays:4,sector:'汽车',market:7800,volume:2.0,support:[265,255,245],resistance:[280,290,300],trend:'up',ma5:265,ma10:260},
  {code:'600036',name:'招商银行',price:42,change:0.8,chip90:10.5,chip70:4.5,limitUpDays:1,sector:'银行',market:11000,volume:1.2,support:[41,40,39],resistance:[43,44,45],trend:'up',ma5:42,ma10:41},
  {code:'000333',name:'美的集团',price:65,change:1.2,chip90:11.2,chip70:5.8,limitUpDays:2,sector:'家电',market:4500,volume:1.5,support:[64,62,60],resistance:[66,68,70],trend:'up',ma5:64,ma10:63},
  {code:'600900',name:'长江电力',price:23,change:0.5,chip90:8.5,chip70:3.2,limitUpDays:0,sector:'电力',market:5500,volume:0.8,support:[22.5,22,21.5],resistance:[23.5,24,24.5],trend:'up',ma5:23,ma10:22.8},
];

var db = {portfolio: [], picks: []};

// 加载
function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  render();
}
function saveData() {localStorage.setItem('stock_db', JSON.stringify(db)); render();}

// 渲染
function render() {
  document.getElementById('pickCount').innerText = db.picks.length;
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  var totalProfit = 0;
  db.portfolio.forEach(function(p) {
    var stock = stocks.find(function(s) {return s.code === p.code});
    if (stock) totalProfit += (stock.price - p.buyPrice) / p.buyPrice * 100;
  });
  document.getElementById('profit').innerText = (db.portfolio.length ? (totalProfit / db.portfolio.length).toFixed(1) : 0) + '%';
  
  // 渲染精选
  if (db.picks.length === 0) {
    document.getElementById('picksList').innerHTML = '<div style="color:#666;text-align:center;padding:40px">点击"重新生成"获取今日精选</div>';
  } else {
    document.getElementById('picksList').innerHTML = db.picks.map(function(p, i) {
      return '<div class="pick-card">'+
        '<div style="display:flex;align-items:center"><span class="pick-card .rank">'+(i+1)+'</span><div><div class="sector">'+p.sector+'</div><div><span class="stock-code">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div></div></div>'+
        '<div class="pick-card .reason">'+p.reason+'</div>'+
        '<div style="margin-top:8px"><button class="btn btn-sm" onclick="addPickToPortfolio(\''+p.code+'\')">➕ 加入持仓</button></div>'+
      '</div>';
    }).join('');
  }
  
  // 渲染持仓
  if (db.portfolio.length === 0) {
    document.getElementById('portfolioList').innerHTML = '<div class="card"><div style="color:#666;text-align:center;padding:40px">暂无持仓，请添加</div></div>';
  } else {
    document.getElementById('portfolioList').innerHTML = db.portfolio.map(function(p) {
      var stock = stocks.find(function(s) {return s.code === p.code});
      if (!stock) return '';
      var profit = ((stock.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
      var a = analyzeTech(stock, p.buyPrice);
      var colorClass = a.action === 'sell' ? 'action-sell' : a.action === 'reduce' ? 'action-reduce' : 'action-buy';
      return '<div class="card '+colorClass+'" style="padding:16px;border-radius:8px;margin-bottom:12px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          '<div><span class="stock-code" style="font-size:16px">'+p.code+'</span> <span style="color:#888">'+p.name+'</span></div>'+
          '<div class="'+(profit>=0?'up':'down')+'" style="font-size:20px;font-weight:600">'+profit+'%</div>'+
        '</div>'+
        '<div style="margin-top:12px;display:flex;justify-content:space-between;font-size:13px;color:#888">'+
          '<div>买入: '+p.buyPrice+' | 现: '+stock.price+'</div>'+
          '<div>'+a.actionText+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  
  // 提醒
  var alerts = db.portfolio.filter(function(p) {
    var stock = stocks.find(function(s) {return s.code === p.code});
    if (!stock) return false;
    var profit = (stock.price - p.buyPrice) / p.buyPrice * 100;
    return profit <= -3 || profit >= 10;
  });
  document.getElementById('needAction').innerText = alerts.length;
  document.getElementById('alertList').innerHTML = alerts.length ? alerts.map(function(p) {
    var stock = stocks.find(function(s) {return s.code === p.code});
    var profit = ((stock.price - p.buyPrice) / p.buyPrice * 100).toFixed(1);
    return '<div style="padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'+
      '<div><span class="stock-code">'+p.code+'</span> <span class="'+(profit<0?'down':'up')+'">'+profit+'%</span></div>'+
      '<div style="color:#FFD700;font-size:12px">'+(profit<0?'⚠️ 止损提醒':'🎉 止盈提醒')+'</div></div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:20px">暂无提醒</div>';
}

// 技术分析
function analyzeTech(stock, buyPrice) {
  var profit = ((stock.price - buyPrice) / buyPrice * 100).toFixed(1);
  var current = stock.price;
  var brokenSupport = null;
  stock.support.forEach(function(s) { if (current < s) brokenSupport = s; });
  var trendBroken = stock.ma5 < stock.ma10;
  var weakVolume = stock.volume < 1;
  
  var action = 'hold', actionText = '持有', reasons = ['趋势正常'];
  if (brokenSupport) { action = 'sell'; actionText = '跌破止损'; reasons = ['跌破支撑位 ' + brokenSupport]; }
  else if (trendBroken) { action = 'sell'; actionText = '趋势转弱'; reasons = ['MA5<MA10']; }
  else if (weakVolume && profit > 3) { action = 'reduce'; actionText = '量能不足'; reasons = ['无量上涨']; }
  else if (profit < -3) { action = 'sell'; actionText = '触及止损'; reasons = ['亏损>3%']; }
  else if (profit > 10) { action = 'sell'; actionText = '止盈'; reasons = ['盈利>10%']; }
  
  return {profit: profit, action: action, actionText: actionText, reasons: reasons, support: stock.support, resistance: stock.resistance, current: current, volume: stock.volume, trend: stock.trend};
}

// 页面切换
function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screener,#page-portfolio,#page-analyzer').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
}

// 每日精选
function generatePicks() {
  // 模拟板块热点
  var sectors = ['白酒', '新能源', '汽车', '家电', '电力', '银行', '保险'];
  var hotSectors = sectors.sort(function() {return Math.random() - 0.5}).slice(0, 2);
  
  // 根据选股条件筛选
  var picks = stocks.filter(function(s) {
    return s.chip90 >= 11 && s.chip90 <= 15 &&
           s.chip70 >= 4 && s.chip70 <= 10 &&
           s.limitUpDays > 0 &&
           s.market > 50 &&
           s.trend === 'up';
  }).slice(0, 3);
  
  db.picks = picks.map(function(s) {
    return {
      code: s.code,
      name: s.name,
      sector: s.sector,
      reason: s.sector + '板块热点，筹码集中，' + s.limitUpDays + '日内有涨停，趋势向上'
    };
  });
  
  saveData();
  alert('已生成今日精选!');
}

function addPickToPortfolio(code) {
  var stock = stocks.find(function(s) {return s.code === code});
  if (stock) {
    var price = prompt('买入价格:', stock.price);
    if (price) {
      db.portfolio.push({code:stock.code, name:stock.name, buyPrice:parseFloat(price)});
      saveData();
    }
  }
}

// 选股
function runScreener() {
  var results = stocks.filter(function(s) {
    var pass = true;
    if (document.getElementById('s1').checked) pass = pass && s.chip90 >= 11 && s.chip90 <= 15;
    if (document.getElementById('s2').checked) pass = pass && s.chip70 >= 4 && s.chip70 <= 10;
    if (document.getElementById('s3').checked) pass = pass && s.limitUpDays > 0;
    if (document.getElementById('s4').checked) pass = pass && s.change > 9;
    if (document.getElementById('s5').checked) pass = pass && s.market > 50;
    return pass;
  });
  
  document.getElementById('screenerResult').style.display = 'block';
  document.getElementById('screenerList').innerHTML = results.length ? results.map(function(s) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0D0D0D;border-radius:8px;margin-bottom:8px">'+
      '<div><span class="stock-code">'+s.code+'</span> <span style="color:#888">'+s.name+'</span> <span class="section-tag tag-tech">'+s.sector+'</span></div>'+
      '<div style="display:flex;gap:20px;align-items:center"><span class="'+(s.change>=0?'up':'down')+'">'+s.change+'%</span><button class="btn btn-sm" onclick="addToPortfolio(\''+s.code+'\')">➕</button></div>'+
    '</div>';
  }).join('') : '<div style="color:#666;text-align:center;padding:40px">没有符合条件的股票</div>';
}

// 持仓
function addPortfolio() {
  var code = document.getElementById('addStock').value.trim();
  var stock = stocks.find(function(s) {return s.code === code});
  if (!stock) {alert('未找到'); return;}
  var price = prompt('买入价格:', stock.price);
  if (price) {
    db.portfolio.push({code:stock.code, name:stock.name, buyPrice:parseFloat(price)});
    saveData();
  }
}

function addToPortfolio(code) {
  var stock = stocks.find(function(s) {return s.code === code});
  if (stock) {
    var price = prompt('买入价格:', stock.price);
    if (price) {
      db.portfolio.push({code:stock.code, name:stock.name, buyPrice:parseFloat(price)});
      saveData();
    }
  }
}

// 分析
function analyzeStock() {
  var code = document.getElementById('analyzeStock').value.trim();
  if (!code) return;
  var stock = stocks.find(function(s) {return s.code === code});
  if (!stock) {alert('未找到'); return;}
  
  var buyPrice = stock.price;
  var a = analyzeTech(stock, buyPrice);
  
  var html = '<div class="card">'+
    '<h3>'+stock.code+' '+stock.name+'</h3>'+
    '<div style="font-size:36px;font-weight:700;margin:16px 0" class="'+(stock.change>=0?'up':'down')+'">'+stock.price+' <span style="font-size:16px">('+(stock.change>=0?'+':'')+stock.change+'%)</span></div>'+
    
    '<h4 style="margin:20px 0 12px">📊 关键价位</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span style="color:#2ED573">支撑位</span><span>'+stock.support.join(' / ')+'</span></div>'+
      '<div class="tech-row"><span style="color:#FF4757">压力位</span><span>'+stock.resistance.join(' / ')+'</span></div>'+
    '</div>'+
    
    '<h4 style="margin:20px 0 12px">📈 趋势判断</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span>MA5/MA10</span><span class="level-tag '+(stock.trend==='up'?'level-sup':'level-res')+'">'+stock.ma5+' / '+stock.ma10+'</span></div>'+
      '<div class="tech-row"><span>量能</span><span>'+(stock.volume>1.5?'✅ 放量':'⚠️ 缩量')+' ('+stock.volume+')</span></div>'+
    '</div>'+
    
    '<h4 style="margin:20px 0 12px">💰 买入分析</h4>'+
    '<div class="tech-box">'+
      '<div class="tech-row"><span>当前价格</span><span>'+stock.price+'</span></div>'+
    '</div>';
  
  if (a.action === 'sell') {
    html += '<div class="action-box action-sell"><div style="font-weight:600;color:#FF4757">🔴 建议卖出</div><div style="margin-top:8px;color:#888;font-size:13px">'+a.reasons.join('<br>')+'</div></div>';
  } else if (a.action === 'reduce') {
    html += '<div class="action-box action-reduce"><div style="font-weight:600;color:#FFA500">🟡 建议减仓</div><div style="margin-top:8px;color:#888;font-size:13px">'+a.reasons.join('<br>')+'</div></div>';
  } else {
    html += '<div class="action-box action-buy"><div style="font-weight:600;color:#2ED573">🟢 建议买入/持有</div><div style="margin-top:8px;color:#888;font-size:13px">支撑位: '+stock.support[0]+'</div></div>';
  }
  
  html += '</div>';
  document.getElementById('analysisResult').innerHTML = html;
  document.getElementById('analysisResult').style.display = 'block';
}

loadData();
</script>
</body>
</html>
