<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:20px}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #333}
th{color:#666;font-size:12px}
.stock-code{color:#FF6B35;font-weight:600}
.stock-name{color:#888}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer}
.btn-sm{padding:6px 12px;font-size:12px}
.tag{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;margin-right:4px}
.tag-green{background:rgba(46,213,115,0.2);color:#2ED573}
.tag-red{background:rgba(255,71,87,0.2);color:#FF4757}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.search-box input{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#1A1A1A;padding:24px;border-radius:16px;width:500px}
.analysis-item{padding:12px;background:#0D0D0D;border-radius:8px;margin-bottom:10px}
.analysis-item .label{color:#666;font-size:12px;margin-bottom:4px}
.analysis-item .value{font-size:14px}
.match{color:#2ED573}
.not-match{color:#FF4757}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screen')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('analyzer')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 今日概览</h2>
<div class="stats">
<div class="stat"><div class="v" id="todayScreen">0</div><div class="l">今日选出</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总收益率</div></div>
<div class="stat"><div class="v" id="alertCount">0</div><div class="l">待处理提醒</div></div>
</div>
<div class="card">
<h3>📋 今日选股结果</h3>
<table><thead><tr><th>股票代码</th><th>股票名称</th><th>筹码集中度</th><th>涨停基因</th><th>板块</th><th>操作</th></tr></thead><tbody id="screenTable"></tbody></table>
</div>
<div class="card">
<h3>⚠️ 持仓提醒</h3>
<table><thead><tr><th>股票</th><th>当前价格</th><th>止损价</th><th>提醒原因</th><th>操作</th></tr></thead><tbody id="alertTable"></tbody></table>
</div>
</div>

<!-- Stock Screener -->
<div id="page-screen" style="display:none">
<h2 style="margin-bottom:20px">🔍 条件选股</h2>
<div class="card">
<h3>选股条件</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
<label><input type="checkbox" id="cond1" checked> 条件一：筹码集中度+涨停基因</label>
<label><input type="checkbox" id="cond2" checked> 条件二：成本集中度+KDJ金叉</label>
<label><input type="checkbox" id="cond3"> 昨日涨停</label>
<label><input type="checkbox" id="cond4"> 放量突破</label>
</div>
<button class="btn" style="margin-top:16px" onclick="runScreen()">🔍 开始选股</button>
</div>
<div class="card">
<h3>选股结果</h3>
<table><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌幅</th><th>筹码90%</th><th>70%</th><th>操作</th></tr></thead><tbody id="resultTable"></tbody></table>
</div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="search-box">
<input type="text" class="input" id="addStock" placeholder="输入股票代码添加持仓 (如: 600519)">
<button class="btn" onclick="addPortfolio()">➕ 添加</button>
</div>
<div class="card">
<h3>当前持仓</h3>
<table><thead><tr><th>股票</th><th>持仓价</th><th>现价</th><th>盈亏</th><th>止损价</th><th>趋势线</th><th>操作</th></tr></thead><tbody id="portfolioTable"></tbody></table>
</div>
</div>

<!-- Analyzer -->
<div id="page-analyzer" style="display:none">
<h2 style="margin-bottom:20px">📈 个股分析</h2>
<div class="search-box">
<input type="text" class="input" id="analyzeStock" placeholder="输入股票代码 (如: 600519)">
<button class="btn" onclick="analyzeStock()">🔍 分析</button>
</div>
<div id="analysisResult" style="display:none">
<div class="card">
<h3 id="stockTitle">股票分析</h3>
<div id="analysisContent"></div>
</div>
</div>
</div>
</div>

<script>
// Stock Data - Mock data for demonstration
var db = {
  portfolio: [],
  history: [],
  alerts: []
};

var mockStocks = [
  {code:'600519',name:'贵州茅台',price:1850,change:2.5,chip90:12.5,chip70:6.8,limitUpDays:3,sector:'白酒'},
  {code:'000858',name:'五粮液',price:168,change:1.8,chip90:14.2,chip70:8.1,limitUpDays:2,sector:'白酒'},
  {code:'601318',name:'中国平安',price:48,change:-0.5,chip90:11.8,chip70:5.2,limitUpDays:0,sector:'保险'},
  {code:'300750',name:'宁德时代',price:520,change:3.2,chip90:15.8,chip70:9.5,limitUpDays:5,sector:'新能源'},
  {code:'002594',name:'比亚迪',price:268,change:2.1,chip90:13.2,chip70:7.8,limitUpDays:4,sector:'汽车'},
];

// Load data
function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  render();
}

function saveData() {
  localStorage.setItem('stock_db', JSON.stringify(db));
  render();
}

function render() {
  document.getElementById('todayScreen').innerText = mockStocks.length;
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  
  // Render screen table
  document.getElementById('screenTable').innerHTML = mockStocks.map(function(s){
    return '<tr><td class="stock-code">'+s.code+'</td><td>'+s.name+'</td><td>'+s.chip90+'%</td><td>'+s.limitUpDays+'天</td><td>'+s.sector+'</td><td><button class="btn btn-sm" onclick="addToPortfolio(\''+s.code+'\')">➕持仓</button></td></tr>';
  }).join('');
  
  // Render portfolio
  document.getElementById('portfolioTable').innerHTML = db.portfolio.length ? db.portfolio.map(function(p){
    var stock = mockStocks.find(function(s){return s.code===p.code});
    var current = stock ? stock.price : 0;
    var profit = ((current - p.buyPrice) / p.buyPrice * 100).toFixed(2);
    var trend = current > p.buyPrice ? '↑强势' : '↓弱势';
    return '<tr><td><span class="stock-code">'+p.code+'</span><br><span class="stock-name">'+p.name+'</span></td><td>'+p.buyPrice+'</td><td>'+current+'</td><td class="'+(profit>=0?'up':'down')+'">'+profit+'%</td><td>'+(p.stopLoss||'-')+'</td><td>'+trend+'</td><td><button class="btn btn-sm" onclick="removePortfolio(\''+p.code+'\')">删除</button></td></tr>';
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:#666">暂无持仓</td></tr>';
  
  // Render alerts
  document.getElementById('alertTable').innerHTML = db.alerts.length ? db.alerts.map(function(a){
    return '<tr><td>'+a.code+'</td><td>'+a.price+'</td><td>'+a.stopLoss+'</td><td>'+a.reason+'</td><td><button class="btn btn-sm">处理</button></td></tr>';
  }).join('') : '<tr><td colspan="5" style="text-align:center;color:#666">暂无提醒</td></tr>';
}

function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screen,#page-portfolio,#page-analyzer').forEach(function(p){p.style.display='none'});
  document.getElementById('page-'+page).style.display = 'block';
}

function runScreen() {
  var results = mockStocks;
  document.getElementById('resultTable').innerHTML = results.map(function(s){
    return '<tr><td class="stock-code">'+s.code+'</td><td>'+s.name+'</td><td>'+s.price+'</td><td class="'+(s.change>=0?'up':'down')+'">'+s.change+'%</td><td>'+s.chip90+'%</td><td>'+s.chip70+'%</td><td><button class="btn btn-sm" onclick="addToPortfolio(\''+s.code+'\')">➕持仓</button></td></tr>';
  }).join('');
}

function addPortfolio() {
  var code = document.getElementById('addStock').value;
  var stock = mockStocks.find(function(s){return s.code===code});
  if (stock) {
    db.portfolio.push({code:stock.code,name:stock.name,buyPrice:stock.price,stopLoss:stock.price*0.95});
    saveData();
    document.getElementById('addStock').value = '';
  } else {
    alert('股票未找到');
  }
}

function addToPortfolio(code) {
  var stock = mockStocks.find(function(s){return s.code===code});
  if (stock) {
    db.portfolio.push({code:stock.code,name:stock.name,buyPrice:stock.price,stopLoss:stock.price*0.95});
    saveData();
    alert('已添加 ' + stock.name);
  }
}

function removePortfolio(code) {
  db.portfolio = db.portfolio.filter(function(p){return p.code!==code});
  saveData();
}

function analyzeStock() {
  var code = document.getElementById('analyzeStock').value;
  var stock = mockStocks.find(function(s){return s.code===code});
  if (!stock) { alert('股票未找到'); return; }
  
  // 分析是否符合Boss的策略
  var analysis = [];
  
  // 筹码集中度
  var chipMatch = stock.chip90 >= 11 && stock.chip90 <= 15;
  analysis.push({label:'90%筹码集中度',value:stock.chip90+'%',match:chipMatch});
  
  // 涨停基因
  var limitMatch = stock.limitUpDays > 0;
  analysis.push({label:'10日内涨停',value:stock.limitUpDays+'次',match:limitMatch});
  
  // 板块
  analysis.push({label:'所属板块',value:stock.sector,match:null});
  
  // 形态
  var formMatch = stock.change > 0;
  analysis.push({label:'今日上涨',value:stock.change+'%',match:formMatch});
  
  var html = '<div style="margin-bottom:12px"><span class="stock-code" style="font-size:18px">'+stock.code+' '+stock.name+'</span> <span class="'+(stock.change>=0?'up':'down')+'" style="font-size:18px">'+stock.price+' ('+(stock.change>=0?'+':'')+stock.change+'%)</span></div>';
  
  html += analysis.map(function(a){
    var icon = a.match === null ? '' : (a.match ? '✅' : '❌');
    var cls = a.match === null ? '' : (a.match ? 'match' : 'not-match');
    return '<div class="analysis-item"><div class="label">'+a.label+'</div><div class="value '+cls+'">'+icon+' '+a.value+'</div></div>';
  }).join('');
  
  document.getElementById('stockTitle').innerText = stock.code + ' ' + stock.name + ' - 策略分析';
  document.getElementById('analysisContent').innerHTML = html;
  document.getElementById('analysisResult').style.display = 'block';
}

// Initialize
loadData();
</script>
</body>
</html>
