<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商管理后台 - PandaToken</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FF6B35;--accent:#FFD700;--success:#00E676;--danger:#ff4757;--warning:#FFD700;--dark:#0D0D0D;--darker:#050505;--surface:#1A1A1A;--text:#FFF;--text-muted:#888;--g:linear-gradient(135deg,#FF6B35,#FF9800);--b:1px solid rgba(255,255,255,0.08)}
body{background:var(--darker);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--surface);border-right:var(--b);padding:24px;z-index:100}
.sidebar h2{font-size:20px;margin-bottom:30px;color:var(--accent)}
.sidebar a{display:block;padding:14px 18px;color:#AAA;text-decoration:none;border-radius:12px;margin-bottom:8px;transition:all 0.3s}
.sidebar a:hover,.sidebar a.active{background:var(--g);color:#fff}
.sidebar .version{position:absolute;bottom:20px;font-size:12px;color:#666}
.main{margin-left:260px;padding:30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:var(--b)}
.header h1{font-size:28px}
.btn{padding:10px 20px;border-radius:10px;border:none;font-weight:600;cursor:pointer}
.btn-primary{background:var(--g);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-warning{background:var(--warning);color:#000}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.stat{background:var(--surface);padding:24px;border-radius:16px;text-align:center}
.stat .v{font-size:36px;font-weight:700;color:var(--accent)}
.stat .l{font-size:13px;color:var(--text-muted);margin-top:8px}
.card{background:var(--surface);border-radius:16px;padding:28px;margin-bottom:28px}
.card h3{font-size:18px;margin-bottom:20px;padding-bottom:14px;border-bottom:var(--b);display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.form input,.form select,.form textarea{width:100%;padding:14px;background:var(--dark);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff}
.form textarea{grid-column:span 3;min-height:80px}
.form label{grid-column:span 3;font-size:13px;color:var(--text-muted);margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:16px;text-align:left;border-bottom:var(--b)}
th{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase}
.status{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}
.status.pending{background:rgba(255,215,0,0.2);color:var(--warning)}
.status.paid{background:rgba(0,230,118,0.2);color:var(--success)}
.status.shipped{background:rgba(255,107,53,0.2);color:var(--primary)}
.status.completed{background:rgba(0,230,118,0.3);color:#fff}
.action-btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;margin-right:8px;font-size:12px}
.action-btn.view{background:rgba(255,107,53,0.2);color:var(--primary)}
.action-btn.ship{background:rgba(0,230,118,0.2);color:var(--success)}
.action-btn.complete{background:rgba(255,215,0,0.2);color:var(--warning)}
.tab-btns{display:flex;gap:10px;margin-bottom:20px}
.tab-btn{padding:12px 24px;background:var(--dark);border:none;border-radius:10px;color:#888;cursor:pointer}
.tab-btn.active{background:var(--g);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
@media(max-width:1200px){.sidebar{display:none}.main{margin-left:0}}
</style>
</head>
<body>
<div class="sidebar">
<h2>🏪 电商管理</h2>
<a href="#dashboard" class="active" onclick="switchTab('dashboard')">📊 数据概览</a>
<a href="#products" onclick="switchTab('products')">📦 商品管理</a>
<a href="#orders" onclick="switchTab('orders')">📋 订单管理</a>
<a href="#users" onclick="switchTab('users')">👥 用户管理</a>
<a href="#logistics" onclick="switchTab('logistics')">🚚 物流管理</a>
<a href="#settings" onclick="switchTab('settings')">⚙️ 系统设置</a>
<a href="shop.html">← 返回商店</a>
<div class="version">v1.0.0</div>
</div>

<div class="main">
<div class="header">
<h1>📊 数据概览</h1>
<button class="btn btn-primary" onclick="exportData()">📥 导出数据</button>
</div>

<div class="stats">
<div class="stat"><div class="v" id="totalSales">$0</div><div class="l">总销售额</div></div>
<div class="stat"><div class="v" id="totalOrders">0</div><div class="l">总订单</div></div>
<div class="stat"><div class="v" id="totalUsers">0</div><div class="l">用户数</div></div>
<div class="stat"><div class="v" id="pendingOrders">0</div><div class="l">待处理</div></div>
</div>

<!-- Products Tab -->
<div class="tab-content" id="productsTab">
<div class="card">
<h3>📦 商品管理 <button class="btn btn-primary" onclick="showProductForm()">➕ 添加商品</button></h3>
<div id="productForm" style="display:none;background:var(--dark);padding:20px;border-radius:12px;margin-bottom:20px">
<div class="form">
<input type="text" id="pName" placeholder="商品名称 *">
<input type="number" id="pPrice" placeholder="<input type="number" id="pStock" placeholder="库存 *">
<input type="number" id="pTokens" placeholder="代币数量 *">
<input type="text" id="pTag" placeholder="标签">
<textarea id="pDesc" placeholder="商品描述"></textarea>
<button class="btn btn-primary" onclick="saveProduct()">💾 保存</button>
<button class="btn btn-danger" onclick="hideProductForm()">取消</button>
</div>
</div>
<table>
<thead><tr><th>ID</th><th>商品</th><th>价格</th><th>代币</th><th>库存</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="productTable"></tbody>
</table>
</div>
</div>

<!-- Orders Tab -->
<div class="tab-content" id="ordersTab">
<div class="card">
<h3>📋 订单管理</h3>
<div class="tab-btns">
<button class="tab-btn active" onclick="filterOrders('all')">全部</button>
<button class="tab-btn" onclick="filterOrders('pending_payment')>待支付</button>
<button class="tab-btn" onclick="filterOrders('paid')>已支付</button>
<button class="tab-btn" onclick="filterOrders('shipped')>已发货</button>
<button class="tab-btn" onclick="filterOrders('completed')>已完成</button>
</div>
<table>
<thead><tr><th>订单号</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
<tbody id="orderTable"></tbody>
</table>
</div>
</div>

<!-- Users Tab -->
<div class="tab-content" id="usersTab">
<div class="card">
<h3>👥 用户管理</h3>
<table>
<thead><tr><th>ID</th><th>名称</th><th>账号</th><th>推荐码</th><th>推荐人</th><th>注册时间</th><th>操作</th></tr></thead>
<tbody id="userTable"></tbody>
</table>
</div>
</div>

<!-- Logistics Tab -->
<div class="tab-content" id="logisticsTab">
<div class="card">
<h3>🚚 物流管理</h3>
<div style="background:var(--dark);padding:20px;border-radius:12px;margin-bottom:20px">
<h4 style="margin-bottom:15px">📱 条码扫描发货</h4>
<div style="display:flex;gap:10px">
<input type="text" id="scanInput" placeholder="扫描或输入订单号/条码" style="flex:1">
<button class="btn btn-success" onclick="scanCode()">🔍 扫描</button>
</div>
</div>
<table>
<thead><tr><th>订单号</th><th>商品</th><th>快递</th><th>运单号</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="logisticsTable"></tbody>
</table>
</div>
</div>

<!-- Settings Tab -->
<div class="tab-content" id="settingsTab">
<div class="card">
<h3>⚙️ 系统设置</h3>
<div class="form">
<h4 style="grid-column:span 3;margin:20px 0 10px">💰 代币设置</h4>
<input type="text" id="sReferralBonus" placeholder="推荐奖励代币数" value="500">
<input type="text" id="sEcigBonus" placeholder="电子烟代币数" value="3000">
<div></div>
<h4 style="grid-column:span 3;margin:20px 0 10px">🔗 API配置</h4>
<input type="text" id="sApiUrl" placeholder="API地址" value="https://panda-token-d6bckkwli-pandaevc.vercel.app">
<div></div>
<h4 style="grid-column:span 3;margin:20px 0 10px">📦 物流配置</h4>
<input type="text" id="sExpress1" placeholder="快递公司1" value="DHL">
<input type="text" id="sExpress2" placeholder="快递公司2" value="FedEx">
<input type="text" id="sExpress3" placeholder="快递公司3" value="顺丰">
<button class="btn btn-primary" style="grid-column:span 3;margin-top:20px" onclick="saveSettings()">💾 保存设置</button>
</div>
</div>
</div>
</div>

<script>
// ==================== 数据 ====================
var db = {
  products: JSON.parse(localStorage.getItem('panda_products') || '[{"id":1,"name":"熊猫智能电子烟 Pro","tag":"2026新品","desc":"全球首款带智能屏幕","price":70,"originalPrice":99,"pandaTokens":3000,"stock":500,"status":"active"},{"id":2,"name":"熊猫智能电子烟 Lite","tag":"性价比","desc":"简约版","price":49,"originalPrice":69,"pandaTokens":1500,"stock":800,"status":"active"},{"id":3,"name":"熊猫套装","tag":"超值","desc":"套装","price":129,"originalPrice":199,"pandaTokens":5000,"stock":200,"status":"active"}]'),
  orders: JSON.parse(localStorage.getItem('panda_orders') || '[]'),
  users: JSON.parse(localStorage.getItem('panda_users') || '[]'),
  settings: JSON.parse(localStorage.getItem('panda_settings') || '{"referralBonus":500,"ecigBonus":3000}')
};

function saveData() {
  localStorage.setItem('panda_products', JSON.stringify(db.products));
  localStorage.setItem('panda_orders', JSON.stringify(db.orders));
  localStorage.setItem('panda_users', JSON.stringify(db.users));
  localStorage.setItem('panda_settings', JSON.stringify(db.settings));
  updateStats();
}

// ==================== Tab切换 ====================
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(function(el) {el.classList.remove('active');});
  document.querySelectorAll('.sidebar a').forEach(function(el) {el.classList.remove('active');});
  document.getElementById(tab + 'Tab').classList.add('active');
  event.target.classList.add('active');
  renderAll();
}

function filterOrders(status) {
  document.querySelectorAll('.tab-btn').forEach(function(el) {el.classList.remove('active');});
  event.target.classList.add('active');
  renderOrders(status);
}

// ==================== 统计 ====================
function updateStats() {
  var totalSales = db.orders.reduce(function(s, o) {return s + (o.total || 0);}, 0);
  var pending = db.orders.filter(function(o) {return o.status === 'pending_payment' || o.status === 'paid';}).length;
  
  document.getElementById('totalSales').innerText = '$' + totalSales.toLocaleString();
  document.getElementById('totalOrders').innerText = db.orders.length;
  document.getElementById('totalUsers').innerText = db.users.length;
  document.getElementById('pendingOrders').innerText = pending;
}

// ==================== 商品管理 ====================
function renderProducts() {
  var tbody = document.getElementById('productTable');
  tbody.innerHTML = db.products.map(function(p) {
    return '<tr>' +
      '<td>' + p.id + '</td>' +
      '<td><b>' + p.name + '</b><br><small style="color:#888">' + (p.tag || '') + '</small></td>' +
      '<td>$' + p.price + '</td>' +
      '<td>' + p.pandaTokens + '</td>' +
      '<td>' + p.stock + '</td>' +
      '<td><span class="status ' + p.status + '">' + (p.status === 'active' ? '在售' : '下架') + '</span></td>' +
      '<td>' +
        '<button class="action-btn view" onclick="editProduct(' + p.id + ')">编辑</button>' +
        '<button class="action-btn ' + (p.status === 'active' ? 'ship' : 'complete') + '" onclick="toggleProduct(' + p.id + ')">' + (p.status === 'active' ? '下架' : '上架') + '</button>' +
      '</td></tr>';
  }).join('');
}

function showProductForm(product) {
  var form = document.getElementById('productForm');
  form.style.display = 'block';
  if (product) {
    document.getElementById('pName').value = product.name;
    document.getElementById('pPrice').value = product.price;
    document.getElementById('pStock').value = product.stock;
    document.getElementById('pTokens').value = product.pandaTokens;
    document.getElementById('pTag').value = product.tag || '';
    document.getElementById('pDesc').value = product.desc || '';
    form.dataset.editId = product.id;
  } else {
    form.dataset.editId = '';
  }
}

function hideProductForm() {
  document.getElementById('productForm').style.display = 'none';
}

function saveProduct() {
  var id = parseInt(document.getElementById('productForm').dataset.editId) || Date.now();
  var product = {
    id: id,
    name: document.getElementById('pName').value,
    price: parseInt(document.getElementById('pPrice').value),
    stock: parseInt(document.getElementById('pStock').value),
    pandaTokens: parseInt(document.getElementById('pTokens').value),
    tag: document.getElementById('pTag').value,
    desc: document.getElementById('pDesc').value,
    status: 'active'
  };
  
  var idx = db.products.findIndex(function(p) {return p.id === id;});
  if (idx >= 0) {
    db.products[idx] = product;
  } else {
    db.products.push(product);
  }
  
  saveData();
  hideProductForm();
  renderProducts();
  alert('保存成功!');
}

function editProduct(id) {
  var p = db.products.find(function(o) {return o.id === id;});
  if (p) showProductForm(p);
}

function toggleProduct(id) {
  var p = db.products.find(function(o) {return o.id === id;});
  if (p) {
    p.status = p.status === 'active' ? 'inactive' : 'active';
    saveData();
    renderProducts();
  }
}

// ==================== 订单管理 ====================
function renderOrders(filter) {
  var orders = filter === 'all' ? db.orders : db.orders.filter(function(o) {return o.status === filter;});
  var tbody = document.getElementById('orderTable');
  
  tbody.innerHTML = orders.map(function(o) {
    var items = (o.items || []).map(function(i) {return i.name + 'x' + i.qty;}).join(', ');
    var statusText = {pending_payment:'待支付',paid:'已支付',shipped:'已发货',completed:'已完成'}[o.status] || o.status;
    return '<tr>' +
      '<td><b>' + o.id + '</b></td>' +
      '<td>' + (o.userName || '匿名') + '</td>' +
      '<td><small>' + items + '</small></td>' +
      '<td>$' + (o.total || 0) + '</td>' +
      '<td><span class="status ' + o.status + '">' + statusText + '</span></td>' +
      '<td>' + new Date(o.created).toLocaleDateString() + '</td>' +
      '<td>' +
        (o.status === 'pending_payment' ? '<button class="action-btn ship" onclick="updateOrder(\'' + o.id + '\',\'paid\')">确认支付</button>' : '') +
        (o.status === 'paid' ? '<button class="action-btn ship" onclick="showShipForm(\'' + o.id + '\')">发货</button>' : '') +
        (o.status === 'shipped' ? '<button class="action-btn complete" onclick="updateOrder(\'' + o.id + '\',\'completed\')">完成</button>' : '') +
      '</td></tr>';
  }).join('');
}

function updateOrder(id, status) {
  var o = db.orders.find(function(ord) {return ord.id === id;});
  if (o) {
    o.status = status;
    if (status === 'shipped') {
      o.shipTime = new Date().toISOString();
    }
    saveData();
    renderOrders('all');
  }
}

function showShipForm(id) {
  var express = prompt('快递公司 (DHL/FedEx/顺丰):');
  var tracking = prompt('运单号:');
  if (express && tracking) {
    var o = db.orders.find(function(ord) {return ord.id === id;});
    if (o) {
      o.express = express;
      o.tracking = tracking;
      o.status = 'shipped';
      saveData();
      renderOrders('all');
    }
  }
}

// ==================== 用户管理 ====================
function renderUsers() {
  var tbody = document.getElementById('userTable');
  tbody.innerHTML = db.users.map(function(u) {
    return '<tr>' +
      '<td>' + u.id + '</td>' +
      '<td>' + u.name + '</td>' +
      '<td><small>' + u.identifier + '</small></td>' +
      '<td><code>' + (u.referralCode || '-') + '</code></td>' +
      '<td>' + (u.referredBy || '-') + '</td>' +
      '<td>' + new Date(u.created).toLocaleDateString() + '</td>' +
      '<td><button class="action-btn view">详情</button></td></tr>';
  }).join('');
}

// ==================== 物流管理 ====================
function renderLogistics() {
  var shipped = db.orders.filter(function(o) {return o.status === 'shipped' || o.status === 'completed';});
  var tbody = document.getElementById('logisticsTable');
  tbody.innerHTML = shipped.map(function(o) {
    var items = (o.items || []).map(function(i) {return i.name;}).join(', ');
    return '<tr>' +
      '<td>' + o.id + '</td>' +
      '<td>' + items + '</td>' +
      '<td>' + (o.express || '-') + '</td>' +
      '<td><code>' + (o.tracking || '-') + '</code></td>' +
      '<td><span class="status ' + o.status + '">' + (o.status === 'shipped' ? '运输中' : '已签收') + '</span></td>' +
      '<td><button class="action-btn view" onclick="alert(\'物流查询: ' + o.tracking + '\')">查询</button></td></tr>';
  }).join('');
}

function scanCode() {
  var code = document.getElementById('scanInput').value;
  var order = db.orders.find(function(o) {return o.id === code || o.tracking === code;});
  if (order) {
    alert('找到订单: ' + order.id + '\n状态: ' + order.status + '\n商品: ' + (order.items||[]).map(function(i){return i.name;}).join(','));
    if (order.status === 'paid') {
      showShipForm(order.id);
    }
  } else {
    alert('未找到订单');
  }
}

// ==================== 设置 ====================
function saveSettings() {
  db.settings = {
    referralBonus: document.getElementById('sReferralBonus').value,
    ecigBonus: document.getElementById('sEcigBonus').value,
    apiUrl: document.getElementById('sApiUrl').value,
    express: [
      document.getElementById('sExpress1').value,
      document.getElementById('sExpress2').value,
      document.getElementById('sExpress3').value
    ]
  };
  saveData();
  alert('设置已保存!');
}

function exportData() {
  var data = JSON.stringify(db, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'panda-ecommerce-' + Date.now() + '.json';
  a.click();
}

function renderAll() {
  updateStats();
  renderProducts();
  renderOrders('all');
  renderUsers();
  renderLogistics();
}

// Init
renderAll();
</script>
</body>
</html>
