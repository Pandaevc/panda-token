<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - PandaToken</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#fff;min-height:100vh}
.login{position:fixed;inset:0;background:#0D0D0D;display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:#1A1A1A;padding:40px;border-radius:16px;width:340px;text-align:center}
.login-box h2{color:#FF6B35;margin-bottom:24px}
.input{width:100%;padding:14px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:14px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF6B35,#FF9800);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:#1A1A1A;padding:20px;display:none}
.sidebar h2{color:#FFD700;margin-bottom:20px}
.sidebar a{display:block;padding:12px;color:#888;text-decoration:none;border-radius:8px;margin-bottom:4px}
.sidebar a:hover,.sidebar a.active{background:#FF6B35;color:#fff}
.main{margin-left:220px;padding:24px;display:none}
.header{display:flex;justify-content:space-between;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:6px}
.card{background:#1A1A1A;padding:24px;border-radius:16px;margin-bottom:20px}
.card h3{margin-bottom:16px}
table{width:100%}
th,td{padding:12px;text-align:left;border-bottom:1px solid #333}
th{color:#666;font-size:12px}
.pay-method{display:flex;gap:10px;margin-bottom:20px}
.pay-tab{padding:10px 20px;background:#1A1A1A;border:none;border-radius:8px;color:#888;cursor:pointer}
.pay-tab.active{background:#FF6B35;color:#fff}
.pay-section{display:none}
.pay-section.active{display:block}
.account-card{background:#0D0D0D;padding:14px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.account-name{font-weight:600}
.account-detail{font-size:12px;color:#666;word-break:break-all}
.account-actions button{padding:6px 10px;background:#333;border:none;border-radius:6px;color:#fff;cursor:pointer;margin-left:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000}
.modal.show{display:flex}
.modal-box{background:#1A1A1A;padding:24px;border-radius:16px;width:400px}
.modal input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:12px}
</style>
</head>
<body>
<!-- Login -->
<div class="login" id="loginScreen">
<div class="login-box">
<h2>🐼 管理后台</h2>
<input type="text" class="input" id="adminUser" placeholder="用户名 (admin)">
<input type="password" class="input" id="adminPass" placeholder="密码 (admin123)">
<button class="btn" onclick="doLogin()">登录</button>
<p style="margin-top:16px;font-size:12px;color:#666">账号: admin | 密码: admin123</p>
</div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
<h2>🐼 PandaToken</h2>
<a href="#" class="active" onclick="showPage('dashboard')">📊 数据概览</a>
<a href="#" onclick="showPage('orders')">📋 订单</a>
<a href="#" onclick="showPage('products')">📦 商品</a>
<a href="#" onclick="showPage('users')">👥 用户</a>
<a href="#" onclick="showPage('logistics')">🚚 物流</a>
<a href="#" onclick="showPage('payments')">💳 支付</a>
<a href="shop.html" style="margin-top:20px;border-top:1px solid #333;padding-top:20px">← 返回商店</a>
</div>

<!-- Main -->
<div class="main" id="main">
<div class="header"><h1>📊 数据概览</h1></div>
<div class="stats">
<div class="stat"><div class="v" id="statSales">$0</div><div class="l">销售额</div></div>
<div class="stat"><div class="v" id="statOrders">0</div><div class="l">订单</div></div>
<div class="stat"><div class="v" id="statUsers">0</div><div class="l">用户</div></div>
<div class="stat"><div class="v" id="statPending">0</div><div class="l">待处理</div></div>
</div>
<div class="card"><h3>最近订单</h3><table><thead><tr><th>订单号</th><th>用户</th><th>金额</th><th>状态</th></tr></thead><tbody id="recentTable"></tbody></table></div>
</div>

<!-- Orders -->
<div class="main" id="ordersPage" style="display:none">
<div class="header"><h1>📋 订单管理</h1></div>
<div class="card"><table><thead><tr><th>订单号</th><th>用户</th><th>金额</th><th>支付</th><th>状态</th><th>操作</th></tr></thead><tbody id="orderTable"></tbody></table></div>
</div>

<!-- Products -->
<div class="main" id="productsPage" style="display:none">
<div class="header"><h1>📦 商品管理</h1><button class="btn" style="width:auto;padding:10px 20px" onclick="showAddProduct()">➕ 添加</button></div>
<div class="card"><table><thead><tr><th>ID</th><th>名称</th><th>价格</th><th>代币</th><th>口味</th><th>操作</th></tr></thead><tbody id="productTable"></tbody></table></div>
</div>

<!-- Users -->
<div class="main" id="usersPage" style="display:none">
<div class="header"><h1>👥 用户管理</h1></div>
<div class="card"><table><thead><tr><th>ID</th><th>名称</th><th>手机</th><th>推荐码</th><th>订单</th></tr></thead><tbody id="userTable"></tbody></table></div>
</div>

<!-- Logistics -->
<div class="main" id="logisticsPage" style="display:none">
<div class="header"><h1>🚚 物流配送</h1></div>
<div class="card"><h3>待发货</h3><table><thead><tr><th>订单</th><th>收货人</th><th>地址</th><th>操作</th></tr></thead><tbody id="shipTable"></tbody></table></div>
</div>

<!-- Payments -->
<div class="main" id="paymentsPage" style="display:none">
<div class="header"><h1>💳 支付管理</h1></div>
<div class="pay-method">
<button class="pay-tab active" onclick="switchPay('usdt')">🔷 USDT</button>
<button class="pay-tab" onclick="switchPay('visa')">💳 Visa</button>
<button class="pay-tab" onclick="switchPay('mast')">💳 Mastercard</button>
</div>
<div class="pay-section active" id="usdtPay">
<div class="card"><h3>USDT地址 <button class="btn" style="width:auto;float:right;padding:6px 12px;font-size:12px" onclick="showAddPay('usdt')">➕</button></h3><div id="usdtList"></div></div>
</div>
<div class="pay-section" id="visaPay">
<div class="card"><h3>Visa账户 <button class="btn" style="width:auto;float:right;padding:6px 12px;font-size:12px" onclick="showAddPay('visa')">➕</button></h3><div id="visaList"></div></div>
</div>
<div class="pay-section" id="mastPay">
<div class="card"><h3>Mastercard账户 <button class="btn" style="width:auto;float:right;padding:6px 12px;font-size:12px" onclick="showAddPay('mast')">➕</button></h3><div id="mastList"></div></div>
</div>
</div>

<!-- Add Payment Modal -->
<div class="modal" id="addPayModal">
<div class="modal-box">
<h3 id="payModalTitle" style="margin-bottom:16px">添加账户</h3>
<div id="usdtFields">
<input type="text" id="payName" placeholder="名称 (USDT-01)">
<input type="text" id="payAddr" placeholder="TRC20地址">
<input type="text" id="payNote" placeholder="备注">
</div>
<div id="cardFields" style="display:none">
<input type="text" id="payName" placeholder="名称 (Visa-01)">
<input type="text" id="payHolder" placeholder="持卡人">
<input type="text" id="payNum" placeholder="卡号">
</div>
<button class="btn" onclick="savePay()">保存</button>
<button onclick="closePayModal()" style="margin-top:10px;background:none;border:none;color:#666;cursor:pointer">取消</button>
</div>
</div>

<!-- Add Product Modal -->
<div class="modal" id="addProdModal">
<div class="modal-box">
<h3 style="margin-bottom:16px">添加商品</h3>
<input type="text" id="prodName" placeholder="商品名称">
<input type="number" id="prodPrice" placeholder="价格">
<input type="number" id="prodTokens" placeholder="代币数量">
<input type="text" id="prodFlavors" placeholder="口味(逗号分隔)">
<button class="btn" onclick="saveProd()">保存</button>
<button onclick="closeProdModal()" style="margin-top:10px;background:none;border:none;color:#666;cursor:pointer">取消</button>
</div>
</div>

<script>
// Data
var db = {
  products: [{id:1,name:'熊猫电子烟Pro',price:70,tokens:3000,flavors:'原味,薄荷,芒果,葡萄'}],
  orders: [],
  users: [],
  payments: {
    usdt: [{id:1,name:'USDT-主',address:'TDPBRADTHB4GP4VHWVDYNAEJXKQM3D3E3E',note:'主账户'}],
    visa: [],
    mast: []
  }
};
var currentPay = 'usdt';

// Login
function doLogin() {
  var u = document.getElementById('adminUser').value;
  var p = document.getElementById('adminPass').value;
  if (u === 'admin' && p === 'admin123') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('sidebar').style.display = 'block';
    document.getElementById('main').style.display = 'block';
    loadData();
  } else {
    alert('错误！账号:admin 密码:admin123');
  }
}

// Load
function loadData() {
  var s = localStorage.getItem('panda_admin_db');
  if (s) { var p = JSON.parse(s); db = {...db, ...p}; }
  render();
}

function saveData() {
  localStorage.setItem('panda_admin_db', JSON.stringify(db));
  render();
}

function render() {
  var sales = db.orders.reduce(function(t,o){return t+(o.amount||0)},0);
  document.getElementById('statSales').innerText = '$'+sales;
  document.getElementById('statOrders').innerText = db.orders.length;
  document.getElementById('statUsers').innerText = db.users.length;
  document.getElementById('statPending').innerText = db.orders.filter(function(o){return o.status==='pending_payment'}).length;
  
  document.getElementById('recentTable').innerHTML = db.orders.slice(-5).reverse().map(function(o){
    return '<tr><td>'+o.id+'</td><td>'+(o.userPhone||'匿名')+'</td><td>$'+o.amount+'</td><td>'+(o.status||'待支付')+'</td></tr>';
  }).join('');
  
  document.getElementById('orderTable').innerHTML = db.orders.map(function(o){
    return '<tr><td>'+o.id+'</td><td>'+(o.userPhone||'匿名')+'</td><td>$'+o.amount+'</td><td>'+(o.payMethod||'-').toUpperCase()+'</td><td>'+(o.status||'待支付')+'</td><td>'+(o.status==='paid'?'<button onclick="shipOrder(\''+o.id+'\')">发货</button>':'')+'</td></tr>';
  }).join('');
  
  document.getElementById('productTable').innerHTML = db.products.map(function(p){
    return '<tr><td>'+p.id+'</td><td>'+p.name+'</td><td>$'+p.price+'</td><td>'+p.tokens+'</td><td>'+p.flavors+'</td><td><button onclick="delProd('+p.id+')">删除</button></td></tr>';
  }).join('');
  
  document.getElementById('userTable').innerHTML = db.users.map(function(u){
    return '<tr><td>'+u.id+'</td><td>'+u.name+'</td><td>'+u.phone+'</td><td>'+(u.referralCode||'-')+'</td><td>'+db.orders.filter(function(o){return o.userPhone===u.phone}).length+'</td></tr>';
  }).join('');
  
  var toShip = db.orders.filter(function(o){return o.status==='paid'});
  document.getElementById('shipTable').innerHTML = toShip.map(function(o){
    return '<tr><td>'+o.id+'</td><td>'+(o.ship?o.ship.name:'-')+'</td><td>'+(o.ship?o.ship.country+' '+o.ship.address:'-')+'</td><td><button onclick="shipOrder(\''+o.id+'\')">发货</button></td></tr>';
  }).join('');
  
  document.getElementById('usdtList').innerHTML = db.payments.usdt.map(function(a){
    return '<div class="account-card"><div><div class="account-name">'+a.name+'</div><div class="account-detail">'+a.address+'</div></div><div><button onclick="copyAddr(\''+a.address+'\')">复制</button><button onclick="delPay(\'usdt\','+a.id+')">删除</button></div></div>';
  }).join('')||'<p style="color:#666">暂无</p>';
  
  document.getElementById('visaList').innerHTML = db.payments.visa.map(function(a){
    return '<div class="account-card"><div><div class="account-name">'+a.name+'</div><div class="account-detail">'+a.holder+' | '+a.number+'</div></div><button onclick="delPay(\'visa\','+a.id+')">删除</button></div>';
  }).join('')||'<p style="color:#666">暂无</p>';
  
  document.getElementById('mastList').innerHTML = db.payments.mast.map(function(a){
    return '<div class="account-card"><div><div class="account-name">'+a.name+'</div><div class="account-detail">'+a.holder+' | '+a.number+'</div></div><button onclick="delPay(\'mast\','+a.id+')">删除</button></div>';
  }).join('')||'<p style="color:#666">暂无</p>';
}

// Pages
function showPage(page) {
  document.querySelectorAll('.main').forEach(function(el){el.style.display='none'});
  document.getElementById(page+'Page').style.display = 'block';
  event.target.classList.add('active');
}

function switchPay(type) {
  currentPay = type;
  document.querySelectorAll('.pay-tab').forEach(function(el){el.classList.remove('active')});
  event.target.classList.add('active');
  document.querySelectorAll('.pay-section').forEach(function(el){el.classList.remove('active')});
  document.getElementById(type+'Pay').classList.add('active');
}

// Orders
function shipOrder(id) {
  var o = db.orders.find(function(x){return x.id===id});
  if (o) {
    var e = prompt('快递公司:');
    var t = prompt('运单号:');
    if (e && t) { o.status = 'shipped'; o.express = e; o.tracking = t; saveData(); }
  }
}

// Products
function showAddProduct() { document.getElementById('addProdModal').classList.add('show'); }
function closeProdModal() { document.getElementById('addProdModal').classList.remove('show'); }
function saveProd() {
  db.products.push({id:Date.now(),name:document.getElementById('prodName').value,price:parseInt(document.getElementById('prodPrice').value),tokens:parseInt(document.getElementById('prodTokens').value),flavors:document.getElementById('prodFlavors').value});
  saveData(); closeProdModal();
}
function delProd(id) { if(confirm('删除?')){db.products=db.products.filter(function(p){return p.id!==id});saveData();} }

// Payments
function showAddPay(type) {
  currentPay = type;
  document.getElementById('payModalTitle').innerText = type==='usdt'?'添加USDT':'添加'+type.toUpperCase();
  document.getElementById('usdtFields').style.display = type==='usdt'?'block':'none';
  document.getElementById('cardFields').style.display = type!=='usdt'?'block':'none';
  document.getElementById('addPayModal').classList.add('show');
}
function closePayModal() { document.getElementById('addPayModal').classList.remove('show'); }
function savePay() {
  if (currentPay === 'usdt') {
    db.payments.usdt.push({id:Date.now(),name:document.getElementById('payName').value,address:document.getElementById('payAddr').value,note:document.getElementById('payNote').value});
  } else {
    db.payments[currentPay].push({id:Date.now(),name:document.getElementById('payName').value,holder:document.getElementById('payHolder').value,number:document.getElementById('payNum').value});
  }
  saveData(); closePayModal();
}
function delPay(type,id) { if(confirm('删除?')){db.payments[type]=db.payments[type].filter(function(a){return a.id!==id});saveData();} }
function copyAddr(a) { navigator.clipboard.writeText(a); alert('已复制'); }
</script>
</body>
</html>
