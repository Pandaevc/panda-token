<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商管理后台 - PandaToken</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FF6B35;--accent:#FFD700;--success:#00E676;--danger:#ff4757;--dark:#0D0D0D;--darker:#050505;--surface:#1A1A1A;--text:#FFF;--text-muted:#888;--g:linear-gradient(135deg,#FF6B35,#FF9800);--b:1px solid rgba(255,255,255,0.08)}
body{background:var(--darker);color:var(--text);font-family:-apple-system,system-ui;sans-serif;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--surface);border-right:var(--b);padding:24px}
.sidebar h2{font-size:18px;margin-bottom:30px;color:var(--accent)}
.sidebar a{display:block;padding:14px 16px;color:#AAA;text-decoration:none;border-radius:10px;margin-bottom:8px;transition:all 0.3s}
.sidebar a:hover,.sidebar a.active{background:var(--g);color:#fff}
.main{margin-left:240px;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:var(--b)}
.header h1{font-size:28px}
.btn{padding:10px 20px;border-radius:10px;border:none;font-weight:600;cursor:pointer}
.btn-primary{background:var(--g);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.stat{background:var(--surface);padding:24px;border-radius:16px;text-align:center}
.stat .v{font-size:32px;font-weight:700;color:var(--accent)}
.stat .l{font-size:13px;color:var(--text-muted);margin-top:8px}
.card{background:var(--surface);border-radius:16px;padding:24px;margin-bottom:24px}
.card h3{font-size:18px;margin-bottom:20px;padding-bottom:12px;border-bottom:var(--b)}
table{width:100%;border-collapse:collapse}
th,td{padding:14px;text-align:left;border-bottom:var(--b)}
th{font-size:12px;color:var(--text-muted);font-weight:600}
.status{ padding:4px 12px;border-radius:20px;font-size:12px}
.status.pending{background:rgba(255,215,0,0.2);color:var(--accent)}
.status.completed{background:rgba(0,230,118,0.2);color:var(--success)}
.status.shipped{background:rgba(255,107,53,0.2);color:var(--primary)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.form input,.form select,.form textarea{width:100%;padding:12px;background:var(--dark);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#fff}
.form textarea{grid-column:span 2;min-height:100px}
.form label{grid-column:span 2;font-size:13px;color:var(--text-muted);margin-top:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-right:8px}
.badge.active{background:rgba(0,230,118,0.2);color:var(--success)}
.badge.inactive{background:rgba(255,71,87,0.2);color:var(--danger)}
@media(max-width:1200px){.sidebar{display:none}.main{margin-left:0}}
</style>
</head>
<body>
<div class="sidebar">
<h2>🏪 电商管理</h2>
<a href="#dashboard" class="active">📊 数据概览</a>
<a href="#products">📦 商品管理</a>
<a href="#orders">📋 订单管理</a>
<a href="#users">👥 用户管理</a>
<a href="#logistics">🚚 物流管理</a>
<a href="shop.html">← 返回商店</a>
</div>

<div class="main">
<div class="header">
<h1>📊 数据概览</h1>
<button class="btn btn-primary" onclick="exportData()">📥 导出数据</button>
</div>

<div class="stats">
<div class="stat"><div class="v" id="totalSales">$12,450</div><div class="l">总销售额</div></div>
<div class="stat"><div class="v" id="totalOrders">178</div><div class="l">总订单</div></div>
<div class="stat"><div class="v" id="totalUsers">892</div><div class="l">用户数</div></div>
<div class="stat"><div class="v" id="pendingShip">23</div><div class="l">待发货</div></div>
</div>

<div class="card" id="orders">
<h3>📋 最近订单</h3>
<table>
<thead><tr><th>订单号</th><th>用户</th><th>商品</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="orderTable">
<!-- Orders rendered by JS -->
</tbody>
</table>
</div>

<div class="card" id="products">
<h3>📦 商品管理</h3>
<div class="form">
<input type="text" id="prodName" placeholder="商品名称">
<input type="text" id="prodPrice" placeholder="价格">
<input type="text" id="prodStock" placeholder="库存">
<input type="text" id="prodTokens" placeholder="代币数量">
<textarea id="prodDesc" placeholder="商品描述"></textarea>
<button class="btn btn-primary" onclick="addProduct()">➕ 添加商品</button>
</div>
<table style="margin-top:20px">
<thead><tr><th>ID</th><th>名称</th><th>价格</th><th>库存</th><th>代币</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="productTable">
</tbody>
</table>
</div>

<div class="card" id="logistics">
<h3>🚚 物流管理</h3>
<table>
<thead><tr><th>订单号</th><th>快递公司</th><th>运单号</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="logisticsTable">
</tbody>
</table>
</div>
</div>

<script>
// Data
var orders = [
{id: 'ORD001', user: 'john@gmail.com', product: '熊猫Pro', amount: 70, status: 'pending', tracking: '', express: ''},
{id: 'ORD002', user: 'alice@whatsapp', product: '熊猫Lite', amount: 49, status: 'shipped', tracking: 'SF123456789', express: '顺丰'},
{id: 'ORD003', user: 'bob@facebook', product: '熊猫套装', amount: 129, status: 'completed', tracking: 'YT987654321', express: '圆通'}
];

var products = [
{id: 1, name: '熊猫智能电子烟 Pro', price: 70, stock: 500, tokens: 3000, status: 'active'},
{id: 2, name: '熊猫智能电子烟 Lite', price: 49, stock: 800, tokens: 1500, status: 'active'},
{id: 3, name: '熊猫电子烟套装', price: 129, stock: 200, tokens: 5000, status: 'active'}
];

function renderOrders() {
  var tbody = document.getElementById('orderTable');
  tbody.innerHTML = orders.map(function(o) {
    return '<tr>' +
      '<td>' + o.id + '</td>' +
      '<td>' + o.user + '</td>' +
      '<td>' + o.product + '</td>' +
      '<td>$' + o.amount + '</td>' +
      '<td><span class="status ' + o.status + '">' + 
        (o.status === 'pending' ? '待发货' : o.status === 'shipped' ? '已发货' : '已完成') + 
      '</span></td>' +
      '<td><button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="shipOrder(\'' + o.id + '\')">发货</button></td>' +
    '</tr>';
  }).join('');
}

function renderProducts() {
  var tbody = document.getElementById('productTable');
  tbody.innerHTML = products.map(function(p) {
    return '<tr>' +
      '<td>' + p.id + '</td>' +
      '<td>' + p.name + '</td>' +
      '<td>$' + p.price + '</td>' +
      '<td>' + p.stock + '</td>' +
      '<td>' + p.tokens + '</td>' +
      '<td><span class="badge ' + (p.status === 'active' ? 'active' : 'inactive') + '">' + p.status + '</span></td>' +
      '<td><button class="btn btn-danger" style="padding:6px 12px;font-size:12px" onclick="deleteProduct(' + p.id + ')">删除</button></td>' +
    '</tr>';
  }).join('');
}

function renderLogistics() {
  var tbody = document.getElementById('logisticsTable');
  tbody.innerHTML = orders.filter(function(o) { return o.status !== 'pending'; }).map(function(o) {
    return '<tr>' +
      '<td>' + o.id + '</td>' +
      '<td>' + (o.express || '-') + '</td>' +
      '<td>' + (o.tracking || '-') + '</td>' +
      '<td><span class="status ' + o.status + '">' + 
        (o.status === 'shipped' ? '运输中' : '已签收') + 
      '</span></td>' +
      '<td><button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="updateLogistics(\'' + o.id + '\')">更新</button></td>' +
    '</tr>';
  }).join('');
}

function addProduct() {
  var name = document.getElementById('prodName').value;
  var price = parseInt(document.getElementById('prodPrice').value);
  var stock = parseInt(document.getElementById('prodStock').value);
  var tokens = parseInt(document.getElementById('prodTokens').value);
  
  if (name && price) {
    products.push({id: products.length + 1, name: name, price: price, stock: stock || 0, tokens: tokens || 0, status: 'active'});
    renderProducts();
    alert('商品已添加!');
  }
}

function deleteProduct(id) {
  if (confirm('确定删除?')) {
    products = products.filter(function(p) { return p.id !== id; });
    renderProducts();
  }
}

function shipOrder(id) {
  var order = orders.find(function(o) { return o.id === id; });
  if (order) {
    var express = prompt('快递公司:', '顺丰');
    var tracking = prompt('运单号:');
    if (express && tracking) {
      order.express = express;
      order.tracking = tracking;
      order.status = 'shipped';
      renderOrders();
      renderLogistics();
    }
  }
}

function updateLogistics(id) {
  var order = orders.find(function(o) { return o.id === id; });
  if (order) {
    var tracking = prompt('更新运单号:', order.tracking);
    if (tracking) {
      order.tracking = tracking;
      renderLogistics();
    }
  }
}

function exportData() {
  var data = {orders: orders, products: products};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'panda-ecommerce-data.json';
  a.click();
}

// Initialize
renderOrders();
renderProducts();
renderLogistics();
</script>
</body>
</html>
