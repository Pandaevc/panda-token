function handleCSVImport(input) {
  var file = input.files[0];
  if (!file) { alert('请选择文件'); return; }
  
  console.log('File:', file.name);
  
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    console.log('Text length:', text.length);
    console.log('Text preview:', text.substring(0, 100));
    
    var positions = parseCSV(text);
    console.log('Positions:', positions);
    
    if (positions && positions.length > 0) {
      var added = 0;
      for (var i = 0; i < positions.length; i++) {
        var p = positions[i];
        var exists = false;
        for (var j = 0; j < db.portfolio.length; j++) {
          if (db.portfolio[j].code === p.code) { exists = true; break; }
        }
        if (!exists) {
          db.portfolio.push(p);
          added++;
        }
      }
      console.log('Added:', added);
      saveData();
      renderPortfolio();
      alert('成功导入 ' + added + ' 只股票！');
    } else {
      alert('未能解析，请检查格式\n格式：名称,代码,数量,价格');
    }
  };
  reader.onerror = function(e) { alert('读取文件失败'); };
  reader.readAsText(file);
}

function parseCSV(text) {
  var positions = [];
  var lines = text.split(/[\n\r]+/);
  
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('股票') >= 0) continue;
    
    // Extract code - look for exactly 6 digits
    var m = line.match(/(\d{6})/);
    if (!m) continue;
    var code = m[1];
    
    // Validate
    if (code.charAt(0) !== '6' && code.charAt(0) !== '0' && 
        code.charAt(0) !== '3' && code.substring(0,2) !== '68') continue;
    
    // Extract all numbers
    var nums = line.match(/(\d+)/g);
    if (!nums || nums.length < 2) continue;
    
    var shares = parseInt(nums[0]) || 100;
    var price = parseFloat(nums[1]) || 10;
    
    // Simple name extraction
    var name = code;
    if (line.indexOf(code) > 0) {
      name = line.substring(0, line.indexOf(code)).replace(/[,，\t ]/g, '');
      if (name.length > 10) name = name.substring(0, 10);
    }
    
    positions.push({
      code: code,
      name: name || code,
      shares: shares,
      buyPrice: price,
      sector: '',
      addTime: Date.now()
    });
  }
  
  console.log('Parsed:', positions.length, 'positions');
  return positions;
}



function downloadTemplate() {
  var csv = "股票名称,股票代码,持股数,成本价\n汉邦高科,300449,1000,15.50\n北京雅克,600410,500,8.20";
  
  // Try modern method first
  if (window.Blob && window.URL) {
    try {
      var blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "持仓模板.csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
      return;
    } catch(e) {}
  }
  
  // Fallback: open in new window
  var win = window.open("", "_blank");
  win.document.write("<pre>" + csv + "</pre>");
  win.document.close();
}



var analysisFilter = 'all';

function filterAnalysis(type) {
  analysisFilter = type;
  var cards = document.querySelectorAll('#analysisResult .card');

    } else {
      var hasTag = card.innerHTML.includes('>'+type+'推荐');
      card.style.display = hasTag ? 'block' : 'none';
    }
  });
}

function getSectorFromConcept(d) {
  // Try to get from concept data
  var concepts = d.f140 || '';
  if (!concepts) {
    // Map by code prefix - f12 might be number or string
    var codePrefix = String(d.f12 || '');
    if (codePrefix.startsWith('68')) return '科创板';
    if (codePrefix.startsWith('30')) return '创业板';
  }
  return concepts || '其他';
}

function isHotSector(sector) {
  if (!sector) return false;
  var hot = ['AI','科技','新能源','半导体','医药'];
  return hot.includes(sector) || (sector.includes && (sector.includes('AI') || sector.includes('科技') || sector.includes('新能源')));
}

function getOperationRecommendation(s, profit) {
  var qa = getQuickAnalysis(s);
  var rec = {action: '持有', color: '#FFD700', reason: []};
  
  // Strong buy
  if (qa.rating === '强' && profit < 5) {
    rec.action = '加仓'; rec.color = '#FF4757'; rec.reason.push('形态强势');
  }
  // Take profit
  else if (profit > 20) {
    rec.action = '减仓'; rec.color = '#FF4757'; rec.reason.push('盈利丰厚');
  }
  // Stop loss
  else if (profit < -8) {
    rec.action = '清仓'; rec.color = '#FF4757'; rec.reason.push('亏损过大');
  }
  // Hold
  else if (qa.rating === '中') {
    rec.action = '持有'; rec.color = '#FFD700'; rec.reason.push('震荡整理');
  }
  // Weak
  else if (qa.rating === '弱') {
    rec.action = '减仓'; rec.color = '#FF4757'; rec.reason.push('走势较弱');
  }
  
  // Hot sector bonus
  if (s.hotConcept && rec.action === '持有') {
    rec.action = '持有'; rec.color = '#2ED573'; rec.reason.push('热门赛道');
  }
  
  return rec;
}

      stock.history = data.data.klines.map(function(k) { return k.split(','); });
    }
  } catch(e) { 
    console.log('Kline error:', e); 
  }
  
  return stock;
}

var allStocks = [];

async function loadStocks() {
  if (allStocks.length > 0) return;
  var codes = [];
  for (var i = 600000; i < 604000; i++) codes.push(i.toString());
  for (var i = 300000; i < 303000; i++) codes.push(i.toString());
  for (var i = 688000; i < 692000; i++) codes.push(i.toString());
  allStocks = [];
  for (var i = 0; i < Math.min(codes.length, 180); i += 18) {
    var promises = codes.slice(i, i+18).map(function(c) { return getStockWithHistory(c); });
    var results = await Promise.all(promises);
    results.forEach(function(s) { if (s && s.price > 0) { allStocks.push(s); stockCache[s.code] = s; } });
  }
}

async function runScreener() {

  var turnoverTh = parseFloat(document.getElementById('filterTurnover').value);

  var tech = document.getElementById('filterTech').value;
  var noST = document.getElementById('filterNoST').checked;
  
  var results = allStocks.filter(function(s) {
    if (noST && s.isST) return false;
    if (changeTh > 0 && s.change < changeTh) return false;
    if (turnoverTh > 0 && s.turnover < turnoverTh) return false;
    if (amountTh > 0 && s.amount < amountTh) return false;
    if (marketMax > 0 && s.market > marketMax) return false;
    if (filterMoney === 'main' && s.mainMoney <= 0) return false;
    if (volPrice !== '0' && s.history && s.history.length >= 2) {
      var today = s.history[s.history.length-1], yes = s.history[s.history.length-2];
      var todayVol = parseFloat(today[5]), yesVol = parseFloat(yes[5]);
      var todayClose = parseFloat(today[2]), yesClose = parseFloat(yes[2]);
      if (volPrice === 'up' && (todayVol <= yesVol || todayClose <= yesClose)) return false;
      if (volPrice === 'vol' && (todayVol <= yesVol * 1.2 || todayClose <= yesClose)) return false;
    }
    if (tech === 'limitup' && s.history) {
      var hasLimit = false;
      for (var j = 0; j < Math.min(s.history.length, 10); j++) {
        var o = parseFloat(s.history[j][1]), c = parseFloat(s.history[j][2]);
        if ((c - o) / o * 100 >= 9.9) { hasLimit = true; break; }
      }
      if (!hasLimit) return false;
    }
    return true;
  }).sort(function(a, b) { return b.change - a.change; }).slice(0, 30);
  
  if (results.length === 0) {
    document.getElementById('screenerResult').innerHTML = '<div style="color:#666;text-align:center;padding:40px">没有符合条件的股票</div>';

  }).join('');
}

function parsePositionsFromText(text) {
  var positions = [];
  var codeMatch = text.match(/(\d{6})/g);
  if (!codeMatch) return positions;
  codeMatch = [...new Set(codeMatch)];
  codeMatch.forEach(code => {
    if (code.startsWith('6') || code.startsWith('0') || code.startsWith('3') || code.startsWith('68')) {
      positions.push({code: code, name: code, shares: 100, buyPrice: 10, sector: '', addTime: Date.now()});
    }
  });
  return positions.slice(0, 10);
}

function calcSupportResistance(s) {
  if (!s.history || s.history.length < 20) return {support: s.price * 0.95, resistance: s.price * 1.05};
  var highs = s.history.map(function(h) { return parseFloat(h[3]); });
  var lows = s.history.map(function(h) { return parseFloat(h[4]); });
  var recentHighs = highs.slice(-20);
  var recentLows = lows.slice(-20);
  var max = Math.max.apply(null, recentHighs);
  var min = Math.min.apply(null, recentLows);
  return {support: min, resistance: max};
}



function getQuickAnalysis(s) {
  // Sort if needed
  if (sort) sortBy = sort;
  var filterRating = document.getElementById('filterRating') ? document.getElementById('filterRating').value : '';
  
  if (sortBy === 'profit') {
    db.portfolio.sort(function(a, b) {

      var pa = sa ? (sa.price - a.buyPrice) / a.buyPrice * 100 : 0;
      var pb = sb ? (sb.price - b.buyPrice) / b.buyPrice * 100 : 0;
      return pb - pa;
    });
  } else if (sortBy === 'rating') {
    db.portfolio.sort(function(a, b) {
      var sa = stockCache[a.code], sb = stockCache[b.code];
      var ra = sa ? getQuickAnalysis(sa).rating : '中';
      var rb = sb ? getQuickAnalysis(sb).rating : '中';
      var score = {强: 3, 中: 2, 弱: 1};
      return (score[rb] || 0) - (score[ra] || 0);
    });
  }
  
  // Filter by rating
  if (filterRating) {
    // Will be applied in rendering
  }
  var alerts = [];
  var score = 0;
  if (!s.history || s.history.length < 5) return {rating: '中', summary: '数据不足', alerts: []};
  
  var h = s.history;
  var today = h[h.length-1], yesterday = h[h.length-2];
  var todayVol = parseFloat(today[5]), yesVol = parseFloat(yesterday[5]);
  var todayClose = parseFloat(today[2]), yesClose = parseFloat(yesterday[2]);
  
  // Volume/price
  if (todayVol > yesVol * 1.2 && todayClose > yesClose) { score += 2; }
  else if (todayVol < yesVol * 0.5 && todayClose < yesClose) { score -= 1; alerts.push('缩量下跌'); }
  
  // Money flow
  var money = (s.mainMoney + s.superMoney) / 10000;
  if (money > 0) score += 2;
  else { score -= 2; alerts.push('主力流出'); }
  
  // Support/Resistance
  var levels = calcSupportResistance(s);
  if (todayClose < levels.support) { score -= 2; alerts.push('跌破支撑'); }
  else if (todayClose > levels.resistance) { score += 3; alerts.push('突破压力'); }
  
  // Gap
  var gap = parseFloat(today[1]) - yesClose;
  var gapPct = gap / yesClose * 100;
  if (gapPct > 3) { score -= 2; alerts.push('上方缺口'); }
  
  var rating = score >= 4 ? '强' : score >= 0 ? '中' : '弱';
  var reasons = [];
  if (todayVol > yesVol * 1.2 && todayClose > yesClose) reasons.push('放量上涨');
  if (money > 0) reasons.push('主力流入');
  else reasons.push('主力流出');
  if (todayClose > levels.resistance) reasons.push('突破压力');
  else if (todayClose < levels.support) reasons.push('跌破支撑');
  if (gapPct > 3) reasons.push('有缺口');
  
  var summary = score >= 4 ? '形态良好' : score >= 0 ? '震荡整理' : '走势较弱';
  
  return {rating: rating, summary: summary, alerts: alerts, reasons: reasons};
}

function analyzeStockTech(s, pos) {
  var signals = [];
  var score = 0;
  if (!s.history || s.history.length < 5) {
    return {signals: [{type: '⚠️', desc: '数据不足'}], rating: '中'};
  }
  var h = s.history;
  var today = h[h.length - 1], yesterday = h[h.length - 2];
  var todayClose = parseFloat(today[2]), todayOpen = parseFloat(today[1]), todayHigh = parseFloat(today[3]), todayLow = parseFloat(today[4]);
  var yesClose = parseFloat(yesterday[2]);
  var todayVol = parseFloat(today[5]), yesVol = parseFloat(yesterday[5]);
  
  // 1. 量价关系
  if (todayVol > yesVol * 1.2 && todayClose > yesClose) {
    signals.push({type: '📊 量价', desc: '放量上涨 - 主力积极', value: true});
    score += 2;
  } else if (todayVol < yesVol * 0.5 && todayClose < yesClose) {
    signals.push({type: '📊 量价', desc: '缩量下跌 - 观望', value: false});
    score -= 1;
  }
  
  // 2. 资金流向
  var money = (s.mainMoney + s.superMoney) / 10000;
  if (money > 0) {
    signals.push({type: '💵 资金', desc: '主力净流入 +' + money.toFixed(0) + '万', value: true});
    score += 2;
  } else {
    signals.push({type: '💵 资金', desc: '主力净流出 ' + money.toFixed(0) + '万', value: false});
    score -= 2;
  }
  
  // 3. 突破压力位
  var levels = calcSupportResistance(s);
  if (todayClose > levels.resistance) {
    signals.push({type: '🚀 突破', desc: '突破压力位 ' + levels.resistance.toFixed(2), value: true});
    score += 3;
  }
  
  // 4. 支撑位站稳
  if (todayClose > levels.support && todayClose < levels.resistance) {
    signals.push({type: '✅ 支撑', desc: '站稳支撑位 ' + levels.support.toFixed(2), value: true});
    score += 1;
  }
  
  // 5. 缺口分析 (Boss提到的)
  if (h.length >= 2) {
    var gap = todayOpen - yesClose;
    var gapPct = gap / yesClose * 100;
    if (gapPct > 3) {
      signals.push({type: '⚠️ 缺口', desc: '上方缺口 ' + gapPct.toFixed(2) + '% (建议等回补)', value: false});
      score -= 2;
    } else if (gapPct < -3) {
      signals.push({type: '✅ 缺口', desc: '下方缺口 ' + Math.abs(gapPct).toFixed(2) + '% (可能支撑)', value: true});
      score += 1;
    }
  }
  
  // 6. 二波上攻形态 (Boss提到的600410类型)
  if (h.length >= 20) {
    var recent = h.slice(-20);
    var firstHalf = recent.slice(0, 10);
    var secondHalf = recent.slice(10);
    var firstAvg = firstHalf.reduce(function(a,b){return a+parseFloat(b[2])},0)/10;
    var secondAvg = secondHalf.reduce(function(a,b){return a+parseFloat(b[2])},0)/10;
    if (secondAvg > firstAvg * 1.1 && todayClose > parseFloat(secondHalf[secondHalf.length-1][1])) {
      signals.push({type: '🌊 二波', desc: '二波上攻形态 - 强势信号', value: true});
      score += 3;
    }
  }
  
  // 7. 主力坚决度 (Boss提到的300499)
  var avgVol = h.slice(-5).reduce(function(a,b){return a+parseFloat(b[5])},0)/5;
  if (todayVol > avgVol * 1.5) {
    signals.push({type: '💪 坚决', desc: '成交量放大 主力可能行动', value: true});
    score += 1;
  } else if (todayVol < avgVol * 0.5) {
    signals.push({type: '😰 犹豫', desc: '缩量 主力不坚决', value: false});
    score -= 1;
  }
  
  var rating = score >= 5 ? '强' : score >= 0 ? '中' : '弱';
  return {signals: signals, rating: rating, support: levels.support, resistance: levels.resistance};
}

    return '<div class="sr-result"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="stock-code" style="font-size:16px">'+a.code+'</span> <span class="tag tag-'+(a.rating==='强'?'green':a.rating==='中'?'yellow':'red')+'">'+a.rating+'推荐</span></div>'+a.signals.map(function(s){return '<div style="padding:4px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>'+s.type+'</span><span class="'+(s.value?'up':'down')+'">'+s.desc+'</span></div>';}).join('')+'</div>';
  }).join('');
}

async function analyzeStock() {
  var code = document.getElementById('analyzeCode').value.trim();
  if (!code) { alert('请输入股票代码'); return; }
  
  // Clean code - remove spaces, etc
  code = code.replace(/\s/g, '');
  
  document.getElementById('analysisResult').innerHTML = '<div class="loading">深度分析中...</div>';
  
  try {
    var s = await getStockWithHistory(code);
    console.log('Stock data:', s);
    
    if (!s) { 
      document.getElementById('analysisResult').innerHTML = '<div style="color:#666;padding:20px">未找到股票: ' + code + '<br>请检查代码是否正确</div>'; 
      return; 
    }
  stockCache[code] = s;
  var result = analyzeStockTech(s, {buyPrice: s.price});
  var html = '<div class="card"><h3>'+s.code+' '+s.name+'</h3>';
  html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">';
  html += '<div class="stat"><div class="v">'+s.price+'</div><div class="l">现价</div></div>';
  html += '<div class="stat"><div class="v '+(s.change>=0?'up':'down')+'">'+(s.change||0).toFixed(2)+'%</div><div class="l">涨跌幅</div></div>';
  html += '<div class="stat"><div class="v">'+(s.turnover||0).toFixed(1)+'%</div><div class="l">换手率</div></div>';
  html += '<div class="stat"><div class="v">'+(s.market||0).toFixed(0)+'亿</div><div class="l">市值</div></div>';
  html += '</div>';
  var rec = getOperationRecommendation(s, 0);
  html += '<div style="margin-bottom:16px;display:flex;gap:12px;align-items:center"><span class="tag tag-'+(result.rating==='强'?'green':result.rating==='中'?'yellow':'red')+'" style="font-size:16px;padding:8px 16px">'+result.rating+'推荐</span><span style="background:'+rec.color+';color:#000;padding:6px 16px;border-radius:6px;font-weight:600">'+rec.action+'</span></div>';
  html += '<div style="background:#0D0D0D;padding:16px;border-radius:8px">';
  html += '<div style="padding:8px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>支撑位</span><span class="up">'+(result.support?result.support.toFixed(2):'-')+'</span></div>';
  html += '<div style="padding:8px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>压力位</span><span class="down">'+(result.resistance?result.resistance.toFixed(2):'-')+'</span></div>';
  html += result.signals.map(function(sg){return '<div style="padding:8px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>'+sg.type+'</span><span class="'+(sg.value?'up':'down')+'">'+sg.desc+'</span></div>';}).join('');
  html += '</div></div>';
  html += '<button class="btn" style="margin-top:16px;width:100%" onclick="showKLine(\''+s.code+'\')">📊 查看K线图</button>';
  document.getElementById('analysisResult').innerHTML = html;
}

async function showKLine(code) {
  var s = stockCache[code];
  if (!s) { s = await getStockWithHistory(code); if (s) stockCache[code] = s; }
  document.getElementById('modalStockName').innerText = s.code + ' ' + s.name;
  document.getElementById('klineModal').style.display = 'flex';
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260222&lmt=60';
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      var klines = data.data.klines;
      var dates = [], closes = [], volumes = [];
      klines.forEach(function(kl) {
        var arr = kl.split(',');
        dates.push(arr[0]);
        closes.push(parseFloat(arr[2]));
        volumes.push(parseFloat(arr[5]));
      });
      Plotly.newPlot('modalKline', [
        {x: dates, y: closes, type: 'scatter', mode: 'lines', line: {color: '#FF6B35'}, name: '收盘价'},
        {x: dates, y: volumes, type: 'bar', yaxis: 'y2', marker: {color: 'rgba(255,107,53,0.5)'}, name: '成交量'}
      ], {paper_bgcolor: '#0D0D0D', plot_bgcolor: '#0D0D0D', xaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'}, yaxis: {tickcolor: '#333', tickfont: {color: '#888'}, gridcolor: '#222'}, yaxis2: {tickcolor: '#333', tickfont: {color: '#888'}, overlaying: 'y', side: 'right'}}, {responsive: true});
    }
  } catch(e) {}
  var money = ((s.mainMoney||0)+(s.superMoney||0))/10000;
  document.getElementById('modalAnalysis').innerHTML = '<div style="margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">现价</div><div style="font-weight:600">'+(s.price||'-')+'</div></div><div style="padding:12px;background:#0D;border-radius:80D0Dpx;text-align:center"><div style="color:#888;font-size:12px">涨跌幅</div><div style="font-weight:600'+(s.change>=0?'color:#FF4757':'color:#2ED573')+'">'+(s.change||0).toFixed(2)+'%</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">换手率</div><div style="font-weight:600">'+(s.turnover||0).toFixed(1)+'%</div></div><div style="padding:12px;background:#0D0D0D;border-radius:8px;text-align:center"><div style="color:#888;font-size:12px">主力净流入</div><div style="font-weight:600'+(money>=0?'color:#2ED573':'color:#FF4757')+'">'+(money>=0?'+':'')+money.toFixed(0)+'万</div></div></div>';
}
