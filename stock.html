<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票管理系统 - 红熵AI</title>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0D0D0D;color:#FFF;min-height:100vh}
.header{background:#1A1A1A;padding:16px 24px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:20px;font-weight:700;color:#FF6B35}
.nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 auto}
.nav a{color:#888;text-decoration:none;padding:8px 16px;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#FF6B35;color:#FFF}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#1A1A1A;padding:20px;border-radius:12px}
.stat .v{font-size:28px;font-weight:700;color:#FFD700}
.stat .l{font-size:12px;color:#666;margin-top:4px}
.card{background:#1A1A1A;border-radius:12px;padding:20px;margin-bottom:20px}
.card h3{margin-bottom:16px}
.stock-code{color:#FF6B35;font-weight:600;cursor:pointer}
.up{color:#FF4757}
.down{color:#2ED573}
.btn{padding:10px 20px;background:#FF6B35;border:none;border-radius:8px;color:#FFF;cursor:pointer}
.btn-outline{background:transparent;border:1px solid #FF6B35;color:#FF6B35}
.input{width:100%;padding:12px;background:#0D0D0D;border:1px solid #333;border-radius:8px;color:#FFF}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.loading{text-align:center;padding:30px;color:#666}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-right:4px}
.tag-green{background:rgba(46,213,115,0.2);color:#2ED573}
.tag-red{background:rgba(255,71,87,0.2);color:#FF4757}
.tag-blue{background:rgba(0,150,255,0.2);color:#0096FF}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#1A1A1A;padding:24px;border-radius:16px;max-width:90%;max-height:90%;overflow:auto}
.sr-result{background:#0D0D0D;padding:16px;border-radius:8px;margin-bottom:8px}
.strategy-card{background:linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,215,0,0.1));border:1px solid rgba(255,107,53,0.3);border-radius:12px;padding:20px;margin-bottom:24px}
.strategy-card h3{color:#FF6B35;margin-bottom:12px}
.alert-box{background:linear-gradient(135deg,rgba(255,71,87,0.2),rgba(255,107,53,0.1));border:1px solid rgba(255,71,87,0.3);border-radius:12px;padding:16px;margin-bottom:16px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐼 红熵AI股票管理系统</div>
<nav class="nav">
<a href="#" class="active" onclick="showPage('dashboard')">📊 仪表盘</a>
<a href="#" onclick="showPage('screener')">🔍 选股</a>
<a href="#" onclick="showPage('portfolio')">💼 持仓</a>
<a href="#" onclick="showPage('analysis')">📈 分析</a>
</nav>
</div>

<div class="container">
<!-- Dashboard -->
<div id="page-dashboard">
<h2 style="margin-bottom:20px">📊 仪表盘</h2>
<div class="stats">
<div class="stat"><div class="v" id="pickCount">0</div><div class="l">今日精选</div></div>
<div class="stat"><div class="v" id="portfolioCount">0</div><div class="l">持仓数量</div></div>
<div class="stat"><div class="v" id="profit">0%</div><div class="l">总盈亏</div></div>
<div class="stat"><div class="v" id="needAction">0</div><div class="l">待操作</div></div>
</div>
<div class="strategy-card">
<h3>📊 策略一：AI综合精选</h3>
<button class="btn" onclick="runStrategy1()">🎯 生成推荐</button>
<div id="strategy1Result" style="margin-top:16px"></div>
</div>
<div class="strategy-card">
<h3>🎯 策略二：强势回调</h3>
<button class="btn" onclick="runStrategy2()">🔍 筛选</button>
<div id="strategy2Result" style="margin-top:16px"></div>
</div>
<div class="card" id="alertCard" style="display:none"><h3>⚠️ 提醒</h3><div id="alertList"></div></div>
</div>

<!-- Screener -->
<div id="page-screener" style="display:none">
<h2 style="margin-bottom:20px">🔍 选股</h2>
<div class="card">
<div style="display:flex;gap:12px;flex-wrap:wrap">
<label><input type="checkbox" id="filterNoST" checked> 去掉ST</label>
<button class="btn" onclick="runScreener()">🔍 筛选</button>
</div>
</div>
<div id="screenerResult"></div>
</div>

<!-- Portfolio -->
<div id="page-portfolio" style="display:none">
<h2 style="margin-bottom:20px">💼 持仓管理</h2>
<div class="card">
<h3>📥 导入持仓</h3>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<button class="btn" onclick="document.getElementById('csvInput').click()">📊 CSV导入</button>
<input type="file" id="csvInput" accept=".csv,.txt" style="display:none" onchange="handleCSVImport(this)">
<button class="btn btn-outline" onclick="showManualInput()">✏️ 手动</button>
</div>
<div id="manualInput" style="display:none;margin-top:12px">
<input type="text" id="addCode" class="input" placeholder="股票代码" style="margin-bottom:8px">
<input type="text" id="addShares" class="input" placeholder="持仓数量" style="margin-bottom:8px">
<input type="text" id="addPrice" class="input" placeholder="买入价格" style="margin-bottom:8px">
<button class="btn" onclick="addPosition()">添加</button>
</div>
</div>
<div id="portfolioList"></div>
</div>

<!-- Analysis -->
<div id="page-analysis" style="display:none">
<h2 style="margin-bottom:20px">📈 股票分析</h2>
<div class="search-box">
<input type="text" id="analyzeCode" placeholder="股票代码">
<button class="btn" onclick="analyzeStock()">分析</button>
</div>
<div id="analysisResult"></div>
</div>
</div>

<!-- Modal -->
<div id="klineModal" class="modal">
<div class="modal-content" style="width:800px">
<h3 id="modalStockName">K线图</h3>
<button class="btn" onclick="document.getElementById('klineModal').style.display='none'">关闭</button>
<div id="modalKline" style="height:350px"></div>
</div>
</div>

<script>
var stockCache = {};
var db = {portfolio: [], picks: []};

function loadData() {
  var s = localStorage.getItem('stock_db');
  if (s) db = JSON.parse(s);
  render();
}
function saveData() {
  localStorage.setItem('stock_db', JSON.stringify(db));
}

async function getStockData(code) {
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2.eastmoney.com/api/qt/stock/get?fltt=2&fields=f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13,f14,f15,f16,f17,f18,f20,f21,f22,f23,f24,f25,f37,f38,f39,f40,f41,f42,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f62,f116,f170,f184,f185,f186&secid=' + secid;
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data) {
      var d = data.data;
      return {code: code, name: d.f58||'', price: d.f43, change: d.f170, volume: d.f47/10000, amount: d.f48/100000000, turnover: d.f50, market: d.f116/100000000, high: d.f44, low: d.f45, open: d.f46, isST: (d.f58||'').includes('ST'), mainMoney: d.f184||0, superMoney: d.f185||0, largeMoney: d.f186||0};
    }
  } catch(e) { console.log(e); }
  return null;
}

async function getStockWithHistory(code) {
  var stock = await getStockData(code);
  if (!stock) return null;
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260222&lmt=60';
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      stock.history = data.data.klines.map(function(k){return k.split(',');});
    }
  } catch(e) {}
  return stock;
}

var allStocks = [];
async function loadStocks() {
  if (allStocks.length > 0) return;
  var codes = [];
  for (var i = 600000; i < 604000; i++) codes.push(i.toString());
  for (var i = 300000; i < 303000; i++) codes.push(i.toString());
  for (var i = 688000; i < 692000; i++) codes.push(i.toString());
  allStocks = [];
  for (var i = 0; i < Math.min(codes.length, 150); i += 15) {
    var promises = codes.slice(i, i+15).map(function(c){return getStockWithHistory(c);});
    var results = await Promise.all(promises);
    results.forEach(function(s){if(s && s.price > 0){allStocks.push(s);stockCache[s.code]=s;}});
  }
}

async function runScreener() {
  await loadStocks();
  document.getElementById('screenerResult').innerHTML = '<div class="loading">筛选中...</div>';
  var noST = document.getElementById('filterNoST').checked;
  var results = allStocks.filter(function(s){if(noST && s.isST) return false;return true;}).sort(function(a,b){return b.change - a.change;}).slice(0,30);
  document.getElementById('screenerResult').innerHTML = results.map(function(s){
    return '<div class="sr-result" style="cursor:pointer" onclick="showKLine(\''+s.code+'\')"><span class="stock-code">'+s.code+'</span> '+s.name+' <span class="'+(s.change>=0?'up':'down')+'">'+(s.change||0).toFixed(2)+'%</span></div>';
  }).join('') || '<div style="color:#666">无</div>';
}

async function runStrategy1() {
  await loadStocks();
  document.getElementById('strategy1Result').innerHTML = '<div class="loading">分析中...</div>';
  var results = allStocks.filter(function(s){return !s.isST && s.change > 0;}).map(function(s){
    var score = Math.min(s.change,10) + (s.mainMoney>0?5:0) + Math.min(s.turnover/2,5);
    return {stock:s, score:score};
  });
  results.sort(function(a,b){return b.score - a.score;});
  var top = results[0];
  if(top) document.getElementById('strategy1Result').innerHTML = '<div class="sr-result"><span class="stock-code">'+top.stock.code+'</span> '+top.stock.name+' <span class="up">'+(top.stock.change||0).toFixed(2)+'%</span></div>';
}

async function runStrategy2() {
  await loadStocks();
  document.getElementById('strategy2Result').innerHTML = '<div class="loading">筛选中...</div>';
  var results = [];
  for(var s of allStocks) {
    if(s.isST || !s.history || s.history.length < 10) continue;
    var hasLimit = false;
    for(var j=0; j<Math.min(s.history.length,10); j++) {
      var o = parseFloat(s.history[j][1]), c = parseFloat(s.history[j][2]);
      if((c-o)/o*100 >= 9.9) {hasLimit = true; break;}
    }
    if(hasLimit) results.push(s);
    if(results.length >= 3) break;
  }
  document.getElementById('strategy2Result').innerHTML = results.length ? results.map(function(s,i){
    return '<div class="sr-result">'+(i+1)+'. <span class="stock-code">'+s.code+'</span> '+s.name+' <span class="up">'+(s.change||0).toFixed(2)+'%</span></div>';
  }).join('') : '<div style="color:#666">无</div>';
}

function showManualInput() {
  var el = document.getElementById('manualInput');
  el.style.display = el.style.display==='none'?'block':'none';
}

function addPosition() {
  var code = document.getElementById('addCode').value.trim();
  var shares = parseFloat(document.getElementById('addShares').value);
  var price = parseFloat(document.getElementById('addPrice').value);
  if(!code || !shares || !price) {alert('请填写完整');return;}
  db.portfolio.push({code:code, name:code, shares:shares, buyPrice:price});
  saveData();
  render();
  document.getElementById('addCode').value='';
  document.getElementById('addShares').value='';
  document.getElementById('addPrice').value='';
}

function handleCSVImport(input) {
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split(/[\n\r]+/);
    var added = 0;
    for(var i=0; i<lines.length; i++) {
      var line = lines[i].trim();
      if(!line || line.indexOf('股票')>=0) continue;
      var m = line.match(/(\d{6})/);
      if(!m) continue;
      var code = m[1];
      if(code.indexOf('6')!==0 && code.indexOf('0')!==0 && code.indexOf('3')!==0) continue;
      var nums = line.match(/(\d+)/g);
      if(!nums || nums.length<2) continue;
      var shares = parseInt(nums[0])||100;
      var price = parseFloat(nums[1])||10;
      if(shares<10) shares=100;
      if(price<1) price=10;
      if(!db.portfolio.some(function(p){return p.code===code;})) {
        db.portfolio.push({code:code, name:code, shares:shares, buyPrice:price});
        added++;
      }
    }
    saveData();
    render();
    alert('成功导入 '+added+' 只股票！');
  };
  reader.readAsText(file);
}

async function render() {
  document.getElementById('portfolioCount').innerText = db.portfolio.length;
  for(var p of db.portfolio) {
    if(!stockCache[p.code]) {
      var s = await getStockWithHistory(p.code);
      if(s) {stockCache[p.code]=s; p.currentPrice=s.price; p.change=s.change;}
    } else {
      p.currentPrice = stockCache[p.code].price;
      p.change = stockCache[p.code].change;
    }
  }
  var totalP = 0, alerts = [];
  var html = db.portfolio.map(function(p) {
    var s = stockCache[p.code];
    if(!s) return '';
    var profit = ((p.currentPrice-p.buyPrice)/p.buyPrice*100);
    totalP += profit;
    var levels = calcSupportResistance(s);
    if(p.currentPrice < levels.support) alerts.push(p.code+'跌破支撑');
    return '<div class="sr-result"><div style="display:flex;justify-content:space-between"><span class="stock-code" onclick="showKLine(\''+p.code+'\')">'+p.code+'</span> <span>'+(profit>=0?'+':'')+profit.toFixed(2)+'%</span></div><div style="color:#888;font-size:12px">持股'+p.shares+' 成本'+p.buyPrice+' 现价'+(p.currentPrice||'-')+'</div></div>';
  }).join('');
  document.getElementById('portfolioList').innerHTML = html || '<div style="color:#666">暂无持仓</div>';
  document.getElementById('profit').innerText = (db.portfolio.length?totalP/db.portfolio.length:0).toFixed(1)+'%';
  document.getElementById('needAction').innerText = alerts.length;
  if(alerts.length > 0) {
    document.getElementById('alertCard').style.display='block';
    document.getElementById('alertList').innerHTML = alerts.map(function(a){return '<div class="alert-box">'+a+'</div>';}).join('');
  } else {
    document.getElementById('alertCard').style.display='none';
  }
}

function calcSupportResistance(s) {
  if(!s.history || s.history.length<20) return {support:s.price*0.95, resistance:s.price*1.05};
  var highs = s.history.map(function(h){return parseFloat(h[3]);});
  var lows = s.history.map(function(h){return parseFloat(h[4]);});
  return {support:Math.min.apply(null,lows.slice(-20)), resistance:Math.max.apply(null,highs.slice(-20))};
}

async function analyzeStock() {
  var code = document.getElementById('analyzeCode').value.trim();
  if(!code) return;
  document.getElementById('analysisResult').innerHTML = '<div class="loading">分析中...</div>';
  var s = await getStockWithHistory(code);
  if(!s) {document.getElementById('analysisResult').innerHTML='<div style="color:#666">未找到</div>';return;}
  var levels = calcSupportResistance(s);
  var money = (s.mainMoney+s.superMoney)/10000;
  document.getElementById('analysisResult').innerHTML = '<div class="card"><h3>'+s.code+' '+s.name+'</h3><div>现价:'+s.price+' 涨跌:'+(s.change||0).toFixed(2)+'%</div><div>换手率:'+(s.turnover||0).toFixed(1)+'% 主力:'+(money>=0?'+':'')+money.toFixed(0)+'万</div><div>支撑:'+(levels.support||'-').toFixed(2)+' 压力:'+(levels.resistance||'-').toFixed(2)+'</div></div><button class="btn" onclick="showKLine(\''+s.code+'\')">查看K线</button>';
}

async function showKLine(code) {
  var s = stockCache[code] || await getStockWithHistory(code);
  if(!s) return;
  document.getElementById('modalStockName').innerText = s.code+' '+s.name;
  document.getElementById('klineModal').style.display = 'flex';
  var secid = code.startsWith('6') ? '1.'+code : '0.'+code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260222&lmt=60';
  var res = await fetch(url);
  var data = await res.json();
  if(data.data && data.data.klines) {
    var klines = data.data.klines;
    var dates=[], closes=[], vols=[];
    klines.forEach(function(kl){
      var a=kl.split(',');
      dates.push(a[0]);closes.push(parseFloat(a[2]));vols.push(parseFloat(a[5]));
    });
    Plotly.newPlot('modalKline',[{x:dates,y:closes,type:'scatter',mode:'lines',line:{color:'#FF6B35'}},{x:dates,y:vols,type:'bar',yaxis:'y2',marker:{color:'rgba(255,107,53,0.5)'}}],{paper_bgcolor:'#0D0D0D',plot_bgcolor:'#0D0D0D',xaxis:{tickcolor:'#333',gridcolor:'#222'},yaxis:{tickcolor:'#333',gridcolor:'#222'},yaxis2:{overlying:'y',side:'right'}},{responsive:true});
  }
}

function showPage(page) {
  document.querySelectorAll('.nav a').forEach(function(a){a.classList.remove('active');});
  event.target.classList.add('active');
  document.querySelectorAll('#page-dashboard,#page-screener,#page-portfolio,#page-analysis').forEach(function(p){p.style.display='none';});
  document.getElementById('page-'+page).style.display = 'block';
}

loadData();
</script>
</body>
</html>
