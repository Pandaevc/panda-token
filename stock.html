<html lang="zh-CN">
<head>

<title>股票管理系统 - 红熵AI</title>
<script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
<script>
function getQuickAnalysis(s) {
  // Comprehensive technical analysis - 统一的分析逻辑
  var history = s.history || [];
  var n = history.length;
  
  var signals = [];
  var score = 0;
  
  // Basic data
  if (n < 5) {
    return { rating: '中', cci: 0, ma5: 0, ma10: 0, ma20: 0, volumeRatio: 1, pattern: '数据不足', signals: [], score: 0 };
  }
  
  // Get recent prices
  var prices = history.slice(-20).map(function(h) { return parseFloat(h[2]); });
  var highs = history.slice(-20).map(function(h) { return parseFloat(h[3]); });
  var lows = history.slice(-20).map(function(h) { return parseFloat(h[4]); });
  var volumes = history.slice(-20).map(function(h) { return parseFloat(h[5]); });
  
  var currentPrice = prices[prices.length - 1];
  var todayClose = prices[prices.length - 1];
  var yesClose = prices[prices.length - 2];
  var todayVol = volumes[volumes.length - 1];
  var yesVol = volumes[volumes.length - 2];
  
  // Calculate MA
  var ma5 = prices.slice(-5).reduce(function(a, b) { return a + b; }, 0) / 5;
  var ma10 = prices.slice(-10).reduce(function(a, b) { return a + b; }, 0) / 10;
  var ma20 = prices.slice(-20).reduce(function(a, b) { return a + b; }, 0) / 20;
  
  // Calculate CCI
  var typicalPrices = history.slice(-14).map(function(h) {
    return (parseFloat(h[2]) + parseFloat(h[3]) + parseFloat(h[4])) / 3;
  });
  var sma = typicalPrices.reduce(function(a, b) { return a + b; }, 0) / typicalPrices.length;
  var meanDeviation = typicalPrices.reduce(function(a, b) { return a + Math.abs(b - sma); }, 0) / typicalPrices.length;
  var cci = meanDeviation === 0 ? 0 : (typicalPrices[typicalPrices.length - 1] - sma) / (0.015 * meanDeviation);
  
  // Volume analysis
  var avgVolume = volumes.reduce(function(a, b) { return a + b; }, 0) / volumes.length;
  var recentVolume = volumes.slice(-5).reduce(function(a, b) { return a + b; }, 0) / 5;
  var volumeRatio = recentVolume / avgVolume;
  
  // Support/Resistance
  var support = Math.min.apply(null, lows);
  var resistance = Math.max.apply(null, highs);
  
  // ===== 整合 analyzeStockTech 的分析逻辑 =====
  
  // 1. 量价关系
  if (todayVol > yesVol * 1.2 && todayClose > yesClose) {
    signals.push({ type: '📊 量价', desc: '放量上涨 - 主力积极', value: true });
    score += 2;
  } else if (todayVol < yesVol * 0.5 && todayClose < yesClose) {
    signals.push({ type: '📊 量价', desc: '缩量下跌 - 观望', value: false });
    score -= 1;
  }
  
  // 2. 资金流向
  var money = (s.mainMoney + s.superMoney) / 10000;
  if (money > 0) {
    signals.push({ type: '💵 资金', desc: '主力净流入 +' + money.toFixed(0) + '万', value: true });
    score += 2;
  } else {
    signals.push({ type: '💵 资金', desc: '主力净流出 ' + money.toFixed(0) + '万', value: false });
    score -= 2;
  }
  
  // 3. 突破压力位
  if (todayClose > resistance) {
    signals.push({ type: '🚀 突破', desc: '突破压力位 ' + resistance.toFixed(2), value: true });
    score += 3;
  }
  
  // 4. 支撑位站稳
  if (todayClose > support && todayClose < resistance) {
    signals.push({ type: '✅ 支撑', desc: '站稳支撑位 ' + support.toFixed(2), value: true });
    score += 1;
  }
  
  // 5. 缺口分析
  if (n >= 2) {
    var gap = parseFloat(history[history.length-1][1]) - yesClose;
    var gapPct = gap / yesClose * 100;
    if (gapPct > 3) {
      signals.push({ type: '⚠️ 缺口', desc: '上方缺口 ' + gapPct.toFixed(2) + '% (建议等回补)', value: false });
      score -= 2;
    } else if (gapPct < -3) {
      signals.push({ type: '✅ 缺口', desc: '下方缺口 ' + Math.abs(gapPct).toFixed(2) + '% (可能支撑)', value: true });
      score += 1;
    }
  }
  
  // 6. 二波上攻形态
  if (n >= 20) {
    var firstHalf = prices.slice(-20, -10);
    var secondHalf = prices.slice(-10);
    var firstAvg = firstHalf.reduce(function(a,b){return a+b},0)/firstHalf.length;
    var secondAvg = secondHalf.reduce(function(a,b){return a+b},0)/secondHalf.length;
    if (secondAvg > firstAvg * 1.1 && todayClose > secondHalf[0]) {
      signals.push({ type: '🌊 二波', desc: '二波上攻形态 - 强势信号', value: true });
      score += 3;
    }
  }
  
  // 7. 主力坚决度
  var avgVol5 = volumes.slice(-5).reduce(function(a,b){return a+parseFloat(b)},0)/5;
  if (todayVol > avgVol5 * 1.5) {
    signals.push({ type: '💪 坚决', desc: '成交量放大 主力可能行动', value: true });
    score += 1;
  } else if (todayVol < avgVol5 * 0.5) {
    signals.push({ type: '😰 犹豫', desc: '缩量 主力不坚决', value: false });
    score -= 1;
  }
  
  // 8. CCI 指标
  if (cci > 100) {
    signals.push({ type: '📉 CCI', desc: 'CCI=' + cci.toFixed(0) + ' 超买区域', value: false });
    score -= 2;
  } else if (cci < -100) {
    signals.push({ type: '📈 CCI', desc: 'CCI=' + cci.toFixed(0) + ' 超卖区域，可能反弹', value: true });
    score += 3;
  } else if (cci > 0) {
    signals.push({ type: '📈 CCI', desc: 'CCI=' + cci.toFixed(0) + ' 多头趋势', value: true });
    score += 1;
  } else {
    signals.push({ type: '📉 CCI', desc: 'CCI=' + cci.toFixed(0) + ' 空头趋势', value: false });
    score -= 1;
  }
  
  // 9. 均线系统
  if (currentPrice > ma5 && ma5 > ma10 && ma10 > ma20) {
    signals.push({ type: '📊 均线', desc: 'MA5>MA10>MA20 多头排列', value: true });
    score += 3;
  } else if (currentPrice < ma5 && ma5 < ma10 && ma10 < ma20) {
    signals.push({ type: '📊 均线', desc: 'MA5<MA10<MA20 空头排列', value: false });
    score -= 3;
  }
  
  // 10. 换手率
  if (s.turnover > 8) {
    signals.push({ type: '🔥 换手', desc: '换手率较高 ' + s.turnover.toFixed(1) + '%', value: false });
    score -= 1;
  } else if (s.turnover > 3) {
    signals.push({ type: '🔥 换手', desc: '换手率适中 ' + s.turnover.toFixed(1) + '%', value: true });
    score += 1;
  }
  
  // K线形态
  var pattern = recognizePattern(history.slice(-5), prices);
  if (pattern.includes('突破') || pattern.includes('启明星')) {
    signals.push({ type: '🕯️ 形态', desc: pattern, value: true });
    score += 2;
  } else if (pattern.includes('黄昏') || pattern.includes('吞没')) {
    signals.push({ type: '🕯️ 形态', desc: pattern, value: false });
    score -= 2;
  }
  
  // Rating
  var rating = score >= 5 ? '强' : score >= 0 ? '中' : '弱';
  
  return {
    rating: rating,
    score: score,
    cci: cci,
    ma5: ma5,
    ma10: ma10,
    ma20: ma20,
    volumeRatio: volumeRatio,
    pattern: pattern,
    signals: signals,
    support: support,
    resistance: resistance,
    change5: (prices[prices.length - 1] - prices[prices.length - 6]) / prices[prices.length - 6] * 100
  };
}

function estimateChipDistribution(prices, currentPrice) {
  // Simplified chip distribution estimation
  if (!prices || prices.length < 10) {
    return { concentrated: 50, scattered: 30, average: 50 };
  }
  
  var max = Math.max.apply(null, prices);
  var min = Math.min.apply(null, prices);
  var range = max - min;
  if (range === 0) return { concentrated: 50, scattered: 30, average: 50 };
  
  // Calculate how many chips are near current price
  var nearCurrent = prices.filter(function(p) {
    return Math.abs(p - currentPrice) / range < 0.2;
  }).length;
  
  var concentrated = (nearCurrent / prices.length) * 100;
  var scattered = 100 - concentrated;
  
  return {
    concentrated: Math.round(concentrated),
    scattered: Math.round(scattered),
    average: Math.round(100 - Math.abs(currentPrice - (max + min) / 2) / range * 100)
  };
}

function recognizePattern(recentKLines, prices) {
  if (!recentKLines || recentKLines.length < 3) return '整理';
  
  var last = recentKLines[recentKLines.length - 1];
  var prev = recentKLines[recentKLines.length - 2];
  
  var lastOpen = parseFloat(last[1]);
  var lastClose = parseFloat(last[2]);
  var lastHigh = parseFloat(last[3]);
  var lastLow = parseFloat(last[4]);
  
  var prevOpen = parseFloat(prev[1]);
  var prevClose = parseFloat(prev[2]);
  
  var lastBody = Math.abs(lastClose - lastOpen);
  var lastRange = lastHigh - lastLow;
  
  // Hammer / Inverted Hammer (bullish)
  if (lastBody < lastRange * 0.3 && lastLow < Math.min(lastOpen, lastClose)) {
    return '锤子线(可能反转)';
  }
  
  // Shooting Star (bearish)
  if (lastBody < lastRange * 0.3 && lastHigh > Math.max(lastOpen, lastClose)) {
    return '射击之星(可能反转)';
  }
  
  // Doji
  if (lastBody < lastRange * 0.1) {
    return '十字星(观望)';
  }
  
  // Engulfing - Bullish
  if (lastClose > lastOpen && prevClose < prevOpen && lastClose > prevOpen && lastOpen < prevClose) {
    return '看涨吞没(突破)';
  }
  
  // Engulfing - Bearish
  if (lastClose < lastOpen && prevClose > prevOpen && lastClose < prevOpen && lastOpen > prevClose) {
    return '看跌吞没(反转)';
  }
  
  // Morning Star (bullish)
  if (recentKLines.length >= 3) {
    var prev2 = recentKLines[recentKLines.length - 3];
    var prev2Close = parseFloat(prev2[2]);
    if (prevClose < prevOpen && lastClose > lastOpen && lastClose > (prevOpen + prev2Close) / 2) {
      return '早晨之星(启明星)';
    }
  }
  
  // Evening Star (bearish)
  if (recentKLines.length >= 3) {
    var prev2 = recentKLines[recentKLines.length - 3];
    var prev2Close = parseFloat(prev2[2]);
    if (prevClose > prevOpen && lastClose < lastOpen && lastClose < (prevOpen + prev2Close) / 2) {
      return '黄昏之星(反转)';
    }
  }
  
  // Trend
  var change = (prices[prices.length - 1] - prices[0]) / prices[0] * 100;
  if (change > 5) return '上涨趋势';
  if (change < -5) return '下跌趋势';
  
  return '震荡整理';
}

// Modal functions - 放在前面确保在renderPortfolio之前定义
function showModal(title, content) {
  var modal = document.getElementById('analysisModal');
  var modalTitle = document.getElementById('modalTitle');
  var modalBody = document.getElementById('modalBody');
  modalTitle.innerHTML = title;
  modalBody.innerHTML = content;
  modal.classList.add('show');
}

function hideModal() {
  var modal = document.getElementById('analysisModal');
  modal.classList.remove('show');
}

  analysisHtml += '<div style="background:#0D0D0D;padding:12px;border-radius:8px;margin-bottom:16px"><div style="color:#666;font-size:11px;margin-bottom:8px">📋 综合建议</div><div style="color:'+rec.color+';font-size:20px;font-weight:700">'+rec.action+'</div><div style="color:#888;margin-top:4px">'+rec.reason+'</div></div>';
  
  // Technical indicators - CCI

  analysisHtml += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';

  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">CCI值</div><div style="color:'+cciColor+';font-weight:700">'+(analysis.cci||0).toFixed(0)+'</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">CCI状态</div><div style="color:#FFF">'+(analysis.cci > 100 ? '超买' : analysis.cci < -100 ? '超卖' : '正常')+'</div></div>';
  analysisHtml += '</div></div>';
  
  // MA indicators
  analysisHtml += '<div style="margin-bottom:12px"><div style="color:#666;font-size:12px;margin-bottom:8px">📊 均线系统</div>';
  analysisHtml += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">MA5</div><div style="color:#FFF">'+(analysis.ma5||0).toFixed(2)+'</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">MA10</div><div style="color:#FFF">'+(analysis.ma10||0).toFixed(2)+'</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">MA20</div><div style="color:#FFF">'+(analysis.ma20||0).toFixed(2)+'</div></div>';
  analysisHtml += '</div></div>';
  
  // K-line pattern
  analysisHtml += '<div style="margin-bottom:12px"><div style="color:#666;font-size:12px;margin-bottom:8px">🕯️ K线形态</div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:12px;border-radius:8px"><span style="color:'+(analysis.pattern.includes('上涨')||analysis.pattern.includes('突破')||analysis.pattern.includes('启明星')?'#2ED573':analysis.pattern.includes('下跌')||analysis.pattern.includes('反转')||analysis.pattern.includes('黄昏')?'#FF4757':'#FFD700')+';font-weight:600">'+analysis.pattern+'</span></div></div>';

  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">支撑位</div><div style="color:#2ED573;font-weight:700">'+(analysis.support||levels.support).toFixed(2)+'</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">阻力位</div><div style="color:#FF4757;font-weight:700">'+(analysis.resistance||levels.resistance).toFixed(2)+'</div></div>';
  analysisHtml += '</div></div>';
  
  // All signals

    analysisHtml += '<div style="margin-bottom:12px"><div style="color:#666;font-size:12px;margin-bottom:8px">💡 技术信号 ('+analysis.signals.length+'项)</div>';
    analysisHtml += '<div style="background:#0D0D0D;padding:12px;border-radius:8px;max-height:200px;overflow-y:auto">';
    analysis.signals.forEach(function(sig) {

      analysisHtml += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222"><span style="color:'+sigColor+'">'+(sig.value ? '✅' : '❌')+' '+sig.type+'</span><span style="color:#888;font-size:11px">'+sig.desc+'</span></div>';
    });
    analysisHtml += '</div></div>';
  }
  
  // Money flow
  analysisHtml += '<div style="margin-bottom:12px"><div style="color:#666;font-size:12px;margin-bottom:8px">💰 资金流向</div>';
  analysisHtml += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">主力净流入</div><div style="color:'+((s.mainMoney||0)>=0?'#FF4757':'#2ED573')+'">'+(s.mainMoney||0).toFixed(2)+'万</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">超大单</div><div style="color:'+((s.superMoney||0)>=0?'#FF4757':'#2ED573')+'">'+(s.superMoney||0).toFixed(2)+'万</div></div>';
  analysisHtml += '<div style="background:#0D0D0D;padding:10px;border-radius:8px"><div style="color:#666;font-size:10px">大单</div><div style="color:'+((s.largeMoney||0)>=0?'#FF4757':'#2ED573')+'">'+(s.largeMoney||0).toFixed(2)+'万</div></div>';
  analysisHtml += '</div></div>';
  
  // Risk assessment
  var risks = [];
  if (profit > 25) risks.push('⚠️ 盈利超过25%，注意止盈');
  if (profit < -8) risks.push('⚠️ 亏损超过8%，注意止损');
  if (s.change > 5) risks.push('⚠️ 今日涨幅较大，谨防回调');
  if (s.change < -5) risks.push('⚠️ 今日跌幅较大，关注支撑');
  if (s.mainMoney < -10) risks.push('⚠️ 主力资金净流出，注意风险');
  if (s.turnover > 8) risks.push('⚠️ 换手率较高，波动较大');
  if (s.isST) risks.push('⚠️ ST股票，风险较高');
  if (analysis.cci > 100) risks.push('⚠️ CCI超买区域，谨防回调');
  if (analysis.cci < -100) risks.push('✅ CCI超卖区域，存在反弹机会');
  
  if (risks.length > 0) {
    analysisHtml += '<div style="margin-bottom:12px"><div style="color:#666;font-size:12px;margin-bottom:8px">⚡ 综合风险评估</div>';
    analysisHtml += '<div style="background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);padding:12px;border-radius:8px">';
    risks.forEach(function(risk) {
      analysisHtml += '<div style="padding:2px 0">'+risk+'</div>';
    });
    analysisHtml += '</div></div>';
  }
  
  // Add time
  analysisHtml += '<div style="color:#666;font-size:11px;text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #333">添加时间: '+new Date(p.addTime).toLocaleString()+'</div>';
  
  analysisHtml += '</div>';
  
  showModal(p.name + ' (' + code + ')', analysisHtml);
}

function getRecommendation(s, profit, analysis) {
  var rec = {action: '持有', reason: '观望', color: '#FFD700'};
  
  // Use comprehensive analysis score
  var score = analysis.score || 0;
  var signals = analysis.signals || [];
  var rating = analysis.rating || '中';
  
  // Hot sector check
  var isHot = s.hotConcept || (s.sectorName && (s.sectorName.indexOf('科技') >= 0 || s.sectorName.indexOf('AI') >= 0 || s.sectorName.indexOf('新能源') >= 0 || s.sectorName.indexOf('芯片') >= 0));
  
  // Get key signals
  var hasCCIOversold = signals.some(function(sig) { return sig.type === 'CCI超卖'; });
  var hasCCIOverbought = signals.some(function(sig) { return sig.type === 'CCI超买'; });
  var hasMALong = signals.some(function(sig) { return sig.type === '均线多头'; });
  var hasMAShort = signals.some(function(sig) { return sig.type === '均线空头'; });
  var hasVolumeUp = signals.some(function(sig) { return sig.type === '放量'; });
  var hasPatternUp = signals.some(function(sig) { return sig.type === 'K线突破'; });
  var hasPatternDown = signals.some(function(sig) { return sig.type === 'K线反转'; });
  
  // Determine recommendation based on comprehensive analysis
  if (score >= 8 && (hasMALong || hasPatternUp)) {
    if (profit < 5) {
      rec = {action: '加仓', reason: '技术面强势，建议加仓', color: '#FF4757'};
    } else if (profit < 15) {
      rec = {action: '持有', reason: '趋势良好，继续持有', color: '#2ED573'};
    } else {
      rec = {action: '持有', reason: '盈利可观，继续持有观察', color: '#2ED573'};
    }
  } else if (score >= 5 && hasCCIOversold) {
    rec = {action: '持有', reason: 'CCI超卖，有反弹预期', color: '#FFD700'};
  } else if (hasCCIOverbought && profit > 10) {
    rec = {action: '减仓', reason: 'CCI超买，建议减仓锁定利润', color: '#FF4757'};
  } else if (hasMAShort || hasPatternDown) {
    if (profit < -5) {
      rec = {action: '清仓', reason: '技术面走弱，建议清仓', color: '#FF4757'};
    } else if (profit > 5) {
      rec = {action: '减仓', reason: '趋势转弱，减仓观望', color: '#FF4757'};
    } else {
      rec = {action: '持有', reason: '注意风险，观望为主', color: '#FFD700'};
    }
  } else if (score <= -5) {
    if (profit < -8) {
      rec = {action: '清仓', reason: '技术面弱势，亏损较大建议清仓', color: '#FF4757'};
    } else if (profit < -3) {
      rec = {action: '减仓', reason: '技术面走弱，降低仓位', color: '#FF4757'};
    } else {
      rec = {action: '持有', reason: '走势偏弱，谨慎观望', color: '#FFD700'};
    }
  } else if (isHot && score >= 3 && profit < 20) {
    rec = {action: '持有', reason: '热门赛道，继续持有', color: '#2ED573'};
  } else if (analysis.chipDistribution && analysis.chipDistribution.concentrated > 70) {
    rec = {action: '持有', reason: '筹码集中，注意变盘', color: '#FFD700'};
  } else if (profit > 25) {
    rec = {action: '减仓', reason: '盈利已达25%，建议部分止盈', color: '#FF4757'};
  } else if (profit < -10) {
    rec = {action: '清仓', reason: '亏损超过10%，建议止损', color: '#FF4757'};
  } else if (rating === '强') {
    rec = {action: '持有', reason: '形态良好，继续持有', color: '#2ED573'};
  } else if (rating === '弱') {
    rec = {action: '持有', reason: '走势偏弱，谨慎观望', color: '#FFD700'};
  } else {
    var defaultReasons = ['震荡整理，观望为主', '趋势不明，建议持有观望', '技术面中性，继续观察'];
    rec = {action: '持有', reason: defaultReasons[Math.floor(Math.random() * defaultReasons.length)], color: '#FFD700'};
  }
  
  return rec;
}

<script>

// Backend API - change to your server URL

var stockCache = {};
var db = {portfolio: [], picks: []};

function loadData() {
  try {
    var s = localStorage.getItem('stock_db');
    if (s) {
      db = JSON.parse(s);
    }
  } catch(e) {
    db = {portfolio: [], picks: []};

  renderPortfolio();
}

async function saveData() {
  localStorage.setItem('stock_db', JSON.stringify(db));
  
  // Also save to backend
  try {
    for (var p of db.portfolio) {
      await fetch(API_URL + '/api/portfolio', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(p)
      });
    }
  } catch(e) {}
}

async function getStockData(code) {
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2.eastmoney.com/api/qt/stock/get?fltt=2&fields=f2,f3,f4,f7,f8,f5,f6,f9,f10,f11,f12,f13,f14,f15,f16,f17,f18,f20,f21,f22,f23,f24,f25,f37,f38,f39,f40,f41,f42,f43,f44,f45,f46,f47,f48,f49,f50,f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f62,f84,f85,f86,f87,f88,f89,f90,f91,f92,f93,f94,f95,f96,f97,f98,f99,f100,f101,f102,f103,f104,f105,f106,f107,f108,f109,f110,f111,f112,f113,f114,f115,f116,f117,f118,f119,f120,f121,f122,f123,f124,f125,f126,f127,f128,f129,f130,f131,f132,f133,f134,f135,f136,f137,f138,f139,f140,f141,f142,f143,f144,f145,f146,f147,f148,f149,f150,f151,f152,f153,f154,f155,f156,f157,f158,f159,f160,f161,f162,f163,f164,f165,f166,f167,f168,f169,f170,f171,f173,f174,f175,f176,f177,f178,f179,f180,f181,f182,f183,f184,f185,f186,f187,f188,f189,f190,f191,f192,f193,f194,f195,f196,f197,f198,f199,f200,f201,f202,f203,f204,f205,f206,f207,f208,f209,f210,f211,f212,f213,f214,f215,f216,f217,f218,f219,f220,f221,f222,f223,f224,f225&secid=' + secid;
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data) {
      var d = data.data;
      var name = d.f58 || '';
      return {code: code, name: name, price: d.f43, change: d.f170, volume: d.f47/10000, amount: d.f48/100000000, turnover: d.f50, market: d.f116/100000000, high: d.f44, low: d.f45, open: d.f46, isST: name.includes('ST') || name.includes('*ST'), up: d.f44 === d.f60, mainMoney: d.f184||0, superMoney: d.f185||0, largeMoney: d.f186||0};
    }
  } catch(e) {}
  return null;
}

async function getStockWithHistory(code) {
  var stock = await getStockData(code);
  if (!stock) return null;
  var secid = code.startsWith('6') ? '1.' + code : '0.' + code;
  var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+secid+'&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=0&beg=20250101&end=20260221&lmt=60';
  try {
    var res = await fetch(url);
    var data = await res.json();
    if (data.data && data.data.klines) {
      stock.history = data.data.klines.map(function(k) { return k.split(','); });
    }
  } catch(e) {}
  return stock;
}

var allStocks = [];

async function loadStocks() {
  if (allStocks.length > 0) return;
  var codes = [];
  for (var i = 600000; i < 604000; i++) codes.push(i.toString());
  for (var i = 300000; i < 303000; i++) codes.push(i.toString());
  for (var i = 688000; i < 692000; i++) codes.push(i.toString());
  allStocks = [];
  for (var i = 0; i < Math.min(codes.length, 180); i += 18) {
    var promises = codes.slice(i, i+18).map(function(c) { return getStockWithHistory(c); });
    var results = await Promise.all(promises);
    results.forEach(function(s) { if (s && s.price > 0) { allStocks.push(s); stockCache[s.code] = s; } });
  }
}

async function runScreener() {
  await loadStocks();
  document.getElementById('screenerResult').innerHTML = '<div class="loading">筛选中...</div>';
  var changeTh = parseFloat(document.getElementById('filterChange').value);
  var turnoverTh = parseFloat(document.getElementById('filterTurnover').value);
  var amountTh = parseFloat(document.getElementById('filterAmount').value);
  var marketMax = parseFloat(document.getElementById('filterMarket').value);
  var filterMoney = document.getElementById('filterMoney').value;
  var volPrice = document.getElementById('filterVolumePrice').value;
  var tech = document.getElementById('filterTech').value;
  var noST = document.getElementById('filterNoST').checked;
  
  var results = allStocks.filter(function(s) {
    if (noST && s.isST) return false;
    if (changeTh > 0 && s.change < changeTh) return false;
    if (turnoverTh > 0 && s.turnover < turnoverTh) return false;
    if (amountTh > 0 && s.amount < amountTh) return false;
    if (marketMax > 0 && s.market > marketMax) return false;
    if (filterMoney === 'main' && s.mainMoney <= 0) return false;
    if (volPrice !== '0' && s.history && s.history.length >= 2) {
      var today = s.history[s.history.length-1], yes = s.history[s.history.length-2];
      var todayVol = parseFloat(today[5]), yesVol = parseFloat(yes[5]);
      var todayClose = parseFloat(today[2]), yesClose = parseFloat(yes[2]);
      if (volPrice === 'up' && (todayVol <= yesVol || todayClose <= yesClose)) return false;
      if (volPrice === 'vol' && (todayVol <= yesVol * 1.2 || todayClose <= yesClose)) return false;
    }
    if (tech === 'limitup' && s.history) {
      var hasLimit = false;
      for (var j = 0; j < Math.min(s.history.length, 10); j++) {
        var o = parseFloat(s.history[j][1]), c = parseFloat(s.history[j][2]);
        if ((c - o) / o * 100 >= 9.9) { hasLimit = true; break; }
      }
      if (!hasLimit) return false;
    }
    return true;
  }).sort(function(a, b) { return b.change - a.change; }).slice(0, 30);
  
  if (results.length === 0) {
    document.getElementById('screenerResult').innerHTML = '<div style="color:#666;text-align:center;padding:40px">没有符合条件的股票</div>';
    return;
  }

function calcSupportResistance(s) {
  if (!s.history || s.history.length < 20) return {support: s.price * 0.95, resistance: s.price * 1.05};
  var highs = s.history.map(function(h) { return parseFloat(h[3]); });
  var lows = s.history.map(function(h) { return parseFloat(h[4]); });
  var recentHighs = highs.slice(-20);
  var recentLows = lows.slice(-20);
  var max = Math.max.apply(null, recentHighs);
  var min = Math.min.apply(null, recentLows);
  return {support: min, resistance: max};
}

function analyzeStockTech(s, pos) {
  var signals = [];
  var score = 0;
  if (!s.history || s.history.length < 5) {
    return {signals: [{type: '⚠️', desc: '数据不足'}], rating: '中'};
  }
  var h = s.history;
  var today = h[h.length - 1], yesterday = h[h.length - 2];
  var todayClose = parseFloat(today[2]), todayOpen = parseFloat(today[1]), todayHigh = parseFloat(today[3]), todayLow = parseFloat(today[4]);
  var yesClose = parseFloat(yesterday[2]);
  var todayVol = parseFloat(today[5]), yesVol = parseFloat(yesterday[5]);
  
  // 1. 量价关系
  if (todayVol > yesVol * 1.2 && todayClose > yesClose) {
    signals.push({type: '📊 量价', desc: '放量上涨 - 主力积极', value: true});
    score += 2;
  } else if (todayVol < yesVol * 0.5 && todayClose < yesClose) {
    signals.push({type: '📊 量价', desc: '缩量下跌 - 观望', value: false});
    score -= 1;
  }
  
  // 2. 资金流向
  var money = (s.mainMoney + s.superMoney) / 10000;
  if (money > 0) {
    signals.push({type: '💵 资金', desc: '主力净流入 +' + money.toFixed(0) + '万', value: true});
    score += 2;
  } else {
    signals.push({type: '💵 资金', desc: '主力净流出 ' + money.toFixed(0) + '万', value: false});
    score -= 2;
  }
  
  // 3. 突破压力位
  var levels = calcSupportResistance(s);
  if (todayClose > levels.resistance) {
    signals.push({type: '🚀 突破', desc: '突破压力位 ' + levels.resistance.toFixed(2), value: true});
    score += 3;
  }
  
  // 4. 支撑位站稳
  if (todayClose > levels.support && todayClose < levels.resistance) {
    signals.push({type: '✅ 支撑', desc: '站稳支撑位 ' + levels.support.toFixed(2), value: true});
    score += 1;
  }
  
  // 5. 缺口分析 (Boss提到的)
  if (h.length >= 2) {
    var gap = todayOpen - yesClose;
    var gapPct = gap / yesClose * 100;
    if (gapPct > 3) {
      signals.push({type: '⚠️ 缺口', desc: '上方缺口 ' + gapPct.toFixed(2) + '% (建议等回补)', value: false});
      score -= 2;
    } else if (gapPct < -3) {
      signals.push({type: '✅ 缺口', desc: '下方缺口 ' + Math.abs(gapPct).toFixed(2) + '% (可能支撑)', value: true});
      score += 1;
    }
  }
  
  // 6. 二波上攻形态 (Boss提到的600410类型)
  if (h.length >= 20) {
    var recent = h.slice(-20);
    var firstHalf = recent.slice(0, 10);
    var secondHalf = recent.slice(10);
    var firstAvg = firstHalf.reduce(function(a,b){return a+parseFloat(b[2])},0)/10;
    var secondAvg = secondHalf.reduce(function(a,b){return a+parseFloat(b[2])},0)/10;
    if (secondAvg > firstAvg * 1.1 && todayClose > parseFloat(secondHalf[secondHalf.length-1][1])) {
      signals.push({type: '🌊 二波', desc: '二波上攻形态 - 强势信号', value: true});
      score += 3;
    }
  }
  
  // 7. 主力坚决度 (Boss提到的300499)
  var avgVol = h.slice(-5).reduce(function(a,b){return a+parseFloat(b[5])},0)/5;
  if (todayVol > avgVol * 1.5) {
    signals.push({type: '💪 坚决', desc: '成交量放大 主力可能行动', value: true});
    score += 1;
  } else if (todayVol < avgVol * 0.5) {
    signals.push({type: '😰 犹豫', desc: '缩量 主力不坚决', value: false});
    score -= 1;
  }
  
  var rating = score >= 5 ? '强' : score >= 0 ? '中' : '弱';
  return {signals: signals, rating: rating, support: levels.support, resistance: levels.resistance};
}

function handleCSVImport(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split(/[\n\r]+/);
    var added = 0;
    var debug = [];
    
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line.length < 4) continue;
      
      // Skip header
      if (line.indexOf("股票") >= 0 && line.indexOf("代码") >= 0) continue;
      
      // Split by comma or tab
      var parts = line.split(/[,，\t]+/);
      
      // Try to find: code, shares, price
      var code = "";
      var shares = 100;
      var price = 10;
      var name = "";
      
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j].trim();
        if (!p) continue;
        
        // Is it a 6-digit number?
        if (/^\d{6}$/.test(p)) {
          code = p;
        }
        // Is it a number?
        else if (/^\d+(\.\d+)?$/.test(p)) {
          var n = parseFloat(p);
          if (!shares || shares === 100) shares = n;
          else if (!price || price === 10) price = n;
        }
        // Otherwise it's text (name)
        else if (p.length > 0 && !/^\d+$/.test(p)) {
          name = p;
        }
      }
      
      // Validate code
      if (!code || code.length !== 6) continue;
      
      // First digit should be 6, 0, or 3
      var first = code.charAt(0);
      if (first !== "6" && first !== "0" && first !== "3" && code.substring(0,2) !== "68") continue;
      
      // If shares is small (<=100), make it bigger (probably wrong)
      
      
      // Check if exists
      var exists = false;
      for (var k = 0; k < db.portfolio.length; k++) {
        if (db.portfolio[k].code === code) { exists = true; break; }
      }
      if (!exists) {
        db.portfolio.push({
          code: code,
          name: name || code,
          shares: shares,
          buyPrice: price,
          sector: "",
          addTime: Date.now()
        });
        added++;
      }
    }
    
    if (added > 0) {
      saveData();
      renderPortfolio();
      alert("成功导入 " + added + " 只股票！");
    } else {
      alert("未找到新股票\n格式：名称,代码,数量,价格");
    }
  };
  reader.readAsText(file);
}
